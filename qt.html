<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>발표문 · 말씀 클래스</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b1d21;--sub:#6b7280;--mute:#9aa1ab;--line:#e6e8ec;--accent:#12a37a;--accent-d:#0b6e53;--accent-soft:#e3f5ee;--danger:#c0392b;--danger-soft:#fdecea}
@media (prefers-color-scheme: dark){:root{--bg:#121417;--card:#1b1e23;--ink:#eceef1;--sub:#9aa1ab;--mute:#6c737d;--line:#2b2f36;--accent:#3cc99c;--accent-d:#8fe3c4;--accent-soft:#163a2f;--danger:#ff8a7a;--danger-soft:#3a1d1a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 16px calc(90px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(18px + env(safe-area-inset-top)) 2px 14px}
.brand small{display:block;font-size:12.5px;color:var(--accent);font-weight:500}
.brand h1{margin:1px 0 0;font-size:22px;letter-spacing:-.3px}
.me{display:flex;align-items:center;gap:8px}
.me img{width:32px;height:32px;border-radius:50%}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.del{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5}
.wbtn{text-decoration:none;width:100%;justify-content:center;padding:12px;font-size:15px;margin:2px 0 14px}
.tb{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:var(--card);padding:6px;position:sticky;top:0;z-index:3}
.tb button{border:0;background:none;color:var(--ink);min-width:36px;height:34px;border-radius:8px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 7px}
.tb button:active,.tb button.on{background:var(--line)}
.tb .tbr{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tb .tbr::-webkit-scrollbar{display:none}
.tb .tbr button{flex:none}
.tb .dv{flex:none;width:1px;background:var(--line);margin:6px 3px}
.tb .pvb{flex:none;border-left:1px solid var(--line);border-radius:0 8px 8px 0}
.tb button:disabled{opacity:.35}
.pal{position:absolute;left:6px;right:6px;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;gap:4px;flex-wrap:wrap;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.pal[hidden]{display:none}
.pal button{gap:4px;font-size:13.5px}
.tb + textarea.f,.tb + textarea.f + .prev{border-top-left-radius:0;border-top-right-radius:0}
.prev{border:1px solid var(--line);border-radius:0 0 12px 12px;background:#fff;color:#1b1d21;padding:18px 16px;min-height:300px}
.rich h3{font-size:1.08em;margin:1.1em 0 .35em;padding-bottom:3px;border-bottom:1px solid #e3e5e9}
.rich h3:first-child{margin-top:0}
.rich p{margin:0 0 .6em}
.rich ul,.rich ol{margin:0 0 .6em;padding-left:1.4em}
.rich blockquote{margin:.2em 0 .7em;padding:.4em .9em;border-left:3px solid #9aa3ad;background:#f4f5f7;color:#3d4249}
.rich hr{border:0;border-top:1px solid #d9dce1;margin:1em 0}
.rich mark{background:#fff1a8;padding:0 2px}
.rich h2{font-size:1.3em;margin:1em 0 .45em;line-height:1.4}
.rich h2:first-child{margin-top:0}
.rich .c{text-align:center}.rich .r{text-align:right}
.rich blockquote.box{border:1px solid #c9dccd;border-left:4px solid #2f8f5b;background:#eef7f0;color:#1b1d21;border-radius:6px}
.rich ul.chk{list-style:none;padding-left:.2em}
.rich ul.chk .cb{display:inline-block;width:.9em;height:.9em;border:1.5px solid #6b7280;border-radius:3px;margin-right:.45em;vertical-align:-.1em;position:relative}
.rich ul.chk .cb.on{background:#2f8f5b;border-color:#2f8f5b}
.rich ul.chk .cb.on::after{content:'';position:absolute;left:.26em;top:.06em;width:.22em;height:.45em;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.notice{background:var(--accent-soft);color:var(--accent-d);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin-bottom:14px}
.notice.warn{background:var(--danger-soft);color:var(--danger)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.item{display:block;text-decoration:none;color:inherit}
.item .t{font-size:16px;font-weight:500;line-height:1.4;margin:4px 0}
.item .ex{font-size:13.5px;color:var(--sub);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.tag{display:inline-block;font-size:11.5px;color:var(--accent-d);background:var(--accent-soft);padding:2px 8px;border-radius:999px}
.badge{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--sub)}
.badge.admin{border-color:var(--accent);color:var(--accent-d)}
.badge.owner{background:var(--accent);border-color:var(--accent);color:#fff}
.sec{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.sec h2{font-size:17px;margin:0}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:28px 10px;line-height:1.7}
.post h2{font-size:21px;margin:6px 0 8px;line-height:1.35}
.paper{background:#fff;color:#1b1d21;border-radius:4px;box-shadow:0 2px 14px rgba(0,0,0,.12);padding:9% 8.5%;aspect-ratio:210/297;min-height:0;margin:10px 0 0;overflow:hidden}
.paper.long{aspect-ratio:auto}
.paper .ph{font-size:12px;color:#6b7280;display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #d9dce1;padding-bottom:8px;margin-bottom:14px}
.paper h1{font-size:clamp(17px,4.6vw,22px);text-align:center;margin:4px 0 4px;line-height:1.4}
.paper .by{text-align:center;font-size:12.5px;color:#6b7280;margin-bottom:18px}
.paper .doc{font-size:clamp(12.5px,3.4vw,14.5px);line-height:1.85;word-break:keep-all}
.prev.rich{font-size:14.5px;line-height:1.85;word-break:keep-all}
.cnt{font-size:12px;color:var(--mute);text-align:right;margin-top:4px}
.cnt.over{color:var(--danger)}
textarea.big{min-height:60vh}
@media print{
  @page{size:A4;margin:18mm 16mm}
  body{background:#fff}
  body *{visibility:hidden}
  .paper,.paper *{visibility:visible}
  .paper{position:absolute;left:0;top:0;width:100%;box-shadow:none;padding:0;aspect-ratio:auto;border-radius:0}
  .paper .doc{font-size:11pt}
}
.post h3{font-size:14px;color:var(--accent-d);margin:18px 0 6px}
.post .body{font-size:15.5px;line-height:1.85;white-space:pre-wrap;word-break:keep-all}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.cm{padding:12px 0;border-top:1px solid var(--line)}
.cm:first-child{border-top:0}
.cm .who{font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center}
.cm .tx{font-size:14.5px;line-height:1.7;white-space:pre-wrap;margin-top:3px}
.cm .x{margin-left:auto;border:0;background:none;color:var(--mute);cursor:pointer;font-size:12.5px}
label.f{display:block;font-size:13px;font-weight:500;margin:14px 0 6px}
input.f,textarea.f,select.f{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;font-size:15px;outline:none}
textarea.f{min-height:120px;resize:vertical;line-height:1.7}
input.f:focus,textarea.f:focus,select.f:focus{border-color:var(--accent)}
.hint{font-size:12px;color:var(--mute);margin-top:4px}
.row{display:flex;gap:8px;align-items:center}
.urow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.urow img{width:34px;height:34px;border-radius:50%;flex:none;background:var(--line)}
.urow .nm{flex:1;min-width:0}
.urow .nm b{display:block;font-size:14px;font-weight:500}
.urow .nm span{font-size:12px;color:var(--sub);word-break:break-all}
.urow select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;font-size:13px}
.more{display:block;width:100%;margin-top:6px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:9;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;display:none}
.fab.on{display:block}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:560px;margin:0 auto;display:flex}
.nav a{flex:1;text-align:center;padding:9px 0 10px;font-size:11.5px;color:var(--mute);text-decoration:none}
.nav a i{display:block;font-size:23px;margin-bottom:1px}
.nav a.on{color:var(--accent-d)}
.week{display:flex;gap:4px;margin-bottom:12px}
.week button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 0 7px;cursor:pointer;color:var(--sub);font-size:14px}
.week button small{display:block;font-size:11px;color:var(--mute);margin-top:1px}
.week button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.week button.on small{color:#e3f5ee}
.week button.today:not(.on){border-color:var(--accent);color:var(--accent-d)}
.srow{display:flex;gap:12px;align-items:center}
.srow .th{flex:none;width:92px;aspect-ratio:16/9;border-radius:8px;background:#2c2c2a center/cover no-repeat}
.srow .bd{flex:1;min-width:0}
.srow .t{font-size:15px;margin:2px 0}
.qc{font-size:12.5px;color:var(--accent-d);font-weight:500}
.qc.zero{color:var(--mute);font-weight:400}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{width:100%;max-width:420px;margin:0}
.me .nm{font-size:13px;font-weight:500;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><small>세종월드교회</small><h1>발표문</h1></div>
    <div class="me" id="me"></div>
  </div>
  <div id="status"></div>
  <main id="view"><div class="empty">불러오는 중…</div></main>
</div>

<nav class="nav"><div class="in">
  <a href="sermon.html"><i class="ti ti-home"></i>홈</a>
  <a href="qt.html" class="on"><i class="ti ti-notes"></i>발표문</a>
  <a href="sermon.html#saved"><i class="ti ti-bookmark"></i>저장</a>
</div></nav>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,getDocs,query,orderBy,limit,startAfter,where,serverTimestamp,increment,getCountFromServer} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyALsUq7NOYoiDtKdc9HlfwrSkMUUI-Y2V8",
  authDomain:"malsseum-class.firebaseapp.com",
  projectId:"malsseum-class",
  storageBucket:"malsseum-class.firebasestorage.app",
  messagingSenderId:"636006225173",
  appId:"1:636006225173:web:a63c2c4c30ac0743aa851c"
});
const auth=getAuth(app), db=getFirestore(app);

/* 등급: owner(상위관리자) · admin(관리자/전도사) · member(일반 작성자/성도) · pending(승인 대기) · blocked(차단) */
const ROLE_NAME={owner:'상위관리자',admin:'관리자',member:'성도',pending:'승인 대기',blocked:'차단'};
const can={write:r=>['owner','admin','member'].includes(r), mod:r=>['owner','admin'].includes(r), approve:r=>r==='owner'};

let user=null, profile=null, sermons=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=ts=>{if(!ts)return '';const d=ts.toDate?ts.toDate():new Date(ts);return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;};
const role=()=>profile?.role||null;
// 간단 서식: # 큰 제목, ## 소제목, **굵게**, *기울임*, __밑줄__, ~~취소선~~, ==형광펜==, {빨강:글자}/{파랑:글자}/{초록:글자}
// [가운데] / [오른쪽] 줄 정렬, - 목록, 1. 목록, [ ] / [x] 체크, > 인용, !> 강조 박스, --- 구분선
const COLORS={'빨강':'#d1343b','파랑':'#2563c9','초록':'#1f8a4c','회색':'#7a828c'};
function rich(src){
  const il=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>')
    .replace(/~~(.+?)~~/g,'<s>$1</s>').replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/__(.+?)__/g,'<u>$1</u>')
    .replace(/\{(빨강|파랑|초록|회색):(.+?)\}/g,(_,c,t)=>`<span style="color:${COLORS[c]}">${t}</span>`);
  const out=[];let para=[],list=null,quote=null;
  const flush=()=>{if(para.length){out.push('<p>'+para.map(il).join('<br>')+'</p>');para=[];}
    if(list){out.push(`<${list.t}${list.t==='ul'&&list.chk?' class="chk"':''}>${list.items.map(x=>'<li>'+x+'</li>').join('')}</${list.t}>`);list=null;}
    if(quote){out.push(`<blockquote${quote.box?' class="box"':''}>`+quote.l.map(il).join('<br>')+'</blockquote>');quote=null;}};
  for(let ln of String(src).split('\n')){
    let m, al='';
    if(!ln.trim()){flush();continue;}
    if((m=ln.match(/^\[(가운데|오른쪽)\]\s?/))){al=m[1]==='가운데'?' class="c"':' class="r"';ln=ln.slice(m[0].length);}
    if((m=ln.match(/^(#{1,3})\s+(.*)$/))){flush();const t=m[1].length===1?'h2':'h3';out.push(`<${t}${al}>${il(m[2])}</${t}>`);continue;}
    if(/^-{3,}\s*$/.test(ln)){flush();out.push('<hr>');continue;}
    if((m=ln.match(/^(!?)>\s?(.*)$/))){const box=!!m[1];if(para.length||list||(quote&&quote.box!==box))flush();if(!quote)quote={box,l:[]};quote.l.push(m[2]);continue;}
    if((m=ln.match(/^\s*\[( |x|X)\]\s+(.*)$/))){if(para.length||quote||(list&&!list.chk))flush();if(!list)list={t:'ul',chk:1,items:[]};
      list.items.push(`<span class="cb${m[1]===' '?'':' on'}"></span>${il(m[2])}`);continue;}
    if((m=ln.match(/^\s*[-•*]\s+(.*)$/))||(m=ln.match(/^\s*\d+[.)]\s+(.*)$/))){const t=/^\s*\d/.test(ln)?'ol':'ul';
      if(para.length||quote||(list&&(list.t!==t||list.chk)))flush(); if(!list)list={t,items:[]}; list.items.push(il(m[1]));continue;}
    if(list||quote)flush();
    if(al){flush();out.push(`<p${al}>${il(ln)}</p>`);continue;}
    para.push(ln);
  }
  flush(); return out.join('');
}
const plain=s=>String(s).replace(/^\[(가운데|오른쪽)\]\s?/gm,'').replace(/^#{1,3}\s+|^!?>\s?|^\s*[-•*]\s+|^\s*\[( |x|X)\]\s+|^-{3,}\s*$/gm,'')
  .replace(/\{(?:빨강|파랑|초록|회색):(.+?)\}/g,'$1').replace(/\*\*|==|__|~~|\*/g,'');
const bodyOf=p=>p.body??[['설교 요약',p.summary],['본문 요점',p.points],['묵상과 결단',p.meditation]].filter(x=>x[1]).map(x=>`[${x[0]}]\n${x[1]}`).join('\n\n');
const badge=r=>r&&r!=='member'&&r!=='pending'?`<span class="badge ${r}">${ROLE_NAME[r]}</span>`:'';

const sermonsReady=fetch('sermons.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{sermons=d.sort((a,b)=>b.date.localeCompare(a.date));}).catch(()=>{});
const DAYS=['일','월','화','수','목','금','토'];
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const mdD=s=>{const d=parseD(s);return `${d.getMonth()+1}.${d.getDate()} (${DAYS[d.getDay()]})`;};

/* ---------- 로그인 ---------- */
const UA=navigator.userAgent||'';
const inApp=/KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|; wv\)/i.test(UA);
function openExternal(){
  const url=location.href;
  if(/KAKAOTALK/i.test(UA)){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(url);return;}
  if(/android/i.test(UA)){location.href='intent://'+url.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end';return;}
  navigator.clipboard?.writeText(url).then(()=>alert('주소를 복사했어요. 사파리나 크롬에 붙여 넣어 열어 주세요.'),()=>alert('오른쪽 위 메뉴에서 "다른 브라우저로 열기"를 눌러 주세요.'));
}
async function login(){
  if(inApp){showInApp();return;}
  const p=new GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
  try{await signInWithPopup(auth,p);}catch(e){
    if(e.code==='auth/popup-blocked') alert('로그인 창(팝업)이 막혔어요. 브라우저에서 이 사이트의 팝업을 허용한 뒤 다시 눌러 주세요.');
    else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request') alert('로그인에 실패했어요. ('+e.code+')');
  }
}
function showInApp(){
  $('status').innerHTML='<div class="notice warn">카카오톡 같은 앱 안에서는 구글 로그인이 막혀 있어요.<br>크롬이나 사파리에서 열어 주세요.<div style="margin-top:8px"><button class="btn pri" id="ext">외부 브라우저로 열기</button></div></div>';
  $('ext').onclick=openExternal;
}

let needName=false;
onAuthStateChanged(auth,async u=>{
  user=u; profile=null; needName=false;
  if(u){
    try{
      const s=await getDoc(doc(db,'users',u.uid));
      if(s.exists()) profile=s.data(); else needName=true;
    }catch(e){console.error(e);}
  }
  drawMe(); route();
  if(needName) askName(true);
});

/* 처음 로그인: 이름 받기 (실명 권장) */
function askName(first){
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="card"><div class="sec" style="margin:0 0 6px"><h2>${first?'환영해요!':'이름 바꾸기'}</h2></div>
    <div class="meta" style="line-height:1.6">발표문과 댓글에 표시될 이름이에요.<br><b>서로 알아볼 수 있게 실명을 권장해요.</b></div>
    <input class="f" id="nmIn" maxlength="20" placeholder="예: 홍길동" value="${esc(first?(user.displayName||''):(profile?.name||''))}" style="margin-top:12px">
    <div class="cnt" id="nmErr"></div>
    <div class="row" style="justify-content:flex-end;margin-top:10px">${first?'':'<button class="btn" id="nmNo">취소</button>'}<button class="btn pri" id="nmOk">${first?'시작하기':'저장'}</button></div></div>`;
  document.body.appendChild(m);
  const inp=$('nmIn'); inp.focus(); inp.select();
  if(!first) $('nmNo').onclick=()=>m.remove();
  $('nmOk').onclick=async()=>{
    const name=inp.value.trim().replace(/\s+/g,' ');
    if(name.length<2){$('nmErr').textContent='이름을 2글자 이상 입력해 주세요.';$('nmErr').classList.add('over');return;}
    $('nmOk').disabled=true;
    const ref=doc(db,'users',user.uid);
    try{
      if(first){
        await setDoc(ref,{name,email:user.email||'',photo:user.photoURL||'',role:'pending',createdAt:serverTimestamp()});
        profile={name,email:user.email,photo:user.photoURL,role:'pending'};
        try{await updateDoc(ref,{role:'owner'});profile.role='owner';}catch(_){/* 상위관리자가 아니면 규칙에 막힘 */}
        needName=false;
      }else{await updateDoc(ref,{name});profile.name=name;}
      m.remove(); drawMe(); route();
    }catch(e){console.error(e);$('nmErr').textContent='저장하지 못했어요. 다시 시도해 주세요.';$('nmErr').classList.add('over');$('nmOk').disabled=false;}
  };
  inp.onkeydown=e=>{if(e.key==='Enter')$('nmOk').click();};
}

function drawMe(){
  const me=$('me'), st=$('status');
  if(!user){me.innerHTML='<button class="btn pri" id="lg"><i class="ti ti-brand-google"></i>로그인</button>';$('lg').onclick=login;st.innerHTML='';}
  else{
    me.innerHTML=`${can.approve(role())?'<a class="btn" href="#admin" title="가입 관리"><i class="ti ti-users"></i></a>':''}<span class="nm" id="nmBtn" title="이름 바꾸기">${esc(profile?.name||'')}</span><img src="${esc(user.photoURL||'')}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'" id="avBtn" style="cursor:pointer"><button class="btn" id="lo">로그아웃</button>`;
    $('lo').onclick=()=>signOut(auth);
    if(profile){$('nmBtn').onclick=()=>askName(false);$('avBtn').onclick=()=>askName(false);}
    const r=role();
    st.innerHTML=r==='pending'?`<div class="notice">${esc(profile.name)}님, 가입 신청이 접수됐어요. 관리자가 승인하면 발표문과 댓글을 쓸 수 있어요.</div>`
      :r==='blocked'?'<div class="notice warn">글쓰기가 제한된 계정이에요. 관리자에게 문의해 주세요.</div>':'';
  }
  if(/^#?$|^#d-/.test(location.hash)) route();
}

/* ---------- 라우팅 ---------- */
window.addEventListener('hashchange',route);
function route(){
  const h=location.hash.slice(1);
  window.scrollTo(0,0);
  if(h==='write') return drawForm();
  if(h.startsWith('write-d-')) return drawForm(null,h.slice(8));
  if(h.startsWith('d-')) return drawDate(h.slice(2));
  if(h.startsWith('s-')){const s=sermons.find(x=>x.vid===h.slice(2));location.replace(s?'#d-'+s.date:'#');return;}
  if(h==='admin') return drawAdmin();
  if(h.startsWith('edit-')) return drawForm(h.slice(5));
  if(h.startsWith('p-')) return drawPost(h.slice(2));
  drawList();
}

/* ---------- 목록: 요일 → 날짜 ---------- */
let selDay=null, weeks=8;
const START='2026-11-08'; // 발표문 시작일: 이 날짜 이전은 목록에 안 보임
const sermonsOn=d=>sermons.filter(s=>s.date===d);
async function drawList(){
  const v=$('view'); await sermonsReady;
  if(selDay===null) selDay=new Date().getDay();
  // 고른 요일의 가장 최근 날짜(오늘 포함)부터 거꾸로
  const t=today0(), first=new Date(t); first.setDate(t.getDate()-((t.getDay()-selDay+7)%7));
  const all=[...Array(weeks+1)].map((_,i)=>{const d=new Date(first);d.setDate(first.getDate()-7*i);return ymd(d);}).filter(d=>d>=START);
  const hasMore=all.length>weeks, dates=all.slice(0,weeks);
  const nx=new Date(parseD(START));nx.setDate(nx.getDate()+((selDay-nx.getDay()+7)%7));
  v.innerHTML=`<div class="week" id="wk">${DAYS.map((d,i)=>`<button data-i="${i}" class="${i===selDay?'on':''} ${i===t.getDay()?'today':''}">${d}</button>`).join('')}</div>
    ${can.write(role())?`<a class="btn pri wbtn" href="#write-d-${ymd(t)}"><i class="ti ti-pencil"></i>오늘 발표문 쓰기</a>`:''}
    <div class="sec"><h2>${DAYS[selDay]}요일</h2><span class="meta">날짜를 누르면 그날 발표문이 보여요</span></div>
    ${dates.length?'':`<div class="card"><div class="empty">${mdD(ymd(nx))}부터 발표문을 올릴 수 있어요.</div></div>`}
    <div class="card" style="padding:4px 14px;${dates.length?'':'display:none'}">${dates.map(d=>{const ss=sermonsOn(d);return `<a class="item drow" href="#d-${d}" style="display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)">
      <div style="flex:none;width:64px"><div style="font-size:16px;font-weight:500">${mdD(d).split(' ')[0]}</div><div class="meta">${d.slice(0,4)}</div></div>
      <div style="flex:1;min-width:0"><div class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ss.length?ss.map(s=>esc(s.type+' · '+s.title)).join(' / '):'올라온 설교 영상 없음'}</div>
      <span class="qc zero" data-d="${d}">…</span></div><i class="ti ti-chevron-right" style="color:var(--mute)"></i></a>`;}).join('')}</div>
    ${hasMore?'<button class="btn more" id="moreW">이전 날짜 더 보기</button>':''}`;
  const fr=v.querySelector('.drow'); if(fr) fr.style.borderTop='0';
  $('wk').onclick=e=>{const b=e.target.closest('button');if(!b)return;selDay=+b.dataset.i;weeks=8;drawList();};
  if($('moreW')) $('moreW').onclick=()=>{weeks+=8;drawList();};
  document.querySelectorAll('.qc[data-d]').forEach(async el=>{
    try{const c=(await getCountFromServer(query(collection(db,'posts'),where('date','==',el.dataset.d)))).data().count;
      el.textContent=c?`발표문 ${c}편`:'발표문 없음';el.classList.toggle('zero',!c);}catch(e){el.textContent='';}
  });
}

/* ---------- 날짜 하나의 발표문 목록 ---------- */
async function drawDate(d){
  const v=$('view'); await sermonsReady;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){location.replace('#');return;}
  selDay=parseD(d).getDay();
  const ss=sermonsOn(d);
  v.innerHTML=`<a href="#" class="meta" style="text-decoration:none;margin-bottom:10px;display:inline-flex"><i class="ti ti-chevron-left"></i>${DAYS[selDay]}요일 목록</a>
    <div class="sec"><h2>${d.slice(0,4)}. ${mdD(d)}</h2>${can.write(role())?`<a class="btn pri" href="#write-d-${d}"><i class="ti ti-pencil"></i>이날 발표문 쓰기</a>`:''}</div>
    ${ss.map(s=>`<a class="card item srow" href="${esc(s.url)}"><div class="th" style="background-image:url('https://i.ytimg.com/vi/${esc(s.vid)}/mqdefault.jpg')"></div>
      <div class="bd"><div class="meta">${esc(s.type)} · 설교 보기</div><div class="t">${esc(s.title)}</div><div class="meta">${esc(s.text)} · ${esc(s.preacher)}</div></div></a>`).join('')}
    <div class="sec" style="margin-top:16px"><h2>발표문</h2><span class="meta" id="pc"></span></div><div id="plist"><div class="empty">불러오는 중…</div></div>`;
  try{
    const snap=await getDocs(query(collection(db,'posts'),where('date','==',d),limit(100)));
    const list=snap.docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    $('pc').textContent=list.length?`${list.length}편`:'';
    $('plist').innerHTML=list.length?list.map(p=>`<a class="card item" href="#p-${p.id}">${p.sermonTitle?`<span class="tag">${esc(p.sermonTitle)}</span>`:''}<div class="t">${esc(p.title)}</div>
      <div class="ex">${esc(plain(bodyOf(p)).slice(0,120))}</div>
      <div class="meta" style="margin-top:8px"><span>${esc(p.authorName)}</span><span><i class="ti ti-message"></i> ${p.commentCount||0}</span></div></a>`).join('')
      :`<div class="card"><div class="empty">이날 올라온 발표문이 없어요.${can.write(role())?'':user?'<br>가입 승인 후 쓸 수 있어요.':'<br>로그인하고 승인받으면 쓸 수 있어요.'}</div></div>`;
  }catch(e){console.error(e);$('plist').innerHTML='<div class="card"><div class="empty">발표문을 불러오지 못했어요.</div></div>';}
}

/* ---------- 상세 + 댓글 ---------- */
async function drawPost(id){
  await sermonsReady;
  const v=$('view'); v.innerHTML='<div class="empty">불러오는 중…</div>';
  let s; try{s=await getDoc(doc(db,'posts',id));}catch(e){s=null;}
  if(!s||!s.exists()){v.innerHTML='<div class="card"><div class="empty">발표문을 찾을 수 없어요.<br><a href="#">목록으로</a></div></div>';return;}
  const p=s.data(), mine=user&&p.uid===user.uid;
  const sm=sermons.find(x=>x.vid===p.sermonVid);
  v.innerHTML=`<a href="${p.date?'#d-'+p.date:'#'}" class="meta" style="text-decoration:none;margin-bottom:10px;display:inline-flex"><i class="ti ti-chevron-left"></i>${p.date?mdD(p.date)+' 발표문 목록':'목록'}</a>
  <article class="post">
    <div class="paper" id="paper">
      <div class="ph"><span>세종월드교회 · 발표문</span><span>${p.date?p.date.replace(/-/g,'.')+' ('+DAYS[parseD(p.date).getDay()]+')':fmtDate(p.createdAt)}</span></div>
      <h1>${esc(p.title)}</h1>
      <div class="by">${esc(p.authorName)}${p.sermonTitle?' · '+esc(p.sermonTitle):''}</div>
      <div class="doc rich">${rich(bodyOf(p))}</div>
    </div>
    <div class="meta" style="margin-top:10px">${sm?`<a class="tag" style="text-decoration:none" href="${esc(sm.url)}">설교 보기</a>`:''}${p.updatedAt&&p.createdAt&&p.updatedAt.seconds-p.createdAt.seconds>60?'<span>(수정됨)</span>':''}</div>
    <div class="acts"><button class="btn" id="prt"><i class="ti ti-printer"></i>인쇄 / PDF</button>${mine&&can.write(role())?`<a class="btn" href="#edit-${id}"><i class="ti ti-edit"></i>수정</a>`:''}${mine||can.mod(role())?'<button class="btn del" id="delPost"><i class="ti ti-trash"></i>삭제</button>':''}</div>
  </article>
  <div class="sec" style="margin-top:18px"><h2>댓글 <span id="cmN" class="meta" style="display:inline"></span></h2></div>
  <div class="card" id="cms"><div class="empty">불러오는 중…</div></div>
  <div id="cmForm"></div>`;
  $('prt').onclick=()=>window.print();
  requestAnimationFrame(()=>{const pp=$('paper');if(pp&&pp.scrollHeight>pp.clientHeight+2)pp.classList.add('long');});
  if($('delPost')) $('delPost').onclick=async()=>{if(!confirm('이 발표문을 삭제할까요? 되돌릴 수 없어요.'))return;try{await deleteDoc(doc(db,'posts',id));location.hash=p.date?'#d-'+p.date:'#';}catch(e){alert('삭제하지 못했어요.');}};
  loadComments(id);
  if(can.write(role())){
    $('cmForm').innerHTML='<textarea class="f" id="cmText" placeholder="댓글을 남겨 주세요" style="min-height:70px"></textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn pri" id="cmSend">댓글 등록</button></div>';
    $('cmSend').onclick=async()=>{const t=$('cmText').value.trim();if(!t)return;$('cmSend').disabled=true;
      try{await addDoc(collection(db,'posts',id,'comments'),{uid:user.uid,authorName:profile.name||user.displayName,text:t.slice(0,1000),createdAt:serverTimestamp()});
        await updateDoc(doc(db,'posts',id),{commentCount:increment(1)});$('cmText').value='';loadComments(id);}catch(e){console.error(e);alert('댓글을 등록하지 못했어요.');}
      $('cmSend').disabled=false;};
  }else{
    $('cmForm').innerHTML=`<div class="notice">${!user?'로그인하고 가입 승인을 받으면 댓글을 쓸 수 있어요.':'가입 승인 후 댓글을 쓸 수 있어요.'}</div>`;
  }
}
async function loadComments(id){
  const box=$('cms');
  try{
    const snap=await getDocs(query(collection(db,'posts',id,'comments'),orderBy('createdAt','asc'),limit(200)));
    $('cmN').textContent=snap.size?snap.size:'';
    if(snap.empty){box.innerHTML='<div class="empty" style="padding:14px">첫 댓글을 남겨 보세요.</div>';return;}
    box.innerHTML='';
    snap.forEach(d=>{const c=d.data(), del=user&&(c.uid===user.uid||can.mod(role()));
      box.insertAdjacentHTML('beforeend',`<div class="cm"><div class="who">${esc(c.authorName)}<span class="meta">${fmtDate(c.createdAt)}</span>${del?`<button class="x" data-c="${d.id}">삭제</button>`:''}</div><div class="tx">${esc(c.text)}</div></div>`);});
    box.querySelectorAll('.x').forEach(b=>b.onclick=async()=>{if(!confirm('댓글을 삭제할까요?'))return;
      try{await deleteDoc(doc(db,'posts',id,'comments',b.dataset.c));await updateDoc(doc(db,'posts',id),{commentCount:increment(-1)});loadComments(id);}catch(e){alert('삭제하지 못했어요.');}});
  }catch(e){console.error(e);box.innerHTML='<div class="empty" style="padding:14px">댓글을 불러오지 못했어요.</div>';}
}

  // execCommand('insertText')를 써야 되돌리기(undo)가 동작함
  const put=(t,s,e)=>{ta.focus();ta.setSelectionRange(s,e);if(!document.execCommand||!document.execCommand('insertText',false,t))ta.setRangeText(t,s,e,'end');};
  const wrap=(a,b,ph)=>{const s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.slice(s,e);
    if(sel.startsWith(a)&&sel.endsWith(b)&&sel.length>=a.length+b.length){put(sel.slice(a.length,sel.length-b.length),s,e);return;}
    const t=sel||ph; put(a+t+b,s,e); ta.setSelectionRange(s+a.length,s+a.length+t.length);};
  const lines=(fn,ph)=>{let s=ta.selectionStart,e=ta.selectionEnd;s=ta.value.lastIndexOf('\n',s-1)+1;const ne=ta.value.indexOf('\n',e);e=ne<0?ta.value.length:ne;
    const seg=ta.value.slice(s,e)||ph; const r=seg.split('\n').map(fn).join('\n'); put(r,s,e); ta.setSelectionRange(s+r.length,s+r.length);};
  const ins=t=>{const s=ta.selectionStart;const pre=s&&ta.value[s-1]!=='\n'?'\n':'';put(pre+t,s,ta.selectionEnd);};
  const noAl=l=>l.replace(/^\[(가운데|오른쪽)\]\s?/,'');
  const noBlk=l=>l.replace(/^#{1,3}\s+|^!?>\s?|^\s*[-•*]\s+|^\s*\d+[.)]\s+|^\s*\[( |x|X)\]\s+/,'');
  const al=p=>l=>{const al0=(l.match(/^\[(가운데|오른쪽)\]\s?/)||[''])[0];return (p?`[${p}] `:'')+l.slice(al0.length);};
  $('pal').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('pal').hidden=true;wrap(`{${b.dataset.c}:`,'}','글자');ta.dispatchEvent(new Event('input'));};
  $('tb').onclick=e=>{const b=e.target.closest('button');if(!b||b.closest('#pal'))return;const a=b.dataset.a;
    if(a==='pv'){const on=$('fPrev').style.display==='none';$('fPrev').innerHTML=rich(ta.value)||'<span style="color:#9aa3ad">아직 내용이 없어요</span>';
      $('fPrev').style.display=on?'block':'none';ta.style.display=on?'none':'';b.classList.toggle('on',on);$('pal').hidden=true;
      $('tb').querySelectorAll('.tbr button').forEach(x=>x.disabled=on);return;}
    if(a==='color'){$('pal').hidden=!$('pal').hidden;return;}
    $('pal').hidden=true; ta.focus();
    if(a==='undo'){document.execCommand('undo');}
    else if(a==='redo'){document.execCommand('redo');}
    else if(a==='b')wrap('**','**','굵게');
    else if(a==='i')wrap('*','*','기울임');
    else if(a==='u')wrap('__','__','밑줄');
    else if(a==='s')wrap('~~','~~','취소선');
    else if(a==='m')wrap('==','==','강조');
    else if(a==='h1')lines(l=>{const p=(l.match(/^\[(가운데|오른쪽)\]\s?/)||[''])[0];return p+'# '+noBlk(noAl(l));},'큰 제목');
    else if(a==='h')lines(l=>{const p=(l.match(/^\[(가운데|오른쪽)\]\s?/)||[''])[0];return p+'## '+noBlk(noAl(l));},'소제목');
    else if(a==='al')lines(al(''),'');
    else if(a==='ac')lines(al('가운데'),'가운데 정렬할 글');
    else if(a==='ar')lines(al('오른쪽'),'오른쪽 정렬할 글');
    else if(a==='ul')lines(l=>'- '+noBlk(l),'항목');
    else if(a==='ol'){let n=0;lines(l=>`${++n}. `+noBlk(l),'항목');}
    else if(a==='ck')lines(l=>'[ ] '+noBlk(l),'할 일');
    else if(a==='q')lines(l=>'> '+noBlk(l),'말씀 구절 (책 장:절)');
    else if(a==='box')lines(l=>'!> '+noBlk(l),'꼭 기억할 내용');
    else if(a==='hr')ins('---\n');
    else if(a==='clr'){const s=ta.selectionStart,e=ta.selectionEnd;if(s===e){alert('서식을 지울 부분을 먼저 선택해 주세요.');return;}put(plain(ta.value.slice(s,e)),s,e);}
    else if(a==='tpl'){if(ta.value.trim()&&!confirm('지금 커서 위치에 양식을 넣을까요?'))return;ins('## 설교 요약\n\n\n## 본문 요점\n\n\n## 묵상과 결단\n\n');}
    ta.dispatchEvent(new Event('input'));};
  ta.addEventListener('focus',()=>$('pal').hidden=true);
  $('fSave').onclick=async()=>{
    const date=$('fDate').value; if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<START||date>ymd(today0())){alert('날짜를 다시 골라 주세요.');return;}
    const title=$('fTitle').value.trim(); if(!title){alert('제목을 입력해 주세요.');return;}
    const vid=$('fSermon').value, sm=sermons.find(s=>s.vid===vid);
    const data={title,date,dow:parseD(date).getDay(),sermonVid:vid,sermonTitle:sm?`${sm.date.slice(5).replace('-','.')} ${sm.type} · ${sm.title}`:'',body:$('fBody').value.trim(),updatedAt:serverTimestamp()};
    if(!data.body){alert('발표문 내용을 써 주세요.');return;}
    $('fSave').disabled=true;
    try{
      if(editId){await updateDoc(doc(db,'posts',editId),data);location.hash='#p-'+editId;}
      else{const r=await addDoc(collection(db,'posts'),{...data,uid:user.uid,authorName:profile.name||user.displayName,commentCount:0,createdAt:serverTimestamp()});location.hash='#p-'+r.id;}
    }catch(e){console.error(e);alert('저장하지 못했어요. 잠시 후 다시 시도해 주세요.');$('fSave').disabled=false;}
  };
}

/* ---------- 가입 관리 (상위관리자) ---------- */
async function drawAdmin(){
  const v=$('view');
  if(!can.approve(role())){v.innerHTML='<div class="card"><div class="empty">상위관리자만 볼 수 있어요.</div></div>';return;}
  v.innerHTML=`<a href="#" class="meta" style="text-decoration:none;display:inline-flex"><i class="ti ti-chevron-left"></i>목록</a>
  <div class="sec" style="margin-top:8px"><h2>가입 관리</h2></div>
  <div class="notice">승인 대기 중인 사람을 '성도'로 바꾸면 발표문과 댓글을 쓸 수 있어요. 전도사님은 '관리자'로 지정하면 다른 사람의 글과 댓글도 삭제할 수 있어요.</div>
  <div class="card" id="ulist"><div class="empty">불러오는 중…</div></div>`;
  try{
    const snap=await getDocs(query(collection(db,'users'),orderBy('createdAt','desc'),limit(300)));
    const rows=[];snap.forEach(d=>rows.push({id:d.id,...d.data()}));
    rows.sort((a,b)=>(a.role==='pending'?0:1)-(b.role==='pending'?0:1));
    $('ulist').innerHTML=rows.map(u=>`<div class="urow"><img src="${esc(u.photo)}" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'"><div class="nm"><b>${esc(u.name)} ${u.role==='pending'?'<span class="badge">대기</span>':''}</b><span>${esc(u.email)}</span></div>
      ${u.id===user.uid?'<span class="badge owner">상위관리자</span>':`<select data-u="${u.id}">${['pending','member','admin','blocked'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${ROLE_NAME[r]}</option>`).join('')}</select>`}</div>`).join('')||'<div class="empty">가입한 사람이 없어요.</div>';
    $('ulist').querySelectorAll('select').forEach(sel=>sel.onchange=async()=>{sel.disabled=true;
      try{await updateDoc(doc(db,'users',sel.dataset.u),{role:sel.value});}catch(e){alert('바꾸지 못했어요.');}
      sel.disabled=false;});
  }catch(e){console.error(e);$('ulist').innerHTML='<div class="empty">목록을 불러오지 못했어요.</div>';}
}
