<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}

.brand h1{margin:1px 0 0;font-size:22px;letter-spacing:-.3px}

.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

.tb{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:var(--card);padding:6px;position:sticky;top:0;z-index:3}
.tb.kb{position:fixed;left:0;right:0;top:auto;z-index:60;border-radius:0;border:0;border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(0,0,0,.08);padding:5px 6px}
.tb.kb .pop{top:auto;bottom:100%;margin:0 0 4px}
body.editing .nav{display:none}
body.editing .ed{padding-bottom:120px}
.tb .tbb{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;border:0;background:none;color:var(--ink);min-width:36px;height:34px;border-radius:8px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0 7px}
.tb .tbb:active,.tb .tbb.on{background:var(--line)}
.tb .tbr{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tb .tbr::-webkit-scrollbar{display:none}
.tb .tbr .tbb{flex:none}
.tb .dv{flex:none;width:1px;background:var(--line);margin:6px 3px}

.pop[hidden]{display:none}
.pop .pt{grid-column:1/-1;font-size:12px;color:var(--mute);padding:0 4px 2px}
.tb .pop .pi{justify-content:flex-start;gap:7px;height:42px;padding:0 10px;font-size:14px;width:auto}
.tb .pop .pi span{color:var(--ink)}
.tb .gb{flex-direction:column;gap:0;height:42px;min-width:44px;padding:0 6px}
.tb .gb small{font-size:10px;line-height:1;margin-top:2px;color:var(--mute)}
.tb .gb.open{background:var(--line)}
.tb.cp .tbr{-webkit-mask-image:none;justify-content:space-between}
.ed{border:1px solid var(--line);border-radius:0 0 12px 12px;background:#fff;color:#1b1d21;padding:16px 16px 40px;min-height:340px;outline:none;font-size:15px;line-height:1.85;word-break:keep-all;position:relative;-webkit-user-select:text;user-select:text}

.ed.empty::before{content:attr(data-ph);color:#9aa3ad;position:absolute;left:16px;right:16px;top:16px;pointer-events:none}
.ed p,.ed div{margin:0 0 .5em}
.rich [style*="text-align:center"],.rich [style*="text-align: center"]{text-align:center}
.tb .tbr .tbb.on{background:var(--line);color:var(--accent-d)}
.prev{border:1px solid var(--line);border-radius:0 0 12px 12px;background:#fff;color:#1b1d21;padding:18px 16px;min-height:300px}
.rich h3{font-size:1.08em;margin:1.1em 0 .35em;padding-bottom:3px;border-bottom:1px solid #e3e5e9}
.rich h3:first-child{margin-top:0}
.rich p{margin:0 0 .6em}
.rich ul,.rich ol{margin:0 0 .6em;padding-left:1.4em}
.rich blockquote{margin:.2em 0 .7em;padding:.4em .9em;border-left:3px solid #9aa3ad;background:#f4f5f7;color:#3d4249}
.rich hr{border:0;border-top:1px solid #d9dce1;margin:1em 0}
.rich mark{background:#fff1a8;padding:0 2px}
.rich h2{font-size:1.3em;margin:1em 0 .45em;line-height:1.4}
.rich h2:first-child{margin-top:0}
.rich [style*="justify"]{word-break:normal}
.rich .c{text-align:center}.rich .r{text-align:right}
.rich blockquote.box{border:1px solid #c9dccd;border-left:4px solid #2f8f5b;background:#eef7f0;color:#1b1d21;border-radius:6px}
.rich ul.chk{list-style:none;padding-left:.2em}

.rich ul.chk .cb.on{background:#2f8f5b;border-color:#2f8f5b}
.rich ul.chk .cb.on::after{content:'';position:absolute;left:.26em;top:.06em;width:.22em;height:.45em;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.notice{background:var(--accent-soft);color:var(--accent-d);border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.6;margin-bottom:14px}

.hint{font-size:12px;color:var(--mute);margin-top:4px}
.row{display:flex;gap:8px;align-items:center}
.urow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.urow img{width:34px;height:34px;border-radius:50%;flex:none;background:var(--line)}
.urow .nm{flex:1;min-width:0}
.urow .nm b{display:block;font-size:14px;font-weight:500}
.urow .nm span{font-size:12px;color:var(--sub);word-break:break-all}
.urow select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;font-size:13px}
.more{display:block;width:100%;margin-top:6px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:9;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;display:none}
.fab.on{display:block}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:560px;margin:0 auto;display:flex}
.nav a{flex:1;text-align:center;padding:9px 0 10px;font-size:11.5px;color:var(--mute);text-decoration:none}
.nav a i{display:block;font-size:23px;margin-bottom:1px}
.nav a.on{color:var(--accent-d)}
.week{display:flex;gap:4px;margin-bottom:12px}
.week button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 0 7px;cursor:pointer;color:var(--sub);font-size:14px}
.week button small{display:block;font-size:11px;color:var(--mute);margin-top:1px}
.week button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.week button.on small{color:#e3f5ee}
.week button.today:not(.on){border-color:var(--accent);color:var(--accent-d)}
.srow{display:flex;gap:12px;align-items:center}
.srow .th{flex:none;width:92px;aspect-ratio:16/9;border-radius:8px;background:#2c2c2a center/cover no-repeat}
.srow .bd{flex:1;min-width:0}
.srow .t{font-size:15px;margin:2px 0}
.qc{font-size:12.5px;color:var(--accent-d);font-weight:500}
.qc.zero{color:var(--mute);font-weight:400}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.modal .card{width:100%;max-width:420px;margin:0}
.me .nm{font-size:13px;font-weight:500;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.hide{display:none!important}
</style>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,getDocs,query,orderBy,limit,startAfter,where,serverTimestamp,increment,getCountFromServer} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyALsUq7NOYoiDtKdc9HlfwrSkMUUI-Y2V8",
  authDomain:"malsseum-class.firebaseapp.com",
  projectId:"malsseum-class",
  storageBucket:"malsseum-class.firebasestorage.app",
  messagingSenderId:"636006225173",
  appId:"1:636006225173:web:a63c2c4c30ac0743aa851c"
});
const auth=getAuth(app), db=getFirestore(app);

/* 등급: owner(상위관리자) · admin(관리자/전도사) · member(일반 작성자/성도) · pending(승인 대기) · blocked(차단) */
const ROLE_NAME={owner:'상위관리자',admin:'관리자',member:'성도',pending:'승인 대기',blocked:'차단'};
const can={write:r=>['owner','admin','member'].includes(r), mod:r=>['owner','admin'].includes(r), approve:r=>r==='owner'};

let user=null, profile=null, sermons=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=ts=>{if(!ts)return '';const d=ts.toDate?ts.toDate():new Date(ts);return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}`;};
const role=()=>profile?.role||null;
// 간단 서식: # 큰 제목, ## 소제목, **굵게**, *기울임*, __밑줄__, ~~취소선~~, ==형광펜==, {빨강:글자}/{파랑:글자}/{초록:글자}
// [가운데] / [오른쪽] 줄 정렬, - 목록, 1. 목록, [ ] / [x] 체크, > 인용, !> 강조 박스, --- 구분선
const COLORS={'빨강':'#d1343b','파랑':'#2563c9','초록':'#1f8a4c','회색':'#7a828c'};
function rich(src){
  const il=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>')
    .replace(/~~(.+?)~~/g,'<s>$1</s>').replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/__(.+?)__/g,'<u>$1</u>')
    .replace(/\{(빨강|파랑|초록|회색):(.+?)\}/g,(_,c,t)=>`<span style="color:${COLORS[c]}">${t}</span>`);
  const out=[];let para=[],list=null,quote=null;
  const flush=()=>{if(para.length){out.push('<p>'+para.map(il).join('<br>')+'</p>');para=[];}
    if(list){out.push(`<${list.t}${list.t==='ul'&&list.chk?' class="chk"':''}>${list.items.map(x=>'<li>'+x+'</li>').join('')}</${list.t}>`);list=null;}
    if(quote){out.push(`<blockquote${quote.box?' class="box"':''}>`+quote.l.map(il).join('<br>')+'</blockquote>');quote=null;}};
  for(let ln of String(src).split('\n')){
    let m, al='';
    if(!ln.trim()){flush();continue;}
    if((m=ln.match(/^\[(가운데|오른쪽)\]\s?/))){al=m[1]==='가운데'?' class="c"':' class="r"';ln=ln.slice(m[0].length);}
    if((m=ln.match(/^(#{1,3})\s+(.*)$/))){flush();const t=m[1].length===1?'h2':'h3';out.push(`<${t}${al}>${il(m[2])}</${t}>`);continue;}
    if(/^-{3,}\s*$/.test(ln)){flush();out.push('<hr>');continue;}
    if((m=ln.match(/^(!?)>\s?(.*)$/))){const box=!!m[1];if(para.length||list||(quote&&quote.box!==box))flush();if(!quote)quote={box,l:[]};quote.l.push(m[2]);continue;}
    if((m=ln.match(/^\s*\[( |x|X)\]\s+(.*)$/))){if(para.length||quote||(list&&!list.chk))flush();if(!list)list={t:'ul',chk:1,items:[]};
      list.items.push(`<span class="cb${m[1]===' '?'':' on'}"></span>${il(m[2])}`);continue;}
    if((m=ln.match(/^\s*[-•*]\s+(.*)$/))||(m=ln.match(/^\s*\d+[.)]\s+(.*)$/))){const t=/^\s*\d/.test(ln)?'ol':'ul';
      if(para.length||quote||(list&&(list.t!==t||list.chk)))flush(); if(!list)list={t,items:[]}; list.items.push(il(m[1]));continue;}
    if(list||quote)flush();
    if(al){flush();out.push(`<p${al}>${il(ln)}</p>`);continue;}
    para.push(ln);
  }
  flush(); return out.join('');
}
const plain=s=>String(s).replace(/^\[(가운데|오른쪽)\]\s?/gm,'').replace(/^#{1,3}\s+|^!?>\s?|^\s*[-•*]\s+|^\s*\[( |x|X)\]\s+|^-{3,}\s*$/gm,'')
  .replace(/\{(?:빨강|파랑|초록|회색):(.+?)\}/g,'$1').replace(/\*\*|==|__|~~|\*/g,'');
// 저장된 HTML은 허용한 태그·스타일만 남기고 모두 지움 (보안)
const OK_TAGS=new Set(['P','DIV','BR','B','STRONG','I','EM','U','S','STRIKE','DEL','MARK','SPAN','FONT','H2','H3','UL','OL','LI','BLOCKQUOTE','HR']);
const DROP=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META','SVG','MATH','IMG','VIDEO','AUDIO','FORM','INPUT','BUTTON','TEXTAREA','SELECT','TEMPLATE','NOSCRIPT','CANVAS']);
const okColor=c=>/^(#[0-9a-f]{3,8}|rgba?\(\s*[\d.]+\s*,\s*[\d.]+\s*,\s*[\d.]+\s*(,\s*[\d.]+\s*)?\)|transparent)$/i.test(c.trim());
function cleanHtml(html){
  const t=document.createElement('template'); t.innerHTML=String(html);
  const walk=node=>{[...node.childNodes].forEach(n=>{
    if(n.nodeType===3)return;
    if(n.nodeType!==1){n.remove();return;}
    const tg=n.tagName;
    if(DROP.has(tg)){n.remove();return;}
    walk(n);
    if(!OK_TAGS.has(tg)){n.replaceWith(...n.childNodes);return;}
    const st=n.style, keep=[];
    const col=tg==='FONT'?n.getAttribute('color'):st.color, bg=st.backgroundColor, ta=st.textAlign;
    if(col&&okColor(col))keep.push('color:'+col.trim());
    if(bg&&okColor(bg)&&bg!=='transparent')keep.push('background-color:'+bg.trim());
    if(/^(center|right|left|justify)$/.test(ta||'')&&ta!=='left')keep.push('text-align:'+ta);
    if(/^(bold|[6-9]00)$/.test(st.fontWeight||''))keep.push('font-weight:bold');
    if(st.fontStyle==='italic')keep.push('font-style:italic');
    const td=(st.textDecorationLine||st.textDecoration||'');['underline','line-through'].forEach(x=>{if(td.includes(x))keep.push('text-decoration:'+x);});
    const cls=n.getAttribute('class')||'', okc=cls.split(/\s+/).filter(c=>/^(box|c|r|chk)$/.test(c)).join(' ');
    [...n.attributes].forEach(at=>n.removeAttribute(at.name));
    let el=n;
    if(tg==='FONT'){el=document.createElement('span');el.append(...n.childNodes);n.replaceWith(el);}
    if(keep.length)el.setAttribute('style',[...new Set(keep)].join(';'));
    if(okc)el.setAttribute('class',okc);
    if(el.tagName==='SPAN'&&!el.attributes.length)el.replaceWith(...el.childNodes);
  });};
  walk(t.content); return t.innerHTML;
}
const isHtml=s=>/^\s*<(p|div|h2|h3|ul|ol|blockquote|hr|b|i|u|s|span|br|strong|em|mark)\b/i.test(s||'');
const docHtml=s=>isHtml(s)?cleanHtml(s):rich(s);
const textOf=s=>{if(!isHtml(s))return plain(s);const t=document.createElement('template');t.innerHTML=cleanHtml(String(s).replace(/<\/(p|div|h2|h3|li|blockquote)>/gi,'$& '));return t.content.textContent.replace(/\s+/g,' ').trim();};
const bodyOf=p=>p.body??[['설교 요약',p.summary],['본문 요점',p.points],['묵상과 결단',p.meditation]].filter(x=>x[1]).map(x=>`[${x[0]}]\n${x[1]}`).join('\n\n');
const badge=r=>r&&r!=='member'&&r!=='pending'?`<span class="badge ${r}">${ROLE_NAME[r]}</span>`:'';

const DAYS=['일','월','화','수','목','금','토'];
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const mdD=s=>{const d=parseD(s);return `${d.getMonth()+1}.${d.getDate()} (${DAYS[d.getDay()]})`;};

/* ---------- 라우팅 ---------- */
window.addEventListener('hashchange',route);
function route(){
  const h=location.hash.slice(1);
  window.scrollTo(0,0);
  if(h==='write') return drawForm();
  if(h.startsWith('write-d-')) return drawForm(null,h.slice(8));
  if(h.startsWith('d-')) return drawDate(h.slice(2));
  if(h.startsWith('s-')){const s=sermons.find(x=>x.vid===h.slice(2));location.replace(s?'#d-'+s.date:'#');return;}
  if(h==='admin') return drawAdmin();
  if(h.startsWith('edit-')) return drawForm(h.slice(5));
  if(h.startsWith('p-')) return drawPost(h.slice(2));

}

/* ---------- 목록: 요일 → 날짜 ---------- */
let selDay=null, weeks=8;
const START='2026-11-08'; // 발표문 시작일: 이 날짜 이전은 목록에 안 보임
const sermonsOn=d=>sermons.filter(s=>s.date===d);
async function drawList(){
  const v=$('view'); await sermonsReady;
  if(selDay===null) selDay=new Date().getDay();
  // 고른 요일의 가장 최근 날짜(오늘 포함)부터 거꾸로
  const t=today0(), first=new Date(t); first.setDate(t.getDate()-((t.getDay()-selDay+7)%7));
  const all=[...Array(weeks+1)].map((_,i)=>{const d=new Date(first);d.setDate(first.getDate()-7*i);return ymd(d);}).filter(d=>d>=START);
  const hasMore=all.length>weeks, dates=all.slice(0,weeks);
  const nx=new Date(parseD(START));nx.setDate(nx.getDate()+((selDay-nx.getDay()+7)%7));
  v.innerHTML=`<div class="week" id="wk">${DAYS.map((d,i)=>`<button data-i="${i}" class="${i===selDay?'on':''} ${i===t.getDay()?'today':''}">${d}</button>`).join('')}</div>
    ${can.write(role())?`<a class="btn pri wbtn" href="#write-d-${ymd(t)}"><i class="ti ti-pencil"></i>오늘 발표문 쓰기</a>`:''}
    <div class="sec"><h2>${DAYS[selDay]}요일</h2><span class="meta">날짜를 누르면 그날 발표문이 보여요</span></div>
    ${dates.length?'':`<div class="card"><div class="empty">${mdD(ymd(nx))}부터 발표문을 올릴 수 있어요.</div></div>`}
    <div class="card" style="padding:4px 14px;${dates.length?'':'display:none'}">${dates.map(d=>{const ss=sermonsOn(d);return `<a class="item drow" href="#d-${d}" style="display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)">
      <div style="flex:none;width:64px"><div style="font-size:16px;font-weight:500">${mdD(d).split(' ')[0]}</div><div class="meta">${d.slice(0,4)}</div></div>
      <div style="flex:1;min-width:0"><div class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ss.length?ss.map(s=>esc(s.type+' · '+s.title)).join(' / '):'올라온 설교 영상 없음'}</div>
      <span class="qc zero" data-d="${d}">…</span></div><i class="ti ti-chevron-right" style="color:var(--mute)"></i></a>`;}).join('')}</div>
    ${hasMore?'<button class="btn more" id="moreW">이전 날짜 더 보기</button>':''}`;
  const fr=v.querySelector('.drow'); if(fr) fr.style.borderTop='0';
  $('wk').onclick=e=>{const b=e.target.closest('button');if(!b)return;selDay=+b.dataset.i;weeks=8;drawList();};
  if($('moreW')) $('moreW').onclick=()=>{weeks+=8;drawList();};
  document.querySelectorAll('.qc[data-d]').forEach(async el=>{
    try{const c=(await getCountFromServer(query(collection(db,'posts'),where('date','==',el.dataset.d)))).data().count;
      el.textContent=c?`발표문 ${c}편`:'발표문 없음';el.classList.toggle('zero',!c);}catch(e){el.textContent='';}
  });
}

  if(!can.write(role())){v.innerHTML=`<div class="card"><div class="empty">${!user?'로그인이 필요해요.':'가입 승인 후 발표문을 쓸 수 있어요.'}<br><a href="#">목록으로</a></div></div>`;return;}
  let p={title:'',date:presetDate||ymd(today0()),sermonVid:'',body:''};
  if(editId){const s=await getDoc(doc(db,'posts',editId));if(!s.exists()||s.data().uid!==user.uid){v.innerHTML='<div class="card"><div class="empty">본인이 쓴 글만 수정할 수 있어요.</div></div>';return;}p=s.data();}
  const B=(a,ic,t)=>`<span class="tbb" role="button" data-a="${a}" title="${t}" aria-label="${t}"><i class="ti ti-${ic}"></i></span>`;
  // 비슷한 도구는 묶음으로: 폰에서는 묶음 버튼 하나 → 눌러서 고르기
  const GROUPS=[
    {id:'txt',ic:'typography',t:'글자',keep:1,items:[['bold','bold','굵게'],['italic','italic','기울임'],['underline','underline','밑줄'],['strikeThrough','strikethrough','취소선']]},
    {id:'col',ic:'palette',t:'색',items:[...Object.entries(COLORS).map(([n,c])=>['c:'+c,'circle-filled',n,c]),['c:#1b1d21','circle','기본색'],['mark','highlight','형광펜']]},
    {id:'al',ic:'align-left',t:'정렬',items:[['justifyLeft','align-left','왼쪽'],['justifyCenter','align-center','가운데'],['justifyRight','align-right','오른쪽'],['justifyFull','align-justified','양쪽']]},
    {id:'hd',ic:'heading',t:'제목',items:[['h2','h-1','큰 제목'],['h3','h-2','소제목'],['p','pilcrow','본문']]},
    {id:'ls',ic:'list',t:'목록',items:[['insertUnorderedList','list','글머리 목록'],['insertOrderedList','list-numbers','번호 목록']]},
    {id:'ins',ic:'square-plus',t:'넣기',items:[['quote','quote','인용(성경 구절)'],['box','square-rounded-letter-b','강조 박스'],['insertHorizontalRule','minus','구분선'],['tpl','template','양식 넣기']]}];
  const compact=matchMedia('(max-width:700px), (pointer:coarse)').matches;
  const GB=g=>`<span class="tbb gb" role="button" data-g="${g.id}" title="${g.t}" aria-label="${g.t}"><i class="ti ti-${g.ic}"></i><small>${g.t}</small></span>`;
  const DV='<span class="dv"></span>';
  const tbHtml=B('undo','arrow-back-up','되돌리기')+B('redo','arrow-forward-up','다시 하기')+DV+
    (compact?GROUPS.map(GB).join(''):GROUPS.map(g=>g.id==='col'?GB(g):g.items.map(i=>B(...i)).join('')).join(DV))+DV+B('clear','clear-formatting','서식 지우기');
  v.innerHTML=`<a href="${editId?'#p-'+editId:presetDate?'#d-'+presetDate:'#'}" class="meta" style="text-decoration:none;display:inline-flex"><i class="ti ti-chevron-left"></i>취소</a>
  <div class="sec" style="margin-top:8px"><h2>${editId?'발표문 수정':'발표문 쓰기'}</h2></div>
  <label class="f" for="fDate">날짜</label>
  <input class="f" type="date" id="fDate" value="${esc(p.date||ymd(today0()))}" min="${START}" max="${ymd(today0())}">
  <label class="f" for="fSermon">연결할 설교 (선택)</label>
  <select class="f" id="fSermon"></select>
  <div class="hint">사이트에 올라간 설교만 보여요. 없으면 '선택 안 함'으로 두면 돼요.</div>
  <label class="f" for="fTitle">제목</label>
  <input class="f" id="fTitle" maxlength="100" value="${esc(p.title)}" placeholder="예: 용서는 남보다 더 하는 것">
  <label class="f">발표문</label>
  <div class="tb${compact?' cp':''}" id="tb"><div class="tbr">${tbHtml}</div>
  <div class="pop" id="pop" hidden></div>
  </div>
  <div class="ed rich" id="fBody" contenteditable="true" data-ph="A4 한 장에 쓰듯 자유롭게 써 주세요. 예) 설교 요약 → 본문 요점 → 묵상과 결단"></div>
  <div class="cnt" id="fCnt"></div>
  <div class="hint">글자를 선택하고 도구를 누르면 바로 적용돼요. 도구줄은 옆으로 밀면 더 있어요. A4 한 장은 보통 1,500~2,000자예요.</div>
  <div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn pri" id="fSave">${editId?'수정 완료':'올리기'}</button></div>`;
  const fillS=()=>{const d=$('fDate').value, ss=sermonsOn(d);$('fSermon').innerHTML='<option value="">선택 안 함</option>'+ss.map(s=>`<option value="${esc(s.vid)}" ${s.vid===p.sermonVid?'selected':''}>${esc(s.type)} · ${esc(s.title)}</option>`).join('');};
  $('fDate').onchange=fillS; fillS();
  const ed=$('fBody');
  ed.innerHTML=editId?docHtml(bodyOf(p)):'';
  try{document.execCommand('defaultParagraphSeparator',false,'p');document.execCommand('styleWithCSS',false,false);}catch(_){}
  // 선택 영역 기억 (버튼을 눌러도 선택이 풀리지 않게)
  let rng=null;
  const save=()=>{const s=getSelection();if(s.rangeCount&&ed.contains(s.anchorNode))rng=s.getRangeAt(0).cloneRange();};
  const back=()=>{if(document.activeElement===ed&&getSelection().rangeCount&&ed.contains(getSelection().anchorNode))return;ed.focus({preventScroll:true});if(rng){const s=getSelection();s.removeAllRanges();s.addRange(rng);}};
  document.addEventListener('selectionchange',()=>{if(document.activeElement===ed){save();state();}});
  // 터치: 손을 뗄 때 기본 동작(포커스 이동·키보드 닫힘·화면 이동)을 막고 직접 실행
  let tx=0,ty=0,sy=0,lastTouch=0;
  $('tb').addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;sy=scrollY;},{passive:true});
  $('tb').addEventListener('touchend',e=>{const b=e.target.closest('.tbb');if(!b)return;const t=e.changedTouches[0];
    if(Math.abs(t.clientX-tx)>10||Math.abs(t.clientY-ty)>10)return; // 옆으로 민 경우는 무시
    e.preventDefault(); lastTouch=Date.now(); act(b);},{passive:false});
  $('tb').addEventListener('mousedown',e=>{if(e.target.closest('.tbb'))e.preventDefault();});
  const blk=()=>{let n=getSelection().anchorNode;while(n&&n!==ed){if(n.nodeType===1&&/^(P|DIV|H2|H3|BLOCKQUOTE|LI)$/.test(n.tagName))return n;n=n.parentNode;}return null;};
  const inTag=t=>{let n=getSelection().anchorNode;while(n&&n!==ed){if(n.nodeType===1&&n.tagName===t)return n;n=n.parentNode;}return null;};
  const ex=(c,v=null)=>{try{return document.execCommand(c,false,v);}catch(_){return false;}};
  const onOf=a=>{try{if(['bold','italic','underline','strikeThrough','insertUnorderedList','insertOrderedList','justifyCenter','justifyRight','justifyFull'].includes(a))return document.queryCommandState(a);}catch(_){}
    if(a==='justifyLeft'){try{return !['justifyCenter','justifyRight','justifyFull'].some(x=>document.queryCommandState(x));}catch(_){return false;}}
    if(a==='h2')return !!inTag('H2'); if(a==='h3')return !!inTag('H3'); if(a==='p')return !inTag('H2')&&!inTag('H3')&&!inTag('BLOCKQUOTE');
    if(a==='quote'){const q=inTag('BLOCKQUOTE');return !!q&&!q.classList.contains('box');} if(a==='box'){const q=inTag('BLOCKQUOTE');return !!q&&q.classList.contains('box');}
    return false;};
  const state=()=>{$('tb').querySelectorAll('.tbb[data-a]').forEach(b=>b.classList.toggle('on',onOf(b.dataset.a)));
    $('tb').querySelectorAll('.gb').forEach(b=>{const g=GROUPS.find(x=>x.id===b.dataset.g);
      if(g.id==='al'){const cur=g.items.find(i=>i[0]!=='justifyLeft'&&onOf(i[0]));b.querySelector('i').className='ti ti-'+(cur?cur[1]:'align-left');b.classList.toggle('on',!!cur);}
      else if(g.id==='txt'||g.id==='ls'||g.id==='hd')b.classList.toggle('on',g.items.some(i=>i[0]!=='p'&&onOf(i[0])));});};
  const block=(tag,cls)=>{const cur=inTag(tag.toUpperCase());
    if(cur&&(!cls||cur.classList.contains(cls))){ex('formatBlock','<p>');return;}
    ex('formatBlock',`<${tag}>`);const n=inTag(tag.toUpperCase());if(n){n.className=cls||'';if(!cls)n.removeAttribute('class');}};
  $('tb').onclick=e=>{if(Date.now()-lastTouch<700)return;const b=e.target.closest('.tbb');if(b)act(b);};
  let openG=null; const pop=$('pop');
  const closePop=()=>{pop.hidden=true;openG=null;$('tb').querySelectorAll('.gb').forEach(x=>x.classList.remove('open'));};
  const drawPop=g=>{pop.innerHTML=`<div class="pt">${g.t}</div>`+g.items.map(([a,ic,t,c])=>`<span class="tbb pi" role="button" data-a="${a}" title="${t}"${c?` style="color:${c}"`:''}><i class="ti ti-${ic}"></i><span>${t}</span></span>`).join('');state();};
  function act(b){
    if(b.dataset.g){const g=GROUPS.find(x=>x.id===b.dataset.g);if(openG===g.id){closePop();return;}closePop();openG=g.id;b.classList.add('open');drawPop(g);pop.hidden=false;return;}
    const a=b.dataset.a, g=GROUPS.find(x=>x.id===openG);
    if(!(g&&g.keep&&b.classList.contains('pi')))closePop();
    back();
    if(a.startsWith('c:')){ex('foreColor',a.slice(2));}
    else if(a==='p'){if(inTag('H2')||inTag('H3')||inTag('BLOCKQUOTE'))ex('formatBlock','<p>');}
    if(a==='mark'){let on=false;try{const c=document.queryCommandValue('backColor');on=/255,\s*241,\s*168|fff1a8/i.test(c);}catch(_){} if(!ex('hiliteColor',on?'transparent':'#fff1a8'))ex('backColor',on?'transparent':'#fff1a8');}
    else if(a==='h2'||a==='h3')block(a);
    else if(a==='quote')block('blockquote');
    else if(a==='box')block('blockquote','box');
    else if(a==='clear'){ex('removeFormat');ex('unlink');const n=blk();if(n&&/^(H2|H3|BLOCKQUOTE)$/.test(n.tagName))ex('formatBlock','<p>');ex('justifyLeft');}
    else if(a==='tpl'){ex('insertHTML','<h3>설교 요약</h3><p><br></p><h3>본문 요점</h3><p><br></p><h3>묵상과 결단</h3><p><br></p>');}
    else ex(a);
    save();state();ed.dispatchEvent(new Event('input'));}
  document.addEventListener('pointerdown',e=>{if(!pop.hidden&&!e.target.closest('#tb'))closePop();});
  // 붙여넣기는 글자만 (다른 곳 서식·이미지가 섞이지 않게)
  ed.addEventListener('paste',e=>{e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text/plain');ex('insertText',t);});
  ed.addEventListener('drop',e=>e.preventDefault());
  const cntUp=()=>{const n=ed.innerText.replace(/\n/g,'').length;$('fCnt').textContent=`${n.toLocaleString()}자${n>2000?' · A4 한 장을 넘어요':''}`;$('fCnt').classList.toggle('over',n>2000);
    ed.classList.toggle('empty',!ed.textContent.trim()&&!ed.querySelector('hr,li'));};
  ed.addEventListener('input',cntUp); cntUp();
  // 폰: 쓰는 동안 도구줄을 키보드 바로 위에 붙임 (화면을 위로 올릴 필요 없게)
  const tb=$('tb'), vv=window.visualViewport, touch=matchMedia('(pointer:coarse)').matches;
  const place=()=>{if(!tb.classList.contains('kb'))return;const H=tb.offsetHeight;
    const bottom=vv?vv.offsetTop+vv.height:innerHeight; tb.style.top=Math.max(0,bottom-H)+'px';};
  const kbOn=()=>{if(!touch||tb.classList.contains('kb'))return;ed.style.marginTop=tb.offsetHeight+'px';tb.classList.add('kb');document.body.classList.add('editing');place();};
  const kbOff=()=>{setTimeout(()=>{if(document.activeElement===ed||!pop.hidden)return;tb.classList.remove('kb');tb.style.top='';ed.style.marginTop='';document.body.classList.remove('editing');},150);};
  ed.addEventListener('focus',kbOn); ed.addEventListener('blur',kbOff);
  if(vv){vv.addEventListener('resize',place);vv.addEventListener('scroll',place);} addEventListener('scroll',place,{passive:true});
  addEventListener('hashchange',()=>{document.body.classList.remove('editing');},{once:true});
  $('fSave').onclick=async()=>{
    const date=$('fDate').value; if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<START||date>ymd(today0())){alert('날짜를 다시 골라 주세요.');return;}
    const title=$('fTitle').value.trim(); if(!title){alert('제목을 입력해 주세요.');return;}
    if(!ed.textContent.trim()){alert('발표문 내용을 써 주세요.');return;}
    const body=cleanHtml(ed.innerHTML).replace(/(<p><br><\/p>)+$/,'');
    if(body.length>8000){alert(`서식을 포함한 길이가 너무 길어요 (${body.length.toLocaleString()} / 8,000). 내용을 조금 줄이거나 서식을 줄여 주세요.`);return;}
    const vid=$('fSermon').value, sm=sermons.find(s=>s.vid===vid);
    const data={title,date,dow:parseD(date).getDay(),sermonVid:vid,sermonTitle:sm?`${sm.date.slice(5).replace('-','.')} ${sm.type} · ${sm.title}`:'',body,updatedAt:serverTimestamp()};
    $('fSave').disabled=true;
    try{
      if(editId){await updateDoc(doc(db,'posts',editId),data);location.hash='#p-'+editId;}
      else{const r=await addDoc(collection(db,'posts'),{...data,uid:user.uid,authorName:profile.name||user.displayName,commentCount:0,createdAt:serverTimestamp()});location.hash='#p-'+r.id;}
    }catch(e){console.error(e);alert('저장하지 못했어요. 잠시 후 다시 시도해 주세요.');$('fSave').disabled=false;}
  };
}

/* ---------- 가입 관리 (상위관리자) ---------- */
async function drawAdmin(){
  const v=$('view');
  if(!can.approve(role())){v.innerHTML='<div class="card"><div class="empty">상위관리자만 볼 수 있어요.</div></div>';return;}
  v.innerHTML=`<a href="#" class="meta" style="text-decoration:none;display:inline-flex"><i class="ti ti-chevron-left"></i>목록</a>
  <div class="sec" style="margin-top:8px"><h2>가입 관리</h2></div>
  <div class="notice">승인 대기 중인 사람을 '성도'로 바꾸면 발표문과 댓글을 쓸 수 있어요. 전도사님은 '관리자'로 지정하면 다른 사람의 글과 댓글도 삭제할 수 있어요.</div>
  <div class="card" id="ulist"><div class="empty">불러오는 중…</div></div>`;
  try{
    const snap=await getDocs(query(collection(db,'users'),orderBy('createdAt','desc'),limit(300)));
    const rows=[];snap.forEach(d=>rows.push({id:d.id,...d.data()}));
    rows.sort((a,b)=>(a.role==='pending'?0:1)-(b.role==='pending'?0:1));
    $('ulist').innerHTML=rows.map(u=>`<div class="urow"><img src="${esc(u.photo)}" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'"><div class="nm"><b>${esc(u.name)} ${u.role==='pending'?'<span class="badge">대기</span>':''}</b><span>${esc(u.email)}</span></div>
      ${u.id===user.uid?'<span class="badge owner">상위관리자</span>':`<select data-u="${u.id}">${['pending','member','admin','blocked'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${ROLE_NAME[r]}</option>`).join('')}</select>`}</div>`).join('')||'<div class="empty">가입한 사람이 없어요.</div>';
    $('ulist').querySelectorAll('select').forEach(sel=>sel.onchange=async()=>{sel.disabled=true;
      try{await updateDoc(doc(db,'users',sel.dataset.u),{role:sel.value});}catch(e){alert('바꾸지 못했어요.');}
      sel.disabled=false;});
  }catch(e){console.error(e);$('ulist').innerHTML='<div class="empty">목록을 불러오지 못했어요.</div>';}
}
</script>
