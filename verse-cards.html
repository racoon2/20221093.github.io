<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>주제별 성경암송 60구절 플래시카드</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2622;--mute:#8a8178;--acc:#7a5c3e;--ok:#4f8a5b;--bad:#b5533c;--line:#e6dfd4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a17;--card:#2a2622;--ink:#f1ebe3;--mute:#a39a8f;--acc:#d2a974;--line:#3b352f}}
:root[data-theme="dark"]{--bg:#1d1a17;--card:#2a2622;--ink:#f1ebe3;--mute:#a39a8f;--acc:#d2a974;--line:#3b352f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif KR",Georgia,serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:14px;font-family:system-ui,sans-serif}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.stat{font:13px system-ui,sans-serif;color:var(--mute);display:flex;justify-content:space-between;margin-bottom:12px}
.tabs,.chips{display:flex;gap:8px;margin-bottom:12px;font-family:system-ui,sans-serif;flex-wrap:wrap}
button{font-family:system-ui,sans-serif;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px}
.chips button{padding:6px 12px;font-size:13px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:240px;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.05);user-select:none}
.tp{font:12px system-ui,sans-serif;color:var(--mute);margin-bottom:12px}
.ref{font-size:22px;font-weight:700;color:var(--acc)}
.txt{font-size:18px;line-height:1.7}
.hint{margin-top:18px;font:12px system-ui,sans-serif;color:var(--mute);line-height:1.5}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;padding:14px}
.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.hide{display:none}
input,textarea{width:100%;font:15px system-ui,sans-serif;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:10px}
textarea{min-height:70px;resize:vertical;margin:8px 0 0}
.item{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;font-family:system-ui,sans-serif;font-size:14px;align-items:flex-start}
.item>div{flex:1}
.item b{color:var(--acc)}
.item small{display:block;color:var(--mute);margin-top:2px}
.note{font:12px system-ui,sans-serif;color:var(--mute);margin:14px 0;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>📖 주제별 성경암송 60구절</h1>
<div class="sub">A~E 시리즈 · 카드를 눌러 뒤집고, 외웠는지 체크하세요.</div>
<div class="bar"><i id="bar"></i></div>
<div class="stat"><span id="prog"></span><span id="left"></span></div>
<div class="tabs">
<button id="t5" onclick="toggleRnd()">랜덤 순서</button>
<button id="t4" onclick="toggleEn()">영어</button>
</div>
<section id="study">
<div class="chips" id="chips"></div>
<div class="card" id="card" onclick="flip()"></div>
<div class="row hide" id="ans">
<button class="bad" onclick="grade(false)">다시 볼래요</button>
<button class="ok" onclick="grade(true)">외웠어요</button>
</div>
<div class="note" style="margin:16px 0 6px">구절 바로 고르기</div>
<div class="chips" id="picks"></div>
</section>
</main>
<script id="verse-data">
/* ===== 본문 데이터 (여기에 추가하세요) =====
   형식:  "출처":[`한글 본문`,`영어 본문(선택)`],
   출처는 아래 목록의 표기와 똑같이 써야 카드에 연결돼요. 본문은 백틱(`)으로 감싸면 따옴표가 있어도 안전해요. */
var V={
// ---------- A 새로운 삶 ----------
"고린도후서 5:17":[`그런즉 누구든지 그리스도 안에 있으면 새로운 피조물이라 이전 것은 지나갔으니 보라 새 것이 되었도다`,`Therefore, if anyone is in Christ, he is a new creation; the old has gone, the new has come!`],
"갈라디아서 2:20":[`내가 그리스도와 함께 십자가에 못 박혔나니 그런즉 이제는 내가 사는 것이 아니요 오직 내 안에 그리스도께서 사시는 것이라 이제 내가 육체 가운데 사는 것은 나를 사랑하사 나를 위하여 자기 자신을 버리신 하나님의 아들을 믿는 믿음 안에서 사는 것이라`,`I have been crucified with Christ and I no longer live, but Christ lives in me. The life I live in the body, I live by faith in the Son of God, who loved me and gave himself for me.`],
"로마서 12:1":[`그러므로 형제들아 내가 하나님의 모든 자비하심으로 너희를 권하노니 너희 몸을 하나님이 기뻐하시는 거룩한 산 제물로 드리라 이는 너희가 드릴 영적 예배니라`,`Therefore, I urge you, brothers, in view of God's mercy, to offer your bodies as living sacrifices, holy and pleasing to God--this is your spiritual act of worship.`],
"요한복음 14:21":[`나의 계명을 지키는 자라야 나를 사랑하는 자니 나를 사랑하는 자는 내 아버지께 사랑을 받을 것이요 나도 그를 사랑하여 그에게 나를 나타내리라`,`Whoever has my commands and obeys them, he is the one who loves me. He who loves me will be loved by my Father, and I too will love him and show myself to him.`],
"디모데후서 3:16":[`모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니`,`All Scripture is God-breathed and is useful for teaching, rebuking, correcting and training in righteousness,`],
"여호수아 1:8":[`이 율법책을 네 입에서 떠나지 말게 하며 주야로 그것을 묵상하여 그 안에 기록된 대로 다 지켜 행하라 그리하면 네 길이 평탄하게 될 것이며 네가 형통하리라`,`Do not let this Book of the Law depart from your mouth; meditate on it day and night, so that you may be careful to do everything written in it. Then you will be prosperous and successful.`],
"요한복음 15:7":[`너희가 내 안에 거하고 내 말이 너희 안에 거하면 무엇이든지 원하는 대로 구하라 그리하면 이루리라`,`If you remain in me and my words remain in you, ask whatever you wish, and it will be given you.`],
"빌립보서 4:6-7":[`아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라`,`Do not be anxious about anything, but in everything, by prayer and petition, with thanksgiving, present your requests to God. And the peace of God, which transcends all understanding, will guard your hearts and your minds in Christ Jesus.`],
"마태복음 18:20":[`두세 사람이 내 이름으로 모인 곳에는 나도 그들 중에 있느니라`,`For where two or three come together in my name, there am I with them.`],
"히브리서 10:24-25":[`서로 돌아보아 사랑과 선행을 격려하며 모이기를 폐하는 어떤 사람들의 습관과 같이 하지 말고 오직 권하여 그 날이 가까움을 볼수록 더욱 그리하자`,`And let us consider how we may spur one another on toward love and good deeds. Let us not give up meeting together, as some are in the habit of doing, but let us encourage one another--and all the more as you see the Day approaching.`],
"마태복음 4:19":[`말씀하시되 나를 따라오라 내가 너희를 사람을 낚는 어부가 되게 하리라 하시니`,`"Come, follow me," Jesus said, "and I will make you fishers of men."`],
"로마서 1:16":[`내가 복음을 부끄러워하지 아니하노니 이 복음은 모든 믿는 자에게 구원을 주시는 하나님의 능력이 됨이라 먼저는 유대인에게요 그리고 헬라인에게로다`,`I am not ashamed of the gospel, because it is the power of God for the salvation of everyone who believes: first for the Jew, then for the Gentile.`],
// ---------- B 그리스도를 전파함 ----------
// 로마서 3:23 · 이사야 53:6 · 로마서 6:23 · 히브리서 9:27 · 로마서 5:8 · 베드로전서 3:18
// 에베소서 2:8-9 · 디도서 3:5 · 요한복음 1:12 · 요한계시록 3:20 · 요한일서 5:13 · 요한복음 5:24
// ---------- C 하나님을 의뢰함 ----------
// 고린도전서 3:16 · 고린도전서 2:12 · 이사야 41:10 · 빌립보서 4:13 · 예레미야애가 3:22-23 · 민수기 23:19
// 베드로전서 5:7 · 시편 55:22 · 로마서 8:32 · 빌립보서 4:19 · 고린도전서 10:13 · 히브리서 2:18
// ---------- D 그리스도 제자의 자격 ----------
// 마태복음 6:33 · 누가복음 9:23 · 요한일서 2:15-16 · 로마서 12:2 · 고린도전서 15:58 · 히브리서 12:3
// 마가복음 10:45 · 고린도후서 4:5 · 잠언 3:9-10 · 고린도후서 9:6-7 · 사도행전 1:8 · 마태복음 28:19-20
// ---------- E 그리스도를 닮아 감 ----------
// 요한복음 13:34-35 · 요한일서 3:18 · 빌립보서 2:3-4 · 베드로전서 5:5-6 · 에베소서 5:3 · 베드로전서 2:11
// 레위기 19:11 · 사도행전 24:16 · 히브리서 11:6 · 로마서 4:20-21 · 갈라디아서 6:9-10 · 마태복음 5:16
};
</script>
<script>
var KEY="tms-cards-v2";
var D=[
["A","새로운 삶",[["중심되신 그리스도","고린도후서 5:17","갈라디아서 2:20"],["그리스도께 순종","로마서 12:1","요한복음 14:21"],["말씀","디모데후서 3:16","여호수아 1:8"],["기도","요한복음 15:7","빌립보서 4:6-7"],["교제","마태복음 18:20","히브리서 10:24-25"],["증거","마태복음 4:19","로마서 1:16"]]],
["B","그리스도를 전파함",[["모든 사람이 죄를 범함","로마서 3:23","이사야 53:6"],["죄의 형벌","로마서 6:23","히브리서 9:27"],["그리스도가 형벌을 받음","로마서 5:8","베드로전서 3:18"],["선행으로 구원받지 못함","에베소서 2:8-9","디도서 3:5"],["그리스도를 모셔야 함","요한복음 1:12","요한계시록 3:20"],["구원의 확신","요한일서 5:13","요한복음 5:24"]]],
["C","하나님을 의뢰함",[["성령","고린도전서 3:16","고린도전서 2:12"],["능력","이사야 41:10","빌립보서 4:13"],["성실","예레미야애가 3:22-23","민수기 23:19"],["평안","베드로전서 5:7","시편 55:22"],["공급","로마서 8:32","빌립보서 4:19"],["유혹에서 도우심","고린도전서 10:13","히브리서 2:18"]]],
["D","그리스도 제자의 자격",[["그리스도를 첫자리에 모심","마태복음 6:33","누가복음 9:23"],["죄에서 떠남","요한일서 2:15-16","로마서 12:2"],["견고함","고린도전서 15:58","히브리서 12:3"],["다른 사람을 섬김","마가복음 10:45","고린도후서 4:5"],["후히 드릴 것","잠언 3:9-10","고린도후서 9:6-7"],["세계 비전","사도행전 1:8","마태복음 28:19-20"]]],
["E","그리스도를 닮아 감",[["사랑","요한복음 13:34-35","요한일서 3:18"],["겸손","빌립보서 2:3-4","베드로전서 5:5-6"],["순결","에베소서 5:3","베드로전서 2:11"],["정직","레위기 19:11","사도행전 24:16"],["믿음","히브리서 11:6","로마서 4:20-21"],["선행","갈라디아서 6:9-10","마태복음 5:16"]]]
];
function seed(){var s=[],id=1;D.forEach(function(p){p[2].forEach(function(t){for(var i=1;i<3;i++)s.push({id:id++,pk:p[0],tp:t[0],ref:t[i],text:"",box:0})})});return s}
function applyV(a){a.forEach(function(c){var v=V[c.ref];if(v){c.text=v[0];c.en=v[1]||""}});return a}
function load(){try{var r=localStorage.getItem(KEY);if(r)return applyV(JSON.parse(r))}catch(e){}return applyV(seed())}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cards))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var cards=load(),queue=[],cur=null,shown=false,reverse=false,showEn=false,rnd=false,pack="A";
function pool(){return cards.filter(function(c){return c.text&&(pack==="all"||c.pk===pack)})}
function chips(){
var h='<button class="'+(pack==="all"?"on":"")+'" onclick="setPack(\'all\')">전체</button>';
D.forEach(function(p){h+='<button class="'+(pack===p[0]?"on":"")+'" onclick="setPack(\''+p[0]+'\')">'+p[0]+' '+esc(p[1])+'</button>'});
document.getElementById("chips").innerHTML=h;
}
function setPack(k){pack=k;chips();build()}
function build(){queue=pool().filter(function(c){return c.box<3});if(rnd)queue.sort(function(){return Math.random()-.5});next()}
function next(){cur=queue.shift()||null;shown=false;render()}
function render(){picks();
var all=pool(),done=all.filter(function(c){return c.box>=3}).length;
document.getElementById("bar").style.width=(all.length?done/all.length*100:0)+"%";
document.getElementById("prog").textContent="외운 구절 "+done+" / "+all.length;
document.getElementById("left").textContent=cur?"남은 카드 "+(queue.length+1):"";
var el=document.getElementById("card"),a=document.getElementById("ans");
if(!cur){
a.classList.add("hide");
el.innerHTML=all.length?'<div class="ref">🎉 학습 완료!</div><div class="hint">이 묶음의 구절을 모두 외웠어요.</div><button style="margin-top:14px" onclick="event.stopPropagation();reset()">처음부터 다시</button>':'<div class="hint">이 섹션은 아직 본문이 준비되지 않았어요.</div>';
return}
var tag='<div class="tp">'+(cur.pk?cur.pk+" · ":"")+esc(cur.tp)+'</div>';
var R='<div class="ref">'+esc(cur.ref)+'</div>',T='<div class="txt">'+esc(cur.text)+'</div>'+(showEn&&cur.en?'<div class="txt" style="font-size:14px;color:var(--mute);margin-top:12px">'+esc(cur.en)+'</div>':'');
var front=reverse?T:R,back=reverse?R:T;
el.innerHTML=tag+(shown?back:front)+'<div class="hint">'+(shown?"":"눌러서 확인")+"</div>";
a.classList.toggle("hide",!shown);
}
function flip(){if(!cur)return;shown=!shown;render()}
function grade(ok){if(ok){cur.box++}else{cur.box=0;queue.push(cur)}save();next()}
function reset(){pool().forEach(function(c){c.box=0});save();build()}
function toggleRnd(){rnd=!rnd;document.getElementById("t5").classList.toggle("on",rnd);build()}
function picks(){var h="";pool().forEach(function(c){var on=cur&&cur.id===c.id;h+='<button class="'+(on?"on":"")+'" onclick="jump('+c.id+')">'+esc(c.ref)+'</button>'});document.getElementById("picks").innerHTML=h}
function jump(id){var c=cards.filter(function(x){return x.id===id})[0];if(!c)return;if(cur&&cur.id!==c.id&&cur.box<3)queue.unshift(cur);queue=queue.filter(function(x){return x.id!==c.id});cur=c;shown=false;render()}
function toggleEn(){showEn=!showEn;document.getElementById("t4").classList.toggle("on",showEn);render()}
chips();build();
</script>
</body>
</html>
