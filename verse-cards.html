<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>주제별 성경암송 60구절 플래시카드</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2622;--mute:#8a8178;--acc:#7a5c3e;--ok:#4f8a5b;--bad:#b5533c;--line:#e6dfd4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a17;--card:#2a2622;--ink:#f1ebe3;--mute:#a39a8f;--acc:#d2a974;--line:#3b352f}}
:root[data-theme="dark"]{--bg:#1d1a17;--card:#2a2622;--ink:#f1ebe3;--mute:#a39a8f;--acc:#d2a974;--line:#3b352f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif KR",Georgia,serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:14px;font-family:system-ui,sans-serif}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.stat{font:13px system-ui,sans-serif;color:var(--mute);display:flex;justify-content:space-between;margin-bottom:12px}
.tabs,.chips{display:flex;gap:8px;margin-bottom:12px;font-family:system-ui,sans-serif;flex-wrap:wrap}
button{font-family:system-ui,sans-serif;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px}
.chips button{padding:6px 12px;font-size:13px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;min-height:240px;padding:28px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.05);user-select:none}
.tp{font:12px system-ui,sans-serif;color:var(--mute);margin-bottom:12px}
.ref{font-size:22px;font-weight:700;color:var(--acc)}
.txt{font-size:18px;line-height:1.7}
.hint{margin-top:18px;font:12px system-ui,sans-serif;color:var(--mute);line-height:1.5}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;padding:14px}
.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.hide{display:none}
input,textarea{width:100%;font:15px system-ui,sans-serif;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin-bottom:10px}
textarea{min-height:70px;resize:vertical;margin:8px 0 0}
.item{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;font-family:system-ui,sans-serif;font-size:14px;align-items:flex-start}
