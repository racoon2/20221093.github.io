<!DOCTYPE html>
<html lang="ko">
<head>

<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b1d21;--sub:#6b7280;--line:#e6e8ec;--accent:#12a37a;--accent-soft:#e7f6f1;--hl:#fff3b0}
@media (prefers-color-scheme: dark){:root{--bg:#121417;--card:#1c1f24;--ink:#eceef1;--sub:#9aa1ab;--line:#2b2f36;--accent:#3cc99c;--accent-soft:#183a30;--hl:#5a4d10}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.top{flex:none;background:#000}
.vid{position:relative;width:100%;aspect-ratio:16/9}
.vid{max-height:38vh;width:min(100%,calc(38vh*16/9));margin:0 auto}
.pbar{flex:none;position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;background:var(--card);padding:14px 14px calc(6px + env(safe-area-inset-bottom))}
.pbar .line{position:absolute;left:0;right:0;top:0;height:3px;background:var(--line);pointer-events:none}
.pbar .line i{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:var(--accent)}
.pbar .line b{position:absolute;top:50%;left:var(--p,0%);width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--accent)}
.pbar .seek{position:absolute;left:0;right:0;top:-2px;height:20px;width:100%;margin:0;padding:0;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:none}
.pbar .t{flex:1;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.pbar .t.r{text-align:right}
.pbar .btns{display:flex;align-items:center;gap:16px}
.pbar .sk{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--sub);font:inherit;font-size:11px;cursor:pointer}
.pbar .pp{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:15px;cursor:pointer}
.tabs .home{flex:none;width:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--sub);text-decoration:none;font-size:10.5px;border-right:1px solid var(--line)}
.tabs .home:active{color:var(--accent)}
.mctl{display:none}
.lm{border:1px solid var(--line);background:none;color:var(--sub);border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer;margin-left:6px}
body.mini{display:flex!important;flex-direction:column;max-width:720px;height:100%;height:100dvh}
body.mini .top{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
body.mini .vid{flex:none;width:200px!important;background:#000;max-height:none;margin:0;border-radius:8px;overflow:hidden}
body.mini .mctl{display:flex;flex:1;min-width:0;flex-direction:column;gap:6px}
body.mini .head{display:none}
body.mini .tabs,body.mini .scroll{border-left:0;margin:0}
body.mini .scroll{flex:1}
.mctl .mt{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mctl .mr{display:flex;align-items:center;gap:8px}
.mctl .pp{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:14px;cursor:pointer}
.mctl .tm{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;flex:1}
.mctl .ex{flex:none;border:1px solid var(--line);background:none;color:var(--sub);border-radius:999px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
@media (min-width:900px){
  .pbar{grid-column:1/3;grid-row:4}
  body{max-width:1280px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(400px,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;height:100vh;height:100dvh;column-gap:0}
  .top{grid-column:1;grid-row:1/3;background:#000;display:flex;align-items:center;justify-content:center}
  .vid{max-height:none;width:100%}
  .head{grid-column:1;grid-row:3;align-self:start;border-bottom:0;padding:14px 18px}
  .head h1{font-size:20px}
  .tabs{grid-column:2;grid-row:1;border-left:1px solid var(--line)}
  .scroll{grid-column:2;grid-row:2/4;border-left:1px solid var(--line);background:var(--bg)}
}
.vid #yt,.vid iframe{position:absolute;inset:0;width:100%;height:100%}
.head{flex:none;background:var(--card);padding:10px 14px;border-bottom:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;align-items:center}
.bm{border:1px solid var(--line);background:none;color:var(--sub);border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.bm.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.back{display:inline-block;font-size:13px;color:var(--accent);text-decoration:none;margin-bottom:4px;font-weight:500}
.head h1{font-size:16px;margin:0 0 2px;line-height:1.35}
.head .meta{font-size:12.5px;color:var(--sub)}
.tabs{flex:none;display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:11px 0;font:inherit;font-size:14.5px;color:var(--sub);border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);font-weight:700;border-color:var(--accent)}
.scroll{flex:1;overflow-y:auto;position:relative}
section{display:none;padding:10px 14px 40px}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.card p{margin:0;font-size:calc(15px * var(--fz,1));line-height:1.75}
.kw{display:flex;flex-wrap:wrap;gap:6px}.kw span{font-size:13px;background:var(--accent-soft);color:var(--accent);padding:5px 10px;border-radius:999px}
ol.pts{margin:0;padding:0;list-style:none;counter-reset:p}
ol.pts li{counter-increment:p;position:relative;padding:0 0 14px 34px;font-size:15px;line-height:1.7}
ol.pts li::before{content:counter(p);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
ol.pts li b{display:block} ol.pts li small{color:var(--sub);font-size:13.5px}
.chap a{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14.5px}
.chap a:first-child{border-top:0}
.chap time{color:var(--accent);min-width:44px;font-weight:500;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center;padding:0 0 8px}
.tools input{flex:1;font:inherit;font-size:15px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.follow{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:8px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.follow.on{color:var(--accent);border-color:var(--accent)}
.count{font-size:12.5px;color:var(--sub);min-height:0}
.tip{font-size:12.5px;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.seg{display:flex;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);border-radius:10px}
.seg.now{background:var(--accent-soft)}
.av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.who{font-size:13px;color:var(--sub);margin-bottom:3px}
.who button{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;margin-left:6px;padding:0;cursor:pointer;font-variant-numeric:tabular-nums}
.tx{font-size:calc(15.5px * var(--fz,1));line-height:1.85;word-break:keep-all}
ol.pts li{font-size:calc(15px * var(--fz,1))!important}
.gear{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:8px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.tools input{min-width:0;width:0}
.setp .row{flex-wrap:wrap}
.setp{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.setp.on{display:block}
.setp .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.setp .lb{font-size:13.5px;font-weight:500}
.fsz{display:flex;gap:4px}
.fsz button{border:1px solid var(--line);background:none;color:var(--sub);border-radius:8px;min-width:38px;padding:6px 0;cursor:pointer;font-family:inherit}
.fsz button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.setp .pv{margin-top:10px;font-size:calc(15.5px * var(--fz,1));line-height:1.8;color:var(--sub)}
.w{cursor:pointer;border-radius:3px}
.w.say{background:var(--accent);color:#fff}
mark{background:var(--hl);color:inherit;border-radius:3px}
.hide{display:none}
.note{font-size:12.5px;color:var(--sub);line-height:1.6;padding:14px 4px 0}
body.mini{display:flex!important}
</style>
</head>

<script>

const T=[["0:00", "여러분, 오늘은 추수감사절로 지키는 날입니다. 그러면 제목이 감사하든지 감사합시다, 감사합니다, 고맙습니다 이러든지 해야 되는데 금식합시다 이러니까 이게 무슨 말인가 생각할 수 있는데요. 우리가 산상수훈을 지금 계속 주일마다 강해하고 있어서 사실 저는 설교 자체가 감사입니다. 잘 들어 보시면 감사절을 특별히 할 수 없는 게 제 설교 자체가 감사해요. 매 순간마다 여러분 1년 한 해를 이렇게 돌이켜 볼 때 좋은 일이 많이 생겨서도 감사를 해야 되지만, 좋지 않은 일들이 좋아져서 감사가 되는 게 더 크잖아요. 그렇죠?"], ["0:50", "여러분 날마다 해 뜨면요, 해의 감사를 몰라요. 근데 매일 비 오다가 갑자기 어느 순간 해가 뜨면요, '야, 오늘은 날씨 참 좋다. 놀러 가기 딱 좋은 날씨다' 이런단 말이에요. 그러니까 상대방이 옆에서 보면서 항상 웃는 사람은 그 사람이 자기를 향해서 웃어주는 것을 고마워하지 않아요. 근데 항상 찡그리는 사람이 또 어떡하다 갑자기 웃어 버리면 '무슨 병 들었나? 아, 이거 하던 짓 그냥 해야 되는데 갑자기 안 하던 짓 하면 간대요'라고 생각한단 말이죠. 그죠? 아멘. 그러니까 늘 여러분들 하던 좋은 거 많이 하셔야 됩니다. 옆 사람 볼 때 웃으면서 반갑습니다, 집에서도 남편한테 반갑습니다, 아내한테 사랑합니다, 고맙습니다, 자녀들한테 이쁘다 하고 해줘야 돼요."], ["1:45", "그거 안 하면요, 제가 시키는 거 하자고 해서 집에 가서 하니까 어색해요, 잘 나와요? 아, 안 했구나. 좀 시키는 대로 하셔야 되는데 어색해요, 잘 나와요? 어색해요. 그러니까 하던 좋은 거를 계속하십시오. 나쁜 거는 좀 하지 마시고. 그래서 안 좋은 거, '내가 이런 말 하면 상대방이 기분이 나쁠 거야' 그거 말고 '상대방이 나한테 내가 하고 싶은 말을 하면 나도 기분은 별로일 거야' 요렇게 생각하면 상대방한테 그런 얘기 잘 안 해요. 그 1년 동안에 여러분 감사할 게 뭡니까? 하나님 고맙습니다, 하나님 감사합니다. 어떤 거 감사하죠? 우리 자녀들 잘 키워주셔서 감사합니다. 그리고 또 뭡니까? 우리 남편 열심히 직장 생활해서 감사합니다. 또 우리 아내 아프지 않고 가정 살림 잘해서 감사합니다."], ["2:45", "여러분 감사할 게 얼마나 많아요. 우리 부모님들 건강하게 병원 안 다니셔서 감사합니다. 너무 많은 거예요. 근데 또 감사절 하니까 '왜 이상하게 앞에 목사가 바뀌더니 하나씩 다 바뀌는 것 같아' 그러지 말고, 이 앞에다가 과일도 갖다 놓고 배도 갖다 놓고 사과도, 밑으로는 무도, 배추도, 양파도, 파도, 마늘도, 고추도 몰라서 안 한 거 아니에요. 문제는 그냥 슈퍼에서 사다가 갖다 놓으면 감사가 안 돼. 자기가 지은 거 갖고 오면 되는데, 여러분들 내년부터 한번 약속할까요? 내가 지은 거 갖다 놓기! 그러면 아무도 안 갖다 놓고 '목사님 없는 게 좋을 것 같아요' 그럴 수도 있어요. 슈퍼에서 갖다 놓는 거 하나도 감사 안 돼."], ["3:31", "그리고 그거 나중에 처치 곤란이고 교인도 안 가져가 잘. 저도 예전에 많이 해봤는데 해 볼 때마다 늘 염려되는 게 뭐냐면 갖다 놓기는 쉬운데 처치 곤란이 너무 힘들더라고. 그래 갖고 '아이 하지 말자' 하니까 얼마나 좋아. 뭘 갖다 놓을까 걱정할 것도 없고, 염려할 것도 없고, 근심할 것도 없고. 또 갖다 놓으려니까 '아유 이왕이면 목사님 말씀하시기를 좋은 거 갖다 놓으라고 하는데 슈퍼 갔더니 좋은 건 비싸, 그죠?' 갖고 무슨 생각이 듭니까? 좋은 거 갖다 놓는 건 당연히 좋은데 좋은 걸 갖다 놓으려니까 자꾸 주머니를 열었다 뺐다 열었다 뺐다 해야 된단 말이야. 그러니까 저는 그런 고민 없애려고 '갖다 놓지 마' 그런 거예요. 잘했다고 생각하면 박수 한번 줘 봐요. 그지? 예, 그렇죠."], ["4:22", "그러니까는 저도 하나님 앞에 기도하는 거예요. '주님 그 앞에다 뭐 갖다 놓는 거 좋으세요?' 그랬더니 '나는 별로 안 좋아' 그러시더라고. 그 내가 그다음부터 주님이 안 좋아하는 걸 뭐 하러 내가 하려고 해요. 주님이 안 좋아하는 걸 뭘 성도들이 하려고 그래. 그래서 그냥 없으니까 얼마나 좋아요. 그렇죠? 우리 꽃도 그래. 여기 좀 있으면 꽃도 다 치울 건데 저는 강단에다 꽃 갖다 놓는 거, 나무 갖다 놓는 거 별로 안 좋아해요. 왜 안 좋아하냐면 강단은 살려야 되는 곳이잖아요. 죽은 자도 살리고 병든 자도 낫게 하고 안 되는 직업도 되게 하고, 아멘. 못생긴 얼굴도 좀 이쁘게 잘생기게 만들면 더 좋은데 그럴 거면 뭐 제 머리부터 심어졌겠지, 그죠?"], ["5:05", "그러니까 그런 여러 가지를 생각하면 이 앞에는 뭐가 있어야 돼? 모든 게 다 좋아지는 것만 있어야 돼. 그래 안 그래? 그죠? 근데 꼭 갖다 놓으면 처음에는 좋은데 조금 지나면 다 시들어. 그리고 일주일에 한 번씩 그거 갖다 놓으려면 얼마나 답답해요. 그게 꽃꽂이 하는 분들은요, 여기다 갖다 놓지 말고 집에다가 꽃꽂이 하세요. 남편 보라고, 그리고 아내 보라고, 또 애들 보라고. 집에다가 꽃꽂이 하면 얼마나 좋아. 집에서는 꽃꽂이 생전도 안 하는데 여기다가만 갖다 놓으면 좀 그래. 그렇죠? 그러니까는 집에서 안 하는 건 교회에서도 하지 마세요. 집에서 하는 거 교회에서도 하고 얼마나 좋을까? 그럴까 안 그럴까요? 그렇죠. 그래서 '야, 정말 우리 마누라가 바뀌었다. 우리 남편이 바뀌었다. 우리 애들이 바뀌었다' 그런 소리 조금 들어야 좋을까 안 좋을까요? 좋은 거예요."], ["5:56", "그러니까 사실은요. 교회를 다녔더니 우리 자식이 공부를 조금 많이 못 했는데 교회에서 예배드리더니 얘가 정신 차리고 열심히 공부를 해요. 그것도 잘 바뀐 거지만은 항상 얼굴이 우울한데 교회 왔더니 활짝 밝아졌더라. 얼마나 좋아요? 그게 제일 좋은 거예요. 알아들으시겠죠? 제일 중요한 건 자녀들에게 제일 중요한 건 공부를 잘하는 게 아니고 건강한 거예요. 건강한 거. 건강한 건 공짜로 얻는 게 아니고 늘 사랑해 줄 때 건강한 거예요. 내 새끼 손 잡고 사랑해 주고 내 새끼 이쁘다고 볼 만져 주고 요럴 때가 뭡니까? 건강해지는 거예요. 그러니까는 목사가 바뀌었다고 불편해하지 마시고 목사가 바뀌어서 좋기는 좋아, 재밌기는 하잖아. 그렇게 하면서 마음속에 실천하는 하루하루를 만들어 내세요. 실천하는 하루하루를. 아멘."], ["6:47", "예. 그래서 오늘 집 가면은 만나는 사람마다 이쁘다, 사랑스럽다. 어제 점심을 먹는데 그 뭐죠? 아르바이트생 여자애들이 두 명이 막 뭐 나르고 그러는데 제가 계속 쳐다봤어요. 그 나보고 딱 쳐다보더니 뭘 자꾸 쳐다보고 그러냐고. 이게 또 다른 말로 하면 기분 나쁜 말로 하면 '왜 자꾸 꼬나보고 그래' 그러는 것 같은 느낌이 드는 거야. 제 나름대로요. 그런데 딱 쳐다보고 '어, 참 그렇게 얼굴이 작고' 내가 그랬더니 '고맙습니다' 하고 웃더라고. 얼굴 작은 게 뭘 고마워. 얼굴은 크고 봐야 되는 거예요. 왜 얼굴이 크고 봐야 되는지 아십니까? 얼굴이 커야 남이 알아볼 거 아니야? 아니 남이 안 알아볼 건 뭘 얼굴 갖고 다녀? 뒤통수를 갖고 다니지. 근데 얼굴은 뭐죠? 남이 보라고 있는 거야. 그래 안 그래요?"], ["7:38", "큰 얼굴이 좋은 거야. 왜? 멀리 봐도 다 보이잖아. 한 100m 떨어져도 '아, 누가 오는구나'. 얼마나 그래요? 제 얼굴이 크고 보니까 우리 교인들이 200m 떨어져도 '목사님 오시는구나' 하고 금방 알더라고. 그러니까 얼굴은 뭐 하고 봐야 된다? 크고 봐야 되는 거예요. 옆에 사람 쳐다보고 얼굴 작은 사람은 '안타깝네' 하고 한 마디씩 해 줘 봐. 그리고 얼굴 큰 사람들은 뭡니까? '복이 있네'. 얼마나 좋아. 그죠? 고민할 거 하나도 없어요. 이해가 되시죠? 고민할 거 하나도 없어. 다 좋은 거야. 1년 내내 돌아다니면서 '나는 너무 기쁘고 즐거워요' 이것만큼 즐거운 게 어디 있어요? 이게 감사절의 클라이맥스인 거야, 클라이맥스."], ["8:20", "'목사님, 제가 오늘 설교 들어 보니까 저는요 행복한 사람입니다' 누가 그러더라고. 제 컬러링 들어보면은 아, 예전에 우리 장경동 목사님 사모님이 저한테 전화를 했는데 컬러링 들어보더니 '나는 행복한 사람이잖아' 끊어버렸대. 잘못 건 줄 알고. 그 한 번 더 했는데도 똑같은 거. 그래서 번호가 바뀌었나? 제 번호 맞아요. 나는 정말 행복한 사람. 얼마나 좋아요? 목사나 성도나 누구나 다 1년 내내 저는 행복했으면 좋겠어요. 아멘. 예. 염려, 걱정, 근심이 없을 수는 없지만 있어도 그거 슬쩍 패스. 얼마나 좋아. 걱정도 패스. 슬픔도 패스. 아픔도 패스. '내 안에는 그런 건 없어' 이렇게 하고 살면 얼마나 좋아요. 그래 안 그래요?"], ["9:10", "기도할 때 그럼 무슨 기도 안 해도 돼? 건강 기도 안 해도 되잖아. 왜? 이왕 된 건데 뭘 해? 우리 기도할 때 안 되는 거만 하잖아. 그죠? 잘 생각해 봐. 그러니까 기도 제목이 많은 사람은 안 되는 게 많은 거예요, 적은 거예요? 많은 거예요. 근데 기도 제목이 조금인 사람은 안 되는 게 많은 거예요, 적은 거예요? 적은 거예요. 그러니까 어떤 사람 보고 나서 딱 봤더니 30분 안에 모든 기도가 다 끝났대. 옆에 사람이 뭐라 하냐면 '무슨 기도가 30분 만에'라고 얘기하면 그 사람은 무슨 기도는 끝난 거예요? 자기 염려 걱정은 다 끝난 거예요. 그다음 기도는 무슨 기도할까? 하나님 앞에 영성 훈련 기도해야 되고, 성령 충만 기도해야 되고, 날마다 믿음 안에 강건하게 세워지도록 기도해야 되고, 큰 믿음 달라고 기도해야 되고, 아멘. 그거는 30분 이후부터 하셔요. 30분 이후부터 아시겠죠?"], ["10:02", "그래서 '저는 아직까지는 믿음이 좀 그래요' 그러면 무슨 기도는 하고 봐야 돼. 자기 기도는 하고 봐야 돼. 자기 기도는 그럴까 안 그럴까요? 자기 기도는 하고 봐야 되는 거예요. 중보기도도 자기 기도 안 하고 남의 기도하지 마. 저는요, 자기도 걱정스러운데 남 걱정하는 사람 더 답답해요. 가장 먼저는 뭐예요? 나부터 안 답답하고 봐야 되는 거예요. 그럴까 안 그럴까요? 나부터 시원하고 봐야 되는 거고, 나부터 기분 좋고 봐야 되는 거고, 나부터 즐겁고 봐야 되는 거고, 나부터 행복하고 봐야 되는 거야. 그래 안 그래요?"], ["10:35", "그래서 제가 저저번 주인가 설교했을 때 그때 실천했나 모르겠어. 이렇게 지나가다가 '혹시 누가 오늘 나한테 한우 소고기 안 사 줄까?' 그런 고민하지 마. 안 사 줘요. 하지 말고 그냥 그래. 제가 이름이 임헌규잖아요. 그럼 내가 소고기 먹고 싶으면은 내가 나한테 그래. '헌규야, 너 소고기 먹고 싶지 않냐?' '그럼 어떻게 알았어?' '내가 사 줄게, 가자.' '좋아 좋아 가자.' 그렇게 하고요, 제가 저한테 소고기 산다니까요. 그렇게 하고 앉아 가지고 '이왕이면 한우 먹고 싶지?' '아이 그럼 한우 먹고 싶지.' '그럼 빨리 한우 시켜, 내가 낼게.' 그렇게 하고 한우는 제가 시키고 돈은 주머니에서 내고, 그러면서 제가 저한테 사니까요 얼마나 행복한지 몰라. 욕먹을 이유도 없고 눈치 볼 이유도 없고 누가 사 주고 나서 괜히 비싼 거 쳐 먹네 그러는 욕먹을 필요도 없고. 얼마나 좋아. 자기가 자기한테 사는 것만큼 행복한 게 없어요. 그럴까 안 그럴까요? 그렇습니다."], ["11:33", "아휴, 200년 사는 것도 아닌데 뭘 먹을 걸 못 먹고 살고 뭘 입을 걸 못 입고 살고 뭘 신을 걸 그냥 뭐 안 신고 살아요. 신고 싶은 거를. 200년 살 것도 아닌데 그냥 저지르고 보는 거예요. 그리고 그다음에는 몰라요. 어떻게 되겠지 뭘 그래? 그래도 신고 다니면 좋잖아. 그럴까 안 그럴까요? 좋잖아. 어, 우리 청년이 그러더라고요. 예전에 청년들 이렇게 모였는데 '목사님 저는요...' '야, 너 엄마한테 용돈 좀 많이 좀 달라 그래. 그러면 안 주냐?' 그랬더니 욕을 엄청나게 먹어도 안 준대. 그러니까 제가 '달라고 하지 마.' 근데 옆에 놈이 그러더라고. '근데 나는 받기는 받는데 욕을 억수로 먹어' 그러더라고. 제가 애들하고 다 그랬어요. '부럽다. 왜? 욕을 먹어도 주는 사람이 있으니 얼마나 좋아.'"], ["12:27", "그죠? 욕을 왕창 먹어도 주는 사람이 있으니 얼마나 좋아. 부부도 그래요. 가서 신발을 딱 봤더니 '야, 신발이 60만 원짜리네. 야, 이거 하나 신고 다녀. 60만 원 신고 다녀.' 얼마나 그래? 그러면 그때 뭐라고? '야, 내가 사 줄게 신어.' 누가 누구한테 말해야 돼? 자기가 자기한테 말해. '내가 사 줄게 신어.' 그럼 얼렁 신고 오면 '그거 어디서 난 거야?' 남편이 귀신같이 알아. 그러면은요 '세상에 이 여자가 미쳤나? 정신이 나갔나? 60만 원짜리 신발을 사 갖고 왔어요. 이게 미쳐도 단단히 미쳤네.' 그리고 안 받고 오기만 하면 감사해. 왜? 아니 그 한 30분 욕먹고 그 60만 원짜리 신발 살 거면 저는 두 시간 욕먹고도 사. 왜? 욕먹고 난 다음에 계속 신고 다니잖아. 그럴까 안 그럴까요?"], ["13:20", "우리 한국 사람들은 너무 체면이 커서 문제요. '내가 치사하고 더러워서 안 먹어.' 치사하고 더러워도 드세요. 왜? 배부르고 봐야 돼. 치사하고 더러운 거는 배 안 불러. 근데 치사하고 더러워도 먹고 나면 배부르잖아. 그럴까 안 그럴까요? 그래서 부부끼리 싸워도 그냥 싸우다가 '에이씨 안 먹어' 하고 던져 갖고 자기 방으로 쑥 들어갔다가도 가만히 있으면 배고프잖아. 그럼 어떡할까요? 그냥 와서 조용히 먹어. 그러면 마누라가 '그거냐? 안 먹는다며?' '배고프니까 먹고서 얘기하자.' 그리고 실컷 먹고 가 가지고 또 얘기해. 얼마나 좋아요? '아휴 너는 밸도 없냐?' '밸 없어요. 걱정하지 마요. 밸도 없고 뭐도 없고 다 없어.' 그렇게 사니까 행복하다 이거요. 그렇게 사니까 일찍 죽지도 않아. 그렇게 사니까 병도 안 걸려."], ["14:13", "그러니까 자꾸 뭐 하지 말고 자존심 그딴 거 하지 말고 또 누가 뭐라 해도 '그래 미안해' 이렇게 하면 얼마나 좋아. '내가 뭘 잘못했다고 미안하다 그래?' 그냥 미안하다 그래. 돈 주는 것도 아닌데 뭘 그래. 그냥 미안하다고 그래요. 저는요, 다른 사람이 100번 미안하다 그래. 그럼 저는 100번도 미안하다 그래. 왜? 10원도 안 주고 100번 미안하다는데 뭐가 어려워? 그게 어려워요 여러분들요? 저는 쉬워요. 누가 해서 '어 임 목사님 실수한 거예요' '아 미안해요.' '임 목사님 잘못한 거예요' '아 미안해요.' 저는요 입에서 그냥 나와요 항상. 알아들으시죠? 그러다 보니까 행복한 사람이에요. 사람들이 저를 되게 좋아해."], ["14:55", "그래서 어딜 가도 '아이고 임 목사님 오면 재밌는데'. 여러분들, '나는 사람들하고 같이 있으면 사람들이 나 있으면 재밌어합니다' 빨리 손 들어 봐라 빨리! '재밌어합니다' 빨리! 어이고 있네 여기 목사님 보고 좋아요. 빨리 손 들어 봐. '사람들이 나 있으면 재수가 없다고 생각해' 빨리 손 들어 봐. 남들은 말하지 않는데 내가 느낌이 그래. 재수가 없는 것 같아. 빨리 손 들어 봐 얼렁. 그리고 어떤 사람은 이런 사람도 있잖아. '저 사람이 꼭 안 가고 싶어, 그 사람이 주인공이니까' 하고 빨리 손 들어 봐. 봐 봐. 아무도 안... 저기 하나 있네. 아유 그죠? 앞으로는 뭡니까? 꼭 오라고 하는 사람. '저 사람이 없으면 재미가 하나도 없어. 저 사람이 없으면 정말로 밥도 밥맛이 없어' 이런 사람 꼭 돼야 돼, 안 돼야 돼요? 돼야 돼."], ["15:42", "돼야 돼요. 그게 뭐 하는 사람이라고요? 오늘 하나님 앞에 감사드릴 수 있는 사람이라고요. 감사드릴 수 있는 게 별거 아니에요. 어떤 겁니까? 사람들이 나를 너무 좋아해. 사람들이 나를 너무 좋아해. 밥만 사 줘도 좋아해. 그럼 밥 사 주면 되잖아. 저 사람이 나를 좋아한대. 얼마나 좋아. 아니 생각해 봐. 우리 여기 젊은 형제들한테 물어볼게. '내가 좋아하는 자매가 있는데 나한테 밥 한 그릇 사 주면 연애해 준대. 그럼 사 줄 거야 안 사 줄 거야?' 빨리 얘기해 봐. 사 줄 거야 안 사 줄 거야? 빨리 얘기해 봐. 사! 봐 봐. 집 사 달라는 것도 아니고 밥 사 달라는데 뭘 그렇게 힘들어? 그지? 그냥 사 달라는 대로 막 사 주는 거야. 그냥 뭘 얼마나 든다고 그래? 밥이 무슨 천만 원 가요? 밥이 무슨 100만 원 가요? 해봤자 결국은 해장국이 11,000원이고 백반이 9,000원이고 김치찌개가 9,500원이고 조금 올랐어 요즘에."], ["16:39", "그 뭘 그렇게 많다 그래. 마음을 세종월드교회는 넓고 크게 가져서, 아멘. 넓고 크게 가져서 누구든지 예스맨이 되시기 바랍니다. 예스걸 예스맨 되겠습니다. 시작. 예스. 예, 누가 뭐라 해도 예스. 누가 뭐 해도 예스. 여러분들 알겠죠? 누가 교회 오려고 딱 준비하는데 '야 우리 오늘 맛있는 거 먹으러 가자. 야 교회 하루 안 간다고 뭐 문제가 되냐?' 그럼 뭐라 합니까? '오늘 네 얘기 패스.' 얼마나 좋아. 그지? '오늘 네 얘기 패스. 예배 끝나고 하자.' 멋있잖아요. 그죠? 그런 거부할 줄도 알아야 돼요. 여러분 아시겠죠? 감사절은요 그것만 지켜도 딱이요. 딱 1년을 가만히 보면 '항상 웃었습니다' 얼마나 좋아. 항상 기뻐해라, 쉬지 말고 기도해라, 범사에 감사해라. 알기는 엄청나게 잘하는데 그대로 사는 거를 연습을 해 보면 힘들잖아요. 제가 살아보니까 별로 안 힘들어. 살아보니까. 그러니까 여러분들도 좀 사세요 그렇게."], ["17:45", "제가 여러분들 저번 주중에 그런 얘기 했지요. 60이면 이순이라서 귀가 순해져야 된다고. 누가 무슨 말을 해도 뭐 하라고요? '그래 네 말이 맞아.' 누가 무슨 말을 해도 '그래 네 말이 맞아, 네 말이 맞아.' 그런데요, 아버지하고 아들하고 친하는 방법, 엄마하고 딸하고 친하는 방법도 그거야. 뭔 줄 아십니까? 엄마하고 딸하고 아들하고 아빠하고 친하는 방법은요. '엄마 엄마 이거 어떻게 생각해? 나는 이렇게 생각하는데 엄마 생각은 어때?' '그래 네 말이 맞아.' '아빠 아빠 난 이렇게 생각하는데 아빠 생각은 어때?' '그래 네 말이 맞아.' 그러면 아들딸하고 친해. 그런데 뭐가 문제예요? 내가 살아왔던 경륜이 문제야, 경륜이. 그것이 아버지와 아들 사이를 멀게 만들고 딸하고 엄마 사이를 멀게 만들어. '내가 해 봤는데 안 되더라. 하지 마. 그거 될 일도 아니야. 하지 마.' 안 해 본 놈은 엄청 궁금해."], ["18:49", "여러분들 아시겠습니까? 사람은요, 해 본 사람은 후회가 많지만 안 해 본 사람은 엄청 궁금한 거예요. 후회 많은 사람은 안 궁금해서 했을까요? 자기도 궁금해서 한 거예요. 사람은 누구나 그래. 제가 얘기했잖아요. 이렇게 보면요, 물건 하나가 있어. 옆에 사람이 딱 드는데 '아우 무거워서 못 들겠다.' 그럼 옆에 사람이 뭐라 그래? '뭘 무겁다 그래' 갖고 지가 들다 '아이고 무거워라.' 세 번째 사람은 들어야 돼, 안 들어야 돼? 그런데 우리 한국 사람은 다 들어보고 무겁다 그래. 왜 그럴까? 옆 사람 말을 징그럽게 안 들어. 다 들어보고 무겁다 그래. 탁 봤을 때 별로 무겁게 생기지 않았는데 걔가 무겁다고 하면 나도 무겁다고 생각을 해야 돼, 안 해야 돼요? 해야 되잖아. 그런데 모든 사람이 다 그래. 다 들어보고 무겁다고 하고 다 해보고 힘들다 그래. 뭘 그래요? 그냥 보면 옆 사람이 힘들다 그러면 '어 힘들구나' 하고 나가는 거지. 안 들어 봐. 네가 힘들다는데 내가 굳이 들 필요가 뭐가 있냐? 가자. 얼마나 인생 쉽게 살아. 그렇죠? 얼마나 쉽게 살아?"], ["19:56", "오늘도 밑에 내려가서 식사하실 때 앞에 사람이 밥을 딱 먹는데 '밥이 왜 이래?' 이러면 '아 밥이 맛이 없나 보다' 그러지 말고, 딱 먹으면 '괜찮은데 뭘 그래?' 그럼 옆에 사람이 '그래 괜찮구만 뭘 그래? 그런가?' 이렇게 하고 넘어가는 거야. 근데 꼭 뭐라고 하죠? 옆에 사람이 밥 먹으면 '아 밥이 왜 이래?' 그럼 옆에 사람 뭐 할까? 자기도 먹어보고 '그래 네 말이 맞아.' 또 옆에 사람은 자기도 또 먹어보고 '그래 네 말이 맞아.' 그렇게 하고 다 부정적이야. 근데 그중에서 한 사람이 '맛있구만. 왜 그래? 누구 편이요?' 이런단 말이야. 이해가 되시죠? 밥으로 평가하는 게 아니라 사람으로 평가하는 거예요. 그러니까 한 사람이 맛없다 그러면 다 맛없다고 해야 돼요. 그래야 친구가 의리가 된대요. 왜 제가 그 말을 하겠어요? 아까 목사님한테 전화가 온 거야. '목사님 밥을 했는데요, 갑자기 중간에 불이 나가 가지고 밥이 밑에는 잘됐는데 위에는 좀 설어서 어떻게 해야 되죠?' 그러더라고. 그래서 '꼭 가서 다시 취사를 해.' 그랬더니 퍼서 취사를 했더니 아까 위에 거만 걷어낼 걸, 왜 취사를 했더니 여기저기 먹을 때마다 자꾸 뭐 뭐 하죠? 그렇지, 들리는 게 씹히는 거고 익은 거 넘기는 거야. 그래서 제가 뭐라 했을까? '그럼 물을 한번 좀 더 놓고 다시 취사를 해 봐.' 그다음에는 못 들었어요."], ["21:16", "그러니까 여러분들이 내려가셔서 '아 그만한 사정이 있어서 저렇게 얘기를 했구나'라고 생각하고, 아 오늘은 맛없어도 맛있다고 해야겠구나, 오늘은 밥이 씹혀도 맛있다고 해야겠구나. 이렇게 하고 가시면 감사절이요. 주께서 시험하시는 거예요. 오늘 분명히 은혜받고 내려가서 '맛이 왜 이래' 할까 봐. 알아들으시겠죠? 오늘은 모든 게 다 감사한 거야. 감사절 하루는 뭘 해도 감사해. 우리 딸내미가 세상에 귀한 찻잔을 이렇게 지가 엄마 흉내 내다가 뚝 떨어뜨려서 깨버렸네. 부부 찻잔이네. 어제 같으면 반은 죽었어. 오늘은 감사절이니까 땡스기빙데이, 할렐루야. '괜찮아.' 이렇게 하고 넘어가 줘야 돼. 그럼 얘는 1년에 감사절 한 번은 기다려. 왜? '아, 오늘 한 번은 잘못해도 용서가 되는 날이구나.' 그게 감사절이요. 얼마나 좋아요. 아시겠습니까?"], ["22:17", "오늘만큼은 성질내지 말고, 오늘만큼은 기분 나빠하지 말고, 오늘만큼은 누가 얘기해도 웃으면서 넘기고, 그리고 꼭 싸놨다가 '내일 보자' 하고 오늘 넘기세요. 알겠죠? 그러면 주께서 내일 까먹게 하셔. 그러니까 여러분들 꼭 그렇게 하셔서 오늘만큼은 뭐 하게? 기분 좋게. 옆 사람하고 인사할 때 '나 오늘만큼은 활짝 웃고 싶어' 빨리 인사해 얼렁. 그렇죠. 인상 쓰며 하지 말고 웃으면서 해. 이왕이면 아이 저 영혼 없는 얼굴을 들이밀지 말고 좀. 다시 한번 인사해 봐. '나 오늘만큼은 기분 좋고 싶어' 빨리 인사하세요 얼렁. '오늘만큼은 기분 좋고 싶어.' 예. 아시겠죠? 오늘만큼은 기분 좋은 하루가 되시기를 주의 이름으로 축복합니다. 아멘."], ["23:05", "예. 여러분 이제 추수감사 예배 끝났으니까 이제부터 금식해야 돼. 빨리 여기 쳐다봐요. 여러분, 이 금식의 말이 있잖아요. 근데 오늘 가만히 보니까 금식할 때 똑같은 얘기를 기도할 때 하던 것처럼 금식도 반복하더라고. 그러니까는 금식도 뭐에 속하는 거예요? 기도에 속하는 거예요. 금식 기도가 있는 거지. 나는 금식만 해, 그러면 금식 기도가 아니고 그냥 굶식이 되는 거예요. 알아들으시겠죠? 굶식이 되는 거. 그러니까 뭐가 되게 해야 돼요? 금식 기도가 되게 해야 돼. 그럼 금식을 왜 할까요? 그게 중요하잖아요. 금식을 왜 할까요, 여러분? 아, 이 좀 성질이 주체가 안 되는 사람들 있죠? 그런 사람들은요 하루에 좀 한 끼만 먹고 살면 돼요. 그러면 이게 힘이 없어 갖고 뭐죠? 성질낼 힘이 없어서 성질을 못 내."], ["23:58", "그랬더니 어떤 분 그러더라고. '목사님, 근데요. 아니 뭐 밥 안 먹어도 성질 내던데요?' 그거는요 한 번만 금식해서 그래. 매일같이 두 끼씩 금식하고 한 끼만 먹으면 뭐가 된다고요? 성질낼 힘이 없어요, 성질낼 힘이. 그러니까는 '아 목사님 저는 성질이 잘 안 죽습니다' 그러면 어떡하라고요? 하루에 한 끼만 먹어야 돼. 왜? 힘이 너무 세서 그래. 힘이 너무 세서. 성질도 힘이 세서 부리는 거예요. '아 나 힘도 없는데 네가 나를 성질나게 하는구나' 그 힘이 있어서 그래. 그러니까 여러분들 성질내는 사람 뭐 한다고요? 힘이 있는 거예요, 힘이 있는 거. 그러니까 그 힘이 있을 때는 뭐 하라고요? 밥 굶고 살으라고요. 그러니까 오늘 하나님이 우리에게 자꾸 성질내 갖고 자꾸 감정하고 기분 나쁘고 자꾸 죄를 짓고 하는 사람을 위해서 교훈하는 게 뭘까요? '너 좀 죽고 살아라' 그렇게 하고 금식하는 거야. '너 좀 죽고 살아라' 하고."], ["24:59", "근데 누가 그러더라고. '목사님, 금식하면은 기도가 응답이 잘 된다며요.' 근데 그러기도 하고 안 그렇기도 해요. 왜? 왜 그럴까? 가만히 생각해 보니까 배고프면 포기가 빨라지더라고, 배고프면. 그러니까 금식하면요 포기가 빨라지더라고. 응답이 빨라지는 게 아니라 우리 기도 제목을 잘 봐요. 그러면은 많은 부분이 없어도 되는 거 기도할 때가 많아요. 필요 없는 거. 그런데 이게 금식하며 기도하면 배고파 가지고 기도가 되는 게 아니라 '냉장고 큰 걸 사고 싶은데 하나님 냉장고 큰 거 사 주세요' 이렇게 했더니 안 사 주길래 '목사님 어떡하면 냉장고 큰 거 하나님이 주실까요?' '금식하고 기도하면 주시지 않을까요?' 해 갖고 가서 금식했더니 안 주시더래. 그래 가지고 와 가지고 '목사님 금식하고 기도했는데도 안 주시더라고' 그래. 그랬더니 '그러면 뭐 냉장고 큰 거 사고 싶으세요?' '냉장고 큰 게 중요한 게 아니에요. 지금 배고파 죽겠어요.' 포기하잖아 냉장고를. 그래 가지고 포기하고 냉장고 안 사고 작은 걸로 바꾼대. 왜 그럴까? 하나님이 내 기도 응답을 들어 주시기 위해서 금식을 하게 하시는 게 아니고 나를 포기시키려고 금식하게 하시는 거예요. 여러분 아시겠죠? 그러니까 포기할 게 많은 사람은 금식을 자주 하시고요, 저처럼 포기할 게 별로 없는 사람은 금식을 안 해도 돼."], ["26:28", "사람들이 그러더라고. '목사님은 금식 해 봤어요?' 저는요 교회를 잘못 만나 갖고 전도사 때 금식을 딱 한 번 했어요. 하루를 죽을 뻔했어요. 릴레이 기도를 하자는 거야, 릴레이 기도를. 난 릴레이 기도가 뭔지도 모르는데 릴레이 금식 기도를 하자는 거야. '그 릴레이 금식 기도가 뭐예요?' 그랬더니 제가 대전중앙침례교회 있을 때 우리 유병문 목사님이 선포를 했단 말이에요. 릴레이 금식 기도회를. 그래서 누구나 다 하루에 한 번은 다 금식해야 된다고. 한 끼도 아니요, 세 끼를 금식해야 돼. 저는 태어나 갖고 아플 때 빼놓고 세 끼를 금식해 본 적이 한 번도 없어요. 배탈 나도 밥은 먹었으니까. 해 본 적이 한 번도 없는데 세 끼 금식하려니까 죽겠더라고. 아침부터 사탄이가 침투해 가지고 '형님' 그래. '왜?' 그랬더니 '제가 오늘 소고기 사 줄게 점심 먹어요.' 무슨 마음이 들까요? 교회를 잘못 선택했어."], ["27:25", "그런 마음이 막 드는 거야. 오늘 소고기 먹고 내일부터 금식할까 그런 생각도 들고, 먹고 나서 금식했다고 할까 별 생각이 다 드는 거야. 그래도 하나님만 아시는데 먹고 나서 '저 오늘 금식했습니다' 이래도 뭘 크게 상관이 있겠어 그러는데 안 되겠더라고, 체면이 전도사인데. 하루 금식하는데 유혹이 얼마나 많은지. 12시가 기다려지는 거야 12시가. 11시 50분부터 밥상에 앉아 가지고 쳐다보고 있는 거야. 12시 될 때까지 계속. 그리고 12시 딱 되자마자 숟가락으로 그냥 밥을 갖다가 뭡니까, 오늘 하루 세 끼를 갖다가 세 그릇을 다 먹었잖아요. 그리고서 무슨 생각을 했을까? '하나님, 저는요 체질이 금식이 안 되는 것 같아요. 저는 금식이 체질이 아니에요.' 그리고 저는 지금까지 아무리 어려워도 하나님이 금식을 한 번도 안 시켰어요. 제가 목회를 24년 했거든요. 24년 동안 금식 한 번도 안 했어요. 자랑이라고 하지 말고 안 했다고요."], ["28:28", "그래 가지고 '아니 금식 안 해도 그래도 저렇게 싱싱한 목사가 있구나.' 있어요. 멀리 볼 때는 제가 좀 나이가 먹어 보여도 머리카락이 별로 없어서 가까이 보니까 우리 권사님들이 '어이고 우리 젊은 목사님이네' 이러더라고. 제가 원래 가까이 보면 젊고 멀리 보면 좀 나이가 먹어 보여요. 어 그러는데 금식 어떤 일에서도 저는 안 했어요. 그러니까 여러분들 생각해 볼 때 '아 금식 꼭 해야 된다' 하기 싫으면 하지 마요. 아유 왜 자꾸 하려 그래? 하지 말고 그냥 포기해, 포기. 오늘 얘기 봐요. 하면서 두 가지 문제가 생기잖아. 하나가 뭐가 생길까요? 얼굴 슬픈 기색을 띠지 말래요. 금식하면 슬퍼요, 안 슬퍼요? 빨리 얘기해 봐. 봐, 여기 젊은이들 슬프다잖아. 왜? 밥 안 먹으니까. 저는요 누가 그러더라고. '목사님 어느 때가 가장 행복해요?'"], ["29:23", "그랬더니 목사님들이 대부분이 '저는 설교할 때가 가장 행복하고요, 저는 말씀을 준비할 때가 가장 행복하고, 저는 기도할 때가 가장 행복하고요, 저는 심방할 때가 가장 행복하고, 저는 새 가족 올 때가 가장 행복하고' 좋은 얘기 다 하는데 제 차례가 왔잖아. '임 목사는 어느 때가 제일 행복해요?' 그러고 물어보더라고. '저는 밥 먹을 때가 제일 행복해요.' 그랬더니 째려보더라고. '저게 목사야 뭐야?' 아니 거짓말하면 안 되잖아. 목사는 무슨 일이 있어도 정직해야 돼, 거짓말해야 돼? 정직해야 돼. 목사는 비판을 받아도 정직해야 되고, 욕을 먹어도 정직해야 되고, 누가 그냥 삿대질을 해도 정직해야 되고, 누가 막 돌멩이를 던져도 정직해야 돼. 스데반 봐, 돌멩이 던진다고 맞아 죽어서 엄청 아프다고 마음 바꾼 거 아니잖아. 그냥 정직하게 '나는 주님이 좋습니다' 하고 돌 맞아 죽었잖아. 저도 똑같아요. 그러니까는 신령하지 않아도 괜찮고 기도 엄청 열심히 못 하는 목사래도 상관없고 저는요 밥 먹을 때가 제일 행복해요. 우리 청년들 그러죠?"], ["30:29", "예. 저는 우리 청년들하고 밥 먹을 때가 얼마나 행복한지 몰라요. 너무 기뻐요. 같이 밥 먹고 같이 '너 이것 좀 먹어 봐라, 저것 좀 먹어 봐라' 얼마나 좋아요. 그래 저는 그때가 제일 행복해요. 그래서 나중에 나이가 더 먹을 때 그런 얘기가 생긴대요. 밥을 캡슐로 준대요. 그래서 쌀도 캡슐 하나, 소고기도 캡슐 하나. 그때까지 안 살기를 기도해요. 왜? 씹어야 맛이고 그죠, 뜯어야 맛이지. 세상에 캡슐로 밥 먹으면 얼마나 그래. 그죠? 그래서 저는 치킨도요 뭡니까, 그 뼈다귀 있는 치킨이 좋지 순살 치킨은 별로 안 좋아요. 왜? 뼈다귀는 씹어야 되잖아. 이렇게 뜯어야 되잖아. 그래서 저는 좋아해요. 여러분 아무 때나 응답이 안 된다고 금식하지 말고 '네 걸 포기하지 않아서 응답이 안 되는 거야' 이렇게 하고 생각을 꼭 하세요. 신앙의 가장 기본적인 거, 원초적인 거는 저는 지금까지 신앙생활하면서 깨달은 게 뭔지 아십니까? 네가 바뀌는 거야. 네가 달라지는 거야. 네가 훌륭해지는 거야. 네가 멋있는 거야. 아멘."], ["31:38", "그거를 제가 오래전부터 깨달았잖아요. 그래서 저는 꼭 생각해요. 어떤 생각을 하냐면 자식한테 훈계를 할 때도 내가 그걸 제대로 되어 있는가 보고 훈계를 해요. 간디 앞에 어떤 엄마가 와 가지고 '선생님 선생님, 존경하는 선생님 우리 아들이 사탕을 너무 좋아합니다. 선생님 아들한테 사탕 먹지 말라고 얘기 좀 해 주세요.' 그랬더니 간디가 가만히 있다가 눈을 딱 감더니 한 5분 동안 가만히 있더래. 그래 눈을 번뜩 뜨더니 하는 말이 '집에 가, 다음 주에 와' 그러더래요. 그래서 그냥 집으로 가 버렸대요. 그러니까 그 엄마는 '아 왜 그러지? 그 먹지 말라고 한 마디만 해 주는데 뭘 그렇게 어려웠을까?' 그랬더니 그다음 주에 왔더라는 거야. 와서 하는 말이 '선생님 우리 아들에게 사탕 먹지 말라고 해 주세요' 했더니 '야, 너 사탕 먹지 마' 그러더래. 그래 가지고 아이를 밖으로 보내고 난 다음에 '선생님 궁금해서 그러는데 왜 저번 주에 말 안 하고 이번 주에 그렇게 말씀을 해 주셨습니까?'라고 얘기했더니 이 간디 선생님이 그랬대. '사실은 나도 사탕을 좋아해' 그러더래. 그런데 먹지 말라고 하려 보니까 내가 좋아하는 거를 나는 먹으면서 얘는 먹지 말라고 하는 게 얼마나 그래. 그래 가지고 일주일 동안 사탕을 끊었대요. 내가 사탕 딱 끊고 나서 속으로 '나 사탕 끊었으니까 너도 먹지 마' 그랬대요."], ["33:06", "여러분 목사가 그런 사람이에요. 그런 사람 돼야 돼요. 왜? 자기도 못 하는 거 남더러 하라고 하면 그거 보통 답답한 게 아니야. 그러니까 저는 우리 교인들한테 여태까지 금식하라는 소리 들어봤어요? 못 들어봤어? 못 들어봤어요. 못 들어봤다잖아. 철야하라는 소리 들어봤어? 못 들어봤어. 못 들어봤다잖아. 저는 제일 싫은 게 두 가지요. 철야하고 금식하는 거. 그거 제일 싫어해. 그래서 저는 철야도 안 하고 금식도 안 해요. 왜냐면은요, '그거 말고 다른 거 다 할게요' 그래. '그거 말고 다른 거 다 할게요' 그거 말고. 그래 가지고 저는요 제가 못 하는 거 안 시켜요 우리 성도들한테. 왜 그럴까요? 내가 안 되는 거 우리 성도들은 안 힘들까? 내가 안 되는 거 우리 성도들은 얼마나 힘들까? 저는 그 생각하면서 제가 안 되는 건 우리 교인들한테 안 시켜요. 그러니까 우리 교회를 다니는 순간 제가 은퇴할 때까지는 두 가지는 안 해도 돼. 첫 번째 금식하는 거, 두 번째 철야하는 건 안 해도 돼. 왜? 제가 안 하는 건 제가 안 시킨다고 했잖아요."], ["34:09", "그렇죠? 나머지 거에서 승부를 거세요, 나머지 거에서. 성경은요 이 두 가지 말고도 너무 많아요. 해야 될 게 얼마나 많은데. 한국 교회 성도들은 성경을 별로 몰라요. 그래 가지고 꼭 아는 게 그거밖에 몰라. 뭐지요? 성경 열심히 보는 거, 기도 열심히 하는 거, 예배 열심히 드리는 거, 전도하는 거 그런 거밖에 몰라. 여기 안에는요 그거 말고 이런 것도 있어요. 오른뺨을 때리거든 왼뺨도 돌려대고, 속옷을 달라고 하면 겉옷까지 주고, 오리를 가자고 하면 십리까지 가게 되고, 옆 사람이 내 원수라도 그 사람을 위해서 기도하고 사랑할 수 있는 마음도 주고. 성경은요 그런 얘기도 또 다른 얘기도 너무 많아요. 그런데 교인들은 성도들은요 그런 건 어디로 갔나 다 잊어 먹어요. 그렇게 하고 뭐만 얘기할까요? '성경에 봐. 기도하라잖아, 금식하라잖아.' 그거 말고도 우리가 해야 될 게 너무 많다는 걸 기억하세요. 앞으로 제가 여러분들에게 성경에서 너무 많이 가르쳐 주는 거를 열심히 가르쳐 드릴게요. 하나씩 하나씩 배울 때마다 일주일 동안 여러분들은 뭐 하라고요? 그대로 좀 살려고 노력하시라고요. 그게 변화와 발전인 거예요. 그대로 사셔야 됩니다. 아멘."], ["35:33", "아멘. 그대로 살아야 돼. 여러분, 성경은요 열심히 읽고 내 자신을 수양하고 또 내 마음을 다스리고 좋아요. 그런데 문제는 뭐냐면요, 오늘 말씀대로 살아가는 거 이게 성경이 우리에게 요구하는 내용이에요. 오늘 말씀대로 살려고 노력하는 거, 오늘 말씀대로 살려고 그 의지를 보이는 거 얼마나 좋아요, 여러분? 하면서 슬픈 기색을 띠지 말래요. 왜 슬픈 기색을 띠지 말까요? 여기 보니까 뭡니까, 얼굴을 흉하게 하지 말래요. 왜 그럴까요? 금식하면 배고프니까 찡그려지고 금식하면 얼굴에 슬픈 기색이 띠지잖아요. 그러니까 사람들이 물어보지요. '야, 근데 너 얼굴 안 좋다. 얼굴 안색이 안 좋다, 뭐가 안 좋다' 그러잖아요. 그러면 그때 뭐라 그래요? '아, 내가 지금 중요한 게 있어서 금식해서 그래.' 그런 말 하지 말라고요."], ["36:31", "그런 말 하지 말라고. 뭐 하라고요? 그냥 금식할 때는 얼굴에다 화장도 예쁘게 하고, 머리 단장도 좀 예쁘게 하고, 그리고 옷도 좀 예쁘게 입고 다니고 멋있게 하고 다녀서 '오늘 무슨 일이 있어?' 그러면은 '왜 멋있어 보여서 그래?' 그럼 속으로 '야 금식하니까 하나님이 상 주시는구나. 나를 멋있게 보는 사람이 다 있네.' 이러면서 뭡니까, 오늘 멋있게 보이라고요. 멋있게 교회 와서 집에 가서 찡그리지 마시고, 교회 올 때 인상 쓰지 마시고, 볼 때마다 웃으면서 '할렐루야 아멘' 하고 얼마나 좋아 그죠. 은혜 받아 놓고 집에 가서 '된장찌개가 이게 뭐야' 하고 소리 지르지 마셔요. 은혜 까먹은 거야. 모든 걸 감사하게 즐겁게 기쁘게 그렇게 만들어 내시는 여러분 되기를 주의 이름으로 축원합니다. 아멘."], ["37:27", "예. 꼭 하셔야 돼, 꼭 하셔야 돼. 저는요 제 설교 들을 때 우리 아내가 제일 앞에 있는 게 너무 감사해요. 왜 그런지 아세요? 어느 교회를 가도 사모가 앞에 있는 사모를 우리 아내 외에는 내가 본 적이 없어. 제일 뒤에 가서 앉아 있어. 왜 그럴까? 남편 목소리 듣기 싫다 이거야. 남편 설교하는 거 듣기 싫다 이거야. '네가 설교한 대로 너나 그렇게 살아. 너나 그렇게 해.' 왜 그럴까? 그래서 교회는요 사모가 제일 은혜를 못 받아요. 왜? 자기가 말한 거 안 지키니까. 그래도 우리 아내한테 너무 감사한 게 저 사람은요 맨날 앞에 있어요 제가 설교하면. 그래 안 그래요? 지금까지 우리 아내가 뒤에서 설교 들은 건요, 무슨 일이 생겨서 늦게 와 갖고 앞으로까지 오기 불편한 거밖에는 없어요. 그거 몇 번 되지도 않지만 1년 중에. 그리고 항상 앞에 앉아요. 그리고 '목사님 설교 들어야 돼, 남편 설교 들어야 돼' 그래요. 그러니 제가 얼마나 조심하겠어요. 뭐 하려고? 오늘 내가 전한 거 그대로 살려고. 오늘 내가 전한 거 그대로 하려고. 그게 힘인 거예요."], ["38:39", "가정의 가장은요 말한 걸 지킬 때 힘이 있는 겁니다. 내가 말한 걸 지킬 때, 내가 자식들하고 약속한 걸 지킬 때, 내가 아내하고 약속한 걸 지킬 때 그때 힘이 있는 거예요. 목사의 힘은 어디 있는지 아십니까? 성도들한테 설교한 거 지킬 때. 성도들의 힘은 어디 있는 줄 아십니까? 오늘 들은 설교 옆 사람한테 나누면서 '나도 오늘 그렇게 살려고 해'라고 간증할 때 그때가 힘이 있는 거예요. 오늘부터 그런 인생 사시길 바랍니다. 아멘. 예. 그래서 늘 뭡니까, 마음속에서 슬퍼하지 말고 즐거워하고 기뻐하는 성도 꼭 되십시오. 아멘. 그럴 때 여러분 우리 세종월드교회는 왕성해지는 거예요. 제가 약속했잖아요. 조만간에 뭡니까, 여기 빈자리 꽉 채운다고. 제가 약속했잖아요. 빈자리 꽉 채운다고. 왜? 누가 오든 안 오든 하나님이 보내 주실 건데 뭘 걱정을 해요? 저는요 제가 뭔가를 해야 된다고 생각하는 거보다 저는 열심히 전하기만 하면 돼요 제대로. 그러면 나머지는 우리 하나님께서 '걱정하지 마, 자리는 내가 다 채워 줄게.'"], ["39:49", "지나가다가 '오늘은 저쪽 교회 가 봐야지' 하고 마음을 먹었는데 갑자기 세종월드교회가 탁 보이는 거야. '야, 이름 멋있다. 오늘은 저기 가자' 하고 쏙 들어올 수 있잖아. 그죠? 들어와서 설교 한번 듣더니 '야, 그래도 뭐 나쁜 건 아닌데 뭐 다음 주 한번 더 와 보지' 하고 또 왔다가 또 그다음 주에도 한번 더 와 보지. 처음 오면 초면입니다. 두 번째 오면 구면입니다. 세 번째 오면 단골입니다. 네 번째 오면 식구, 패밀리입니다. 얼마나 좋아요? 그래서 저는 그렇게 기도해요. '하나님 우리 교회 성도 네 번만 오면 패밀리가 됩니다. 한 번 오고 가는 사람 없게 하시고 네 번까지 와서 우리 식구 되면 얼마나 좋을까요?' 그렇죠? 그래 저는 네 번 오기만 기다리는 거예요. 우리 권사님들, 장로님들 꼭 기도할 때 새벽에 와서 기도할 때 새로 오는 사람들 네 번만 오게 해 주세요. 네 번만 오게 해 주세요. 식구는 어디 안 떠나잖아. 그죠? 제일 염려되는 사람이 초면이요 초면. 왜? 처음 왔는데 '아휴 뭐냐' 이런단 말이요."], ["40:59", "알아들으시겠죠? 그래서 다음 주부터는요 찬양을 해도 저 뒷문을 활짝 열어 놓으시고 여기서 설교를 딱 할 때 그때 문을 닫으세요. 왜냐면 제가 오늘 어떡하다 뭐 하다 보니까 꼼지락거려서 찬양을 한 다음에 들어왔는데 딱 들어오니까 당겨 주는 사람이 있는 것처럼 문이 열려야 되는데 딱 닫히니까 어디 그냥 집에 가라고 좀 찝찝하더라고 마음이. 저랑 똑같은 마음 가지신 사람만 빨리 손 들어 봐. 있잖아 이거 봐. 아시겠죠? 우리 다음부터 안내하는 분은요 '환영합니다' 하고 문을 활짝 여세요. 그래 가지고 찬양을 하든 뭘 하든 문을 활짝 열어 가지고 오는 사람들이 '야 개선장군처럼 개선문이 다 열려 있다' 그러면서 싹 지나가는 게 얼마나 좋아. 그러니까 여러분들 꼭 그렇게 하시고 문 활짝 열어 놓으셔서 찬양이 들리면은 밑에서부터 빨리빨리 올라올 거 아니야. 왜? 찬양하니까 '내가 좀 늦었구나' 하고 막 달려올 거 아니야. 그렇죠? 그러니까 문을 활짝 열어 놓 const START=(()=>{const m=location.hash.match(/t=(\d+)/);return m?+m[1]:S[0];})();
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d;}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let lastSave=0;
function saveProg(t,force){if(!force&&Date.now()-lastSave<5000)return;lastSave=Date.now();const P=lsGet('sermon-progress',{});const o=P[VID]||{};const dur=(player&&player.getDuration&&player.getDuration())||END;P[VID]={t:Math.floor(t),at:Date.now(),done:o.done||t/dur>=0.9};lsSet('sermon-progress',P);}
const bm=document.getElementById('bm');
const drawBm=()=>{const on=lsGet('sermon-saved',[]).includes(VID);bm.classList.toggle('on',on);bm.textContent=on?'★ 저장됨':'☆ 저장';};
bm.onclick=()=>{let s=lsGet('sermon-saved',[]);s=s.includes(VID)?s.filter(v=>v!==VID):[VID,...s];lsSet('sermon-saved',s);drawBm();};
drawBm();
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('yt',{host:'https://www.youtube-nocookie.com',videoId:VID,playerVars:{playsinline:1,rel:0,start:START},events:{onReady:()=>{ready=true;if(pending!=null){seek(pending);pending=null;}}}});};
function seek(t){if(!ready){pending=t;return;}player.seekTo(Math.max(0,t-0.5),true);player.playVideo();}

/* ---- 재생 위치에 맞춰 스크립트 따라가기 ---- */
let follow=true, lastI=-1, lastW=null, userScrollAt=0;
/* ---- 설정: 글자 크기 ---- */
(()=>{const sizes=[[0.88,'가',13],[1,'가',15],[1.15,'가',17],[1.3,'가',19],[1.5,'가',21]];
  let cur=1; try{const v=parseFloat(localStorage.getItem('sermon-font'));if(v)cur=v;}catch(e){}
  const box=document.getElementById('fsz');
  const apply=v=>{cur=v;document.documentElement.style.setProperty('--fz',v);try{localStorage.setItem('sermon-font',v);}catch(e){}box.innerHTML=sizes.map(([z,t,px])=>`<button data-z="${z}" class="${z===cur?'on':''}" style="font-size:${px}px" aria-label="글자 크기 ${Math.round(z*100)}%">${t}</button>`).join('');};
  box.onclick=e=>{const b=e.target.closest('button');if(b)apply(+b.dataset.z);};
  document.getElementById('gear').onclick=()=>document.getElementById('setp').classList.toggle('on');
  apply(cur);})();
const fbtn=document.getElementById('follow');
fbtn.onclick=()=>{follow=!follow;fbtn.classList.toggle('on',follow);fbtn.textContent=follow?'따라가기 ON':'따라가기 OFF';if(follow)lastI=-1;};
scroller.addEventListener('touchmove',()=>userScrollAt=Date.now(),{passive:true});
scroller.addEventListener('wheel',()=>userScrollAt=Date.now(),{passive:true});
function locate(t){let i=0;for(let k=0;k<S.length;k++)if(S[k]<=t)i=k;let j=0;WT[i].forEach((wt,k)=>{if(wt<=t)j=k;});return [i,j];}
setInterval(()=>{
  if(!ready||!player.getPlayerState)return; const st=player.getPlayerState(); if(st!==1&&st!==3)return;
  const t=player.getCurrentTime(); saveProg(t); if(t<S[0]-1)return;
  const [i,j]=locate(t);
  if(i!==lastI){segs.forEach(s=>s.classList.remove('now'));segs[i].classList.add('now');lastI=i;
    if(follow&&Date.now()-userScrollAt>4000&&document.getElementById('txt').classList.contains('on')){const r=segs[i].offsetTop-8;scroller.scrollTo({top:r,behavior:'smooth'});}}
  const w=segs[i].querySelector(`.w[data-j="${j}"]`); if(w!==lastW){if(lastW)lastW.classList.remove('say');if(w)w.classList.add('say');lastW=w;}
},250);

window.addEventListener('pagehide',()=>{try{if(ready)saveProg(player.getCurrentTime(),true);}catch(e){}});
document.addEventListener('visibilitychange',()=>{try{if(document.hidden&&ready)saveProg(player.getCurrentTime(),true);}catch(e){}});


/* ---- 듣기 모드: 영상은 작게, 자막은 크게 ---- */
const fmtT=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`;};
const ppBtn=document.getElementById('pp'), tmEl=document.getElementById('tm'), tdEl=document.getElementById('td'), skEl=document.getElementById('sk');
let dragging=false;
function setMini(on){document.body.classList.toggle('mini',on);lsSet('sermon-mini',on);document.getElementById('lm').textContent=on?'🎬 영상 크게':'🎧 듣기 모드';}
document.getElementById('lm').onclick=()=>setMini(!document.body.classList.contains('mini'));
document.getElementById('ex').onclick=()=>setMini(false);
ppBtn.onclick=()=>{if(!ready){pending=START;return;}const st=player.getPlayerState();if(st===1||st===3)player.pauseVideo();else player.playVideo();};
const jump=d=>{if(!ready)return;player.seekTo(Math.max(0,player.getCurrentTime()+d),true);};
let SKIP=10; try{const v=parseInt(localStorage.getItem('sermon-skip'));if(v)SKIP=v;}catch(e){}
const bkB=document.getElementById('bk'), fwB=document.getElementById('fw'), skp=document.getElementById('skp');
function setSkip(v){SKIP=v;try{localStorage.setItem('sermon-skip',v);}catch(e){}bkB.textContent='-'+v;fwB.textContent='+'+v;bkB.setAttribute('aria-label',v+'초 뒤로');fwB.setAttribute('aria-label',v+'초 앞으로');
  skp.innerHTML=[5,10,15,30].map(s=>`<button data-s="${s}" class="${s===SKIP?'on':''}" style="font-size:13px;min-width:46px">${s}초</button>`).join('');}
skp.onclick=e=>{const b=e.target.closest('button');if(b)setSkip(+b.dataset.s);};
bkB.onclick=()=>jump(-SKIP); fwB.onclick=()=>jump(SKIP);
setSkip(SKIP);
skEl.addEventListener('input',()=>{dragging=true;document.getElementById('line').style.setProperty('--p',(skEl.value/10)+'%');const dur=(ready&&player.getDuration())||END;tmEl.textContent=fmtT(skEl.value/1000*dur);});
skEl.addEventListener('change',()=>{dragging=false;if(!ready)return;const dur=player.getDuration()||END;userScrollAt=0;player.seekTo(skEl.value/1000*dur,true);});
setInterval(()=>{if(!ready||!player.getPlayerState)return;const st=player.getPlayerState();ppBtn.textContent=(st===1||st===3)?'❚❚':'▶';const dur=player.getDuration()||END, t=player.getCurrentTime();tdEl.textContent=fmtT(dur);if(!dragging){tmEl.textContent=fmtT(t);skEl.value=Math.round(t/dur*1000);document.getElementById('line').style.setProperty('--p',(skEl.value/10)+'%');}},500);
tdEl.textContent=fmtT(END);
if(lsGet('sermon-mini',false)) setMini(true);
document.getElementById('mtitle').textContent=document.querySelector('.head h1').textContent;

/* ---- 단어·시간 누르면 그 위치부터 재생 ---- */
list.addEventListener('click',e=>{
  const w=e.target.closest('.w'); if(w){userScrollAt=0;seek(WT[+w.dataset.i][+w.dataset.j]);return;}
  const b=e.target.closest('.who button'); if(b){userScrollAt=0;seek(+b.dataset.s);}
});

/* ---- 탭 / 구간 바로가기 ---- */
const tabs=document.querySelectorAll('.tabs button');
function show(t){tabs.forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t));scroller.scrollTop=0;}
tabs.forEach(b=>b.onclick=()=>show(b.dataset.t));
document.querySelectorAll('.chap a').forEach(a=>a.onclick=e=>{e.preventDefault();show('txt');lastI=-1;userScrollAt=0;seek(+a.dataset.s);});
</script>
</body>
</html>
