는게 물질 아닙니까? 돈이 가장 포기가 안 돼요. 십일조 내기가 참 힘들죠. 그리고 하나님 앞에 먼저 드린다는 거 쉽지 않죠. 왜냐면요. 내가 신앙이 약해서 그래. 그러지만 사실은 뭡니까? 드리기가 마음속에 부담되는 겁니다. 이 돈의 문제가 걸렸다는 거죠. 돈이 이 집은요. 돈이 우상입니다. 왜냐면 어머니 한번 보세요. 아들이 그 돈을 가지고 도망 훔쳐가 훔쳐서 숨겨 놨다는 소리를 들을 때 아들이 들으라고 저주를 그렇게 퍼붓더니 아들이 돈을 갖고 오니까 가장 축복받을 아들이라고 마음이 바뀌잖아요. 언어가 바뀌고요."], ["9:37", "왜? 돈 때문에 사랑 관계가 달라지는 거예요. 돈이 우상인 거죠. 이 가정은 그죠? 돈의 노예가 돼 있는 가정이죠. 미가의 엄마의 관심사가 오로지 돈입니다. 오로지 미가 엄마의 관심사. 아유, 돈은요 많으면 많을수록 여유가 있는게 아니라 많으면 많을수록 욕심이 생기거든요. 가져본 사람 할 거예요. 남들에게 잘 베푼 사람들은요. 돈이 얼마 없는 사람이에요. 근데 진짜로 남들한테 인색한 사람들은 돈이 엄청 많은 사람이죠. 왜? 그 많은 것 중에 하나 주기도 불편한 거죠. 왜냐면 돈이 우상이 돼서 그래요. 그 돈이 그 어머니의 인생의 기준이에요. 인생의 기준. 그 가정도 그 돈을 통해서 기준이 되어지는 거죠. 돈을 통해서. 그까 갑자기 돈이 많으면 막 기분이 되게 좋았다가 돈이 갑자기 없어져 버리면 기분이 되게 나빠지고 그죠. 돈에 따라서 그의 오늘 하루가 결정되는 사람들. 그리고 뭡니까?"], ["10:35", "주머니가 지갑에도 돈 들어 있을 때도 돈이 많이 들었고 두둑하게 들어 있을 때 요즘에는 뭐 카드 갖고 다니니니까 상관없지만 과거에는 뭐 현금이 많았잖아요. 현금 많이 두둑히 갖고 다니면 목에 핏대가 서고 딱서 있고 돈이 없으면 구질구질하게 인생이 어둡게 다니고 돈 때문에 벌어지는 많은 문제들이에요. 가정에도 문제가 돈 문제 때문에 싸우는 경우가 대부분이잖아요. 부부간의 싸움을 이렇게 보니까 사랑과 전쟁 지금은 안 하지만 과거에 사랑과 전쟁이 그렇게 히트였잖아요. 그만큼 이 나라가 심각한 거예요. 그 사랑과 전쟁이 히트 칠 드라마가 아니잖아요. 그렇지 않습니까? 맨날 부부 싸움하고 이혼한다, 뭐 한다 하고 막 난리를 치는 그게 히트를 치겠어요. 그게 우리의 일상적인 것에서 벗어나지 않기 때문에 일어난 거예요. 벗어나지 않기 때문에. 그래서 그 문제 때문에 있는데 사랑과 전쟁이 대부분의 문제가 뭐예요? 돈 때문에 그런 거잖아요."], ["11:29", "돈 때문에. 돈이 없어졌다 뭐 했다, 뭐 했다, 뭐했다 막서 그런 얘기잖아요. 그죠? 그 돈 문제 때문에도 뭐가 생기죠? 그렇죠. 무슨 바람 피는 것도 돈 문제 때문에 생기는 거고. 돈에 연관된 일들이 무지하게 많죠. 왜 그럴까요? 이 돈이 나쁜 건 아니에요. 근데 중요한 건 뭘까요? 돈을 어떻게 보느냐가 중요하다는 거죠. 돈을 어떻게 보느냐가 중요하죠. 그죠? 여러분들 의사는 환자를 고쳐야 되는게 1번입니다. 선생님은 학생들을 가르쳐야 되는게 1번 아닙니까? 근데 거기에 늘 걸려 있는게 뭐죠? 돈에 걸려 있죠. 먼저 뭐 하라는 거죠? 수납하라는 겁니다. 수납해야 병고쳐 준다는 거 아니에요. 그죠? 왜냐면 그 돈 때문에 살고 죽는 문제들이 너무 많아지는 거죠. 그러다 보니까 사람들은 다 어디에 속하죠?"], ["12:19", "돈 문제 때문에 계속 마음에 씨름도 하고 염려도 하고 걱정도 하고 그런 거죠. 무엇을 먹을까 무엇을 입을까 무엇을 마실까 염려하지 마라. 이건 다 이방인들이 염려하는 거다. 이방인들의 특징이 뭐죠? 돈의 문제가 기준이죠. 근데 하나님 믿는 사람들의 특징이 뭡니까? 하늘에 계신 하나님 아버지죠. 은혜가 여러분들 우리에게는 뭡니까? 그렇죠. 특별한 존재가 되죠. 은혜가 세상은 돈이 특별한 존재가 되지만 근데 어느 순간 기독교인도 돈이 특별한 존재가 되기 시작하더라는 거죠. 돈 있어야 뭐를 하지? 돈 있어야 뭘 하지? 그 틀린 말은 아니지만 그 말이 꼭 정답은 아닙니다. 그죠? 결혼도 마찬가지죠. 제일 먼저가 사랑하는 사람이 필요한 거거든요. 근데 거기에 뭐가 항상 깔려 있죠? 왜 결혼 안 해? 돈이 있어야지. 돈이 있어야지. 돈 많이 벌으면 결혼할 거야. 돈 많이 벌게 거의 뭡니까? 다 그쪽에 걸려 있는 거죠. 그 우상처럼 찾아오는 거 아닙니까? 예수님 앞에 찾아왔던 누굽니까? 상속의 문제를 가지고 찾아왔던 동생이 있었죠. 그죠?"], ["13:24", "그래서 우리 형을 고발합니다. 예수님. 그 무슨 얘기냐? 그랬더니 아버지가 돌아가 부모님이 돌아가셨는데 우리에게 상속을 물려 줬는데 형이 다 가져갔습니다. 그 나쁜 놈을 해결해 주십시오. 예수님 뭐라 합니까? 이런 문제를 가지고 왜 나한테 오냐? 그러잖아요. 이런 문제를. 그리고 또 형제간에 이런 돈 문제 때문에 갈라지냐 이런 것도 있잖아요. 그죠? 그런 것도 있 그런 것도 거기에 걸려 있는 문제입니다. 여러분 친한 친구가 둘이 있었다잖아요. 둘이 친한 친구인데 갑자기 길을 가다가 뭡니까? 금덩어리 두 개를 주웠잖아요. 아, 얼마나 좋아요. 사이 좋게 하나씩 나누니까. 그래, 너도 금덩어리 하나 가져. 나도 금덩어리 하나 가질게. 야, 오늘 우리 땡 잡았다 야. 그러면서 뭡니까? 배를 타고 호수 건너편으로 건너가려고 배를 탔습니다."], ["14:15", "둘이 있었던 거죠. 그리고 난 다음에 배를 막 젓고 있는데 중간 정도 딱 가는데 한 친구가 금덩어리를 물에다가 빠뜨려 버리잖아요. 강가에다 빠뜨려 버렸습니다. 그랬더니 옆에 있는 친구는 말이 야 그 비싼 걸 왜 빠뜨려? 왜 그래 그랬더냐는 말이 미안해 친구 지금 나는 이런 마음을 가졌어. 네가 없었다면 내가 두 개를 가졌을 텐데 네가 있어서 내가 한 개밖에 못 가지니 얘를 죽이면 내가 두 개가 되지 않을까 이런 마음이 있더래요. 그 욕심이. 그래서 이게 천벌받겠다 해 갖고 내가 금덩이보다 친구가 더 소중하다. 그래 가지고 금덩이를 강에다 던졌대요. 그랬더니 그 얘기를 듣던 옆에 친구가 뭐라 합니까? 자기도 금덩어리를 강에다 던지더래요. 그 너는 왜 던지냐 했더니 똑같은 마음을 가졌어. 그래 가지고 나도 미안해. 나도 너 없었으면 금덩이 두 개 갖고 있는 거 아니냐? 그러면서 던져 버렸대요."], ["15:09", "그러니까 여러분들 없었으면 얼마나 좋았을까요? 있으면 더 좋을 텐데 더 좋은게 아니라 친구 관계가 깨지더라는 거 아닙니까? 그러니까 어떻게 해야 됩니까? 금덩어리를 던져 버린 거죠. 그러니까 여러분들 그런 부분들이 우리 안에 가정도 파괴되고 형제 간에도 파괴되고 또 부부 사이에도 안 좋아지고 부모 자식간에도 돈 문제 때문에 안 좋아지잖아요. 그렇다고 돈을 뭐 멀리 하라는 건 아니지만 조금 하나님 앞에 그리스도인으로서 성도로서의 지혜를 갖고 있어야 되지 않을까 그렇게 생각을 합니다. 여러분 교회도 대부분 부딪히고 싸우고 분열되는 것 중에 하나가 돈 문제가 걸려 있더라고요. 늘 돈 문제가 교회의 성도들을 자꾸 막 갈라놓게 만들고 찢어지게 만들더라고요. 우리 세종월드교회는 그런 일 안 생길 거라고 확신합니다. 아멘."], ["16:01", "예. 그래서 그런 문제가 있을 때 분열되는 것이 돈을 버리는게 낫다. 이렇게 생각을 하셔야 돼요. 왜? 돈 때문에 분열될 것 같으면 돈을 버리자. 이게 제일 중요한 거예요. 이것 때문에 너와 나와 사이가 나빠진다면 그 나빠지게 한 그놈을 버리자. 그럼 너하고 나하고 사이가 좋아질 거 아니냐? 그게 우리 안에 너무 중요한 거 아닙니까? 부자 지간에도 뭡니까? 아버지와 아들 지간에도 동일한 거 아닙니까? 거기에 아버지와 아들이 돈 때문에 문제가 생긴다면 그 돈을 좀 멀리 하면 아버지와 아들의 사이가 너무 좋아질 거 아닙니까? 부부 사이도 저는 동일하다고 생각합니다. 돈이 가정 파괴 보면 아닌데요. 돈 문제 때문에 가정이 파괴가 된다면 뭘 포기해야 돼요? 가정을 포기해야 돼요? 돈을 포기해야 돼요? 예. 여러분 돈을 포기해야 됩니다."], ["16:47", "머니머니 해도 머니가 좋아요. 하는 사람하고 놀지 마시고요. 머니머니 해도 난 네가 더 좋고 머니가 두 번째 좋다. 이러면 다 좋을 것 같습니다. 그렇게 생각하면 여러분들 너무 좋지 않을까요? 그리스도 안에서 이 문제가 이기고 회복되기를 주의 이름으로 축복합니다. 아멘. 그래서 오늘부터 뭡니까? 우리를 파괴시키고 분리시키고 깨버리는 이런 요소들이 있다면은 그거를 빨리 바꿔 놓는 지혜를 하나님 앞에 간구하시고 거기서 자유함을 얻으시고 거기서 좀 해방돼서 하나님만이 아 우리 둘 사이 우리 여러 사이 우리 교회 공동체를 하나로 만드는 분이다. 믿고 따라가고 순종하는 그 일이 있어져야 된다고 저는 확신합니다. 아멘."], ["17:30", "여러분 두 번째 문제가 뭡니까? 두 번째는요. 이 가정의 신앙이 애매해요. 그게 문제예요. 하나님을 믿는 사람이 어떻게 집안에다가 아 뭡니까? 신상을 만들어요. 우상 단지를. 말도 안 되는 거 아닙니까? 우상 단지를 만들고 거기다가 뭡니까? 또 제사장까지 갖다 놓고 그리고 제사장한테 점을 물어보고 이거 말도 안 되는 거야. 이게 무슨 신앙이에요? 그게요. 어. 그 푸닥거리지 무슨 신앙이에요? 안 그래요? 여러분 이게 바로 뭡니까? 이게 하나님과 우상을 겸하여 섬기는 거예요. 이거 안 돼요. 사실은 우리는요. 어떤 그냥 뭐 폼으로 달고 다니는 액세서리 뭐 목걸이 십자가 뭐 괜찮지만은요. 거기에 목걸이를 달면 악귀가 물러나가고 목걸이 십자가를 달면 드라큘라가 없어지고 이런 개념으로 갖고 있으면 그거 빨리 뜯어내야 돼요. 그거 우상이에요."], ["18:24", "그죠? 여러분 그런 우상들은 십계명에서 다 버리라고 하지 않습니까? 집에다가 여러분 뭡니까? 그 성화 같은 거, 예수님의 얼굴 같은 거 갖다 놓고 하는 것도 사실은 그거 기독교인으로서는 안 맞는 거예요. 왜냐면 예수님이 집에 걸어놓은 그 그림보다 훨씬 못생겼어요. 예수님도 자기가 충격받을 거예요. 야, 내 사진이 이렇게 잘생겼냐? 거기 써 있잖아요. 이사야 53장에 53장이 뭡니까? 아주 못생겨 갖고 사람들에게 흠모할 만한 것이 없다 되잖아요. 그러니까 여러분들 못생긴 사람들이라고 내가 생각하면요. 난 예수 닮은 사람이구나 이렇게 생각하면 돼요. 왜냐면 예수님 자체가 무지하게 못생겼기 때문에 상관없습니다. 그러니까 예수님의 목소리도 전 별로 안 좋았을 것 같아요. 목소리 막 성우들 사용해서 막 하는 거 그거 전부 다 예수님과 전혀 관계가 없는 그런 어떤 영화에서 나오는 거죠. 거기서 막 뭐 목소리가 굉장히 멋있고 그거 들으면 하나님께서 가라사대 더 멋있는데 그죠? 그런 목소리를 하고 있으면 사람들이 아멘 그러는데 그거 다 틀린 거예요. 그러지 마세요."], ["19:31", "그런 거 다 맞지 않는 거고요. 어떤 사람도 이런 사람도 있더라고요. 뭐냐면요. 성경 구절 하나씩 하나씩을요. 옷에다가 지니고 다니고 팬티에다 지니고 다니고 집에 베개 속에다 넣고 다니고 이거 안 돼요. 그거 아니 목사님 그래도 마음이 좀 불안해서 그래요. 알아요. 근데 그 불안하는 걸로만 불안한 걸로만 끝나면 되지 않을까요? 아무것도 염려하지 마시라고 그랬잖아요. 근데 염려 하나님 대신에 뭘 하라는 거예요? 기도와 간구로 너희 구할 것을 감사함으로 하나님께 아뢰라 그런 거 아닙니까? 아멘. 그 염려하지 말라고 한 것만 있는게 아니에요. 기도와 간구로 염려를 대신하라고 하는 거예요. 아멘. 여러분들 알겠죠? 그러니까 뭡니까? 교회 왔을 때 아, 내가 좀 오늘은 어딘가 모르게 좀 두려움이 있다. 하나님 찾아온 거 잘하신 겁니다."], ["20:18", "내가 갑자기 오늘 마음속에 괴로움이 있다. 주님 앞에 기도하십시오. 오늘 마음속에 염려와 걱정이 있다. 하나님 앞에 찬양하십시오. 그러면요. 그 염려와 걱정과 불안을 찬양과 기도와 예배로 바꿔 놓을 수 있다는 겁니다. 오늘 그렇게 바꿔지기를 바랍니다. 아멘. 예. 그래서 이왕이면 뭡니까? 하나님이 기뻐하는 거. 애매모호한 신앙. 간직하지 마세요. 애매모호한 신앙. 여러분 보세요. 우리가 우리가 주일마다 주기도문을 얼마 전까지 했잖아요. 그죠? 사실은 주기도문 하면서 무슨 얘기를 하는 거죠? 우리 이제 주기도문 딱 끝나면요. 사실은 ppBtn.onclick=()=>{if(!ready){pending=START;return;}const st=player.getPlayerState();if(st===1||st===3)player.pauseVideo();else player.playVideo();};
const jump=d=>{if(!ready)return;player.seekTo(Math.max(0,player.getCurrentTime()+d),true);};
let SKIP=10; try{const v=parseInt(localStorage.getItem('sermon-skip'));if(v)SKIP=v;}catch(e){}
const bkB=document.getElementById('bk'), fwB=document.getElementById('fw'), skp=document.getElementById('skp');
function setSkip(v){SKIP=v;try{localStorage.setItem('sermon-skip',v);}catch(e){}bkB.textContent='-'+v;fwB.textContent='+'+v;bkB.setAttribute('aria-label',v+'초 뒤로');fwB.setAttribute('aria-label',v+'초 앞으로');
  skp.innerHTML=[5,10,15,30].map(s=>`<button data-s="${s}" class="${s===SKIP?'on':''}" style="font-size:13px;min-width:46px">${s}초</button>`).join('');}
skp.onclick=e=>{const b=e.target.closest('button');if(b)setSkip(+b.dataset.s);};
bkB.onclick=()=>jump(-SKIP); fwB.onclick=()=>jump(SKIP);
setSkip(SKIP);
skEl.addEventListener('input',()=>{dragging=true;document.getElementById('line').style.setProperty('--p',(skEl.value/10)+'%');const dur=(ready&&player.getDuration())||END;tmEl.textContent=fmtT(skEl.value/1000*dur);});
skEl.addEventListener('change',()=>{dragging=false;if(!ready)return;const dur=player.getDuration()||END;userScrollAt=0;player.seekTo(skEl.value/1000*dur,true);});
setInterval(()=>{if(!ready||!player.getPlayerState)return;const st=player.getPlayerState();ppBtn.textContent=(st===1||st===3)?'❚❚':'▶';const dur=player.getDuration()||END, t=player.getCurrentTime();tdEl.textContent=fmtT(dur);if(!dragging){tmEl.textContent=fmtT(t);skEl.value=Math.round(t/dur*1000);document.getElementById('line').style.setProperty('--p',(skEl.value/10)+'%');}},500);
tdEl.textContent=fmtT(END);
if(lsGet('sermon-mini',false)) setMini(true);
document.getElementById('mtitle').textContent=document.querySelector('.head h1').textContent;

/* ---- 단어·시간 누르면 그 위치부터 재생 ---- */
list.addEventListener('click',e=>{
  const w=e.target.closest('.w'); if(w){userScrollAt=0;seek(WT[+w.dataset.i][+w.dataset.j]);return;}
  const b=e.target.closest('.who button'); if(b){userScrollAt=0;seek(+b.dataset.s);}
});

/* ---- 탭 / 구간 바로가기 ---- */
const tabs=document.querySelectorAll('.tabs button');
function show(t){tabs.forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t));scroller.scrollTop=0;}
tabs.forEach(b=>b.onclick=()=>show(b.dataset.t));
document.querySelectorAll('.chap a').forEach(a=>a.onclick=e=>{e.preventDefault();show('txt');lastI=-1;userScrollAt=0;seek(+a.dataset.s);});
</script>
</body>
</html>
