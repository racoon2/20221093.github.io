<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b1d21;--sub:#6b7280;--line:#e6e8ec;--accent:#12a37a;--accent-soft:#e7f6f1;--hl:#fff3b0}

*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.top{flex:none;background:#000}
.vid{position:relative;width:100%;aspect-ratio:16/9}
.vid{max-height:38vh;width:min(100%,calc(38vh*16/9));margin:0 auto}
.pbar{flex:none;position:relative;z-index:20;display:flex;align-items:center;justify-content:space-between;background:var(--card);padding:14px 14px calc(6px + env(safe-area-inset-bottom))}
.pbar .line{position:absolute;left:0;right:0;top:0;height:3px;background:var(--line);pointer-events:none}
.pbar .line i{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:var(--accent)}
.pbar .line b{position:absolute;top:50%;left:var(--p,0%);width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--accent)}
.pbar .seek{position:absolute;left:0;right:0;top:-2px;height:20px;width:100%;margin:0;padding:0;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:none}
.pbar .t{flex:1;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.pbar .t.r{text-align:right}
.pbar .btns{display:flex;align-items:center;gap:16px}
.pbar .sk{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--sub);font:inherit;font-size:11px;cursor:pointer}
.pbar .pp{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:15px;cursor:pointer}
.tabs .home{flex:none;width:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--sub);text-decoration:none;font-size:10.5px;border-right:1px solid var(--line)}
.tabs .home:active{color:var(--accent)}
.mctl{display:none}
.lm{border:1px solid var(--line);background:none;color:var(--sub);border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer;margin-left:6px}
body.mini{display:flex!important;flex-direction:column;max-width:720px;height:100%;height:100dvh}
body.mini .top{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
body.mini .vid{flex:none;width:200px!important;background:#000;max-height:none;margin:0;border-radius:8px;overflow:hidden}
body.mini .mctl{display:flex;flex:1;min-width:0;flex-direction:column;gap:6px}
body.mini .head{display:none}
body.mini .tabs,body.mini .scroll{border-left:0;margin:0}
body.mini .scroll{flex:1}
.mctl .mt{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mctl .mr{display:flex;align-items:center;gap:8px}
.mctl .pp{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:14px;cursor:pointer}
.mctl .tm{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;flex:1}
.mctl .ex{flex:none;border:1px solid var(--line);background:none;color:var(--sub);border-radius:999px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
@media (min-width:900px){
  .pbar{grid-column:1/3;grid-row:4}
  body{max-width:1280px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(400px,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;height:100vh;height:100dvh;column-gap:0}

}

.head{flex:none;background:var(--card);padding:10px 14px;border-bottom:1px solid var(--line)}

.head .meta{font-size:12.5px;color:var(--sub)}
.tabs{flex:none;display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:11px 0;font:inherit;font-size:14.5px;color:var(--sub);border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);font-weight:700;border-color:var(--accent)}
.scroll{flex:1;overflow-y:auto;position:relative}
section{display:none;padding:10px 14px 40px}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.card p{margin:0;font-size:calc(15px * var(--fz,1));line-height:1.75}
.kw{display:flex;flex-wrap:wrap;gap:6px}.kw span{font-size:13px;background:var(--accent-soft);color:var(--accent);padding:5px 10px;border-radius:999px}
ol.pts{margin:0;padding:0;list-style:none;counter-reset:p}
ol.pts li{counter-increment:p;position:relative;padding:0 0 14px 34px;font-size:15px;line-height:1.7}
ol.pts li::before{content:counter(p);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
ol.pts li b{display:block} ol.pts li small{color:var(--sub);font-size:13.5px}
.chap a{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14.5px}
.chap a:first-child{border-top:0}
.chap time{color:var(--accent);min-width:44px;font-weight:500;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center;padding:0 0 8px}
.tools input{flex:1;font:inherit;font-size:15px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.follow{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:8px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.follow.on{color:var(--accent);border-color:var(--accent)}
.count{font-size:12.5px;color:var(--sub);min-height:0}
.tip{font-size:12.5px;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.seg{display:flex;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);border-radius:10px}
.seg.now{background:var(--accent-soft)}
.av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.who{font-size:13px;color:var(--sub);margin-bottom:3px}
.who button{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;margin-left:6px;padding:0;cursor:pointer;font-variant-numeric:tabular-nums}
.tx{font-size:calc(15.5px * var(--fz,1));line-height:1.85;word-break:keep-all}
ol.pts li{font-size:calc(15px * var(--fz,1))!important}
.gear{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:8px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.tools input{min-width:0;width:0}
.setp .row{flex-wrap:wrap}
.setp{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.setp.on{display:block}
.setp .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.setp .lb{font-size:13.5px;font-weight:500}
.fsz{display:flex;gap:4px}
.fsz button{border:1px solid var(--line);background:none;color:var(--sub);border-radius:8px;min-width:38px;padding:6px 0;cursor:pointer;font-family:inherit}
.fsz button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.setp .pv{margin-top:10px;font-size:calc(15.5px * var(--fz,1));line-height:1.8;color:var(--sub)}
.w{cursor:pointer;border-radius:3px}
.w.say{background:var(--accent);color:#fff}
mark{background:var(--hl);color:inherit;border-radius:3px}
.hide{display:none}
.note{font-size:12.5px;color:var(--sub);line-height:1.6;padding:14px 4px 0}
body.mini{display:flex!important}
</style>
</head>

<script>

const T=[["0:00", "게하시의 태도라는 제목으로 하나님 말씀을 증거하도록 하겠습니다. 우리 옆 사람하고 인사 한번 나누죠. 아 삼일날 만나서 반갑습니다. 얼렁 인사 기쁘게 한번 나눠 보십시오. 예, 함께 해 주셔서 고맙습니다 여러분. 어 오늘 우리 교회 간판이 새로 올라온 걸 보셨습니까? 네. 어떻게 되게 좀 더 멋있고 괜찮아요? 네. 예, 글자도 좀 크게 만들었는데 어쨌든 제가 봐도 아주 멋있게 잘 만들었더라고요. 그리고 이제는 들어오시면서 1층부터 2층까지 또 방마다 이름을 좀 바꿨습니다. 원래 그 이름이 불편해서 바꾼 게 아니고 그 옆에 어 뭡니까 풍요로운 교회라고 다 써 있어 가지고 어쩔 수 없이 다 바꿔야 되는 상황이라 바꿨기 때문에, 이왕 바꾸는 김에 이름도 한번 바꿔 보자."], ["0:52", "그래 가지고 사무엘홀은 디올실이라고 바꿨습니다. 대학부가 있고요, 이 디올이라는 말은 아름다움과 창조성이란 뜻입니다. 그리고 다니엘홀은요 에르메스실이라고 해 갖고 청년 2부인데 장인 정신이란 뜻입니다. 그리고 바울홀은요 샤넬실로 이름을 바꿨습니다. 청년 3부입니다. 기존의 틀을 깨고 자신만의 아름다움을 만들어 가는 정신, 청년 3부 아시겠죠? 예, 기존의 틀을 깨고 자신만의 아름다움을 만들어 가는 정신 그게 샤넬입니다. 그리고 소그룹실은 구찌실로 바꿨습니다. 중고등부실인데 시대를 넘어 지금도 이어지는 가치, 멋있죠? 그죠? 그러니까 그 이름마다 들었는데 뜻을 잘 몰라 가지고 제가 설명해 드리는 겁니다. 바나바실은요 몽블랑실로 바꿨습니다. 구대륙 최고봉 몽블랑산처럼 최고급 최고가 되겠습니다라는 뜻입니다. 그러니까 몽블랑실을 쓰는 분들은 최고가 되겠습니다 하는 마음으로 들어가셔야 됩니다. 아시겠죠? 아멘."], ["1:53", "그리고 게스트룸은요 입생로랑실인데요, 타협함이 없다, 담대함이다. 그런 거 잊어먹지 마시고 타협함이 없다니까는 이 방은 내 방이니까 싸우는 일 없길 바랍니다. 5층은 하늘정원 옥상인데요, 발렌시아가든이라 그래 갖고 생동감과 새로움을 추구하는 겁니다. 그러니까 사과나무도 심고 배나무도 심고 뭐 심어 보렵니다 5층에다가. 그러니까 그렇게 실을 바꿨으니까 '아 뭐 이래' 하지 마시고 여러분들 명품 좋아하시죠? 그리고 명품은 좀 다른 말로 하면 또 명문가도 될 수가 있습니다. 그래서 이름을 그렇게 좀 바꿔 놨는데 처음 오는 분들이 '야 신기하다, 들어가고 싶다' 할 것 같습니다. 그래도 사무엘실 하면 '뭐야' 할 텐데 거기에 디올실 하면 '뭐지? 들어본 이름이 그 내가 알고 있는 그 이름이 이거야?' 할 수도 있을 것 같아요. 그래 가지고 '아 좀 이상하다, 다른 걸로 바꾸자' 그러면 그만큼 돈을 내셔야 됩니다. 그래서 이왕에 붙여 놓은 거 그냥 쓰시면 좋을 것 같습니다. 별로 마음에 안 드십니까? 예, 괜찮죠? 네."], ["3:03", "예. 그래서 이게 무슨 뜻이라고 하면 이따가 아는 분들이 좀 가르쳐 주시기 바랍니다. 그렇게 바꿨으니까 '아 뭐야, 좀 이상한 것 같아'라고 하지 마시고 원래 저 복음적인 사람 맞습니다. 그러니까 '아 자꾸 왜 세상 게 자꾸 들어오지?' 여러분들 입고 있는 옷부터 시작해서 다 세상 거 아닙니까? 전부 다 세상 겁니다. 세상에 우리를 보내신 거는 세상에서 거리를 만드시려고 보낸 게 아니라 세상을 다스리고 정복하라고 보내신 겁니다. 아멘. 아멘. 하나님 믿지 않는 영혼들에게 그리스도의 십자가의 복음으로 저들의 영혼을 하나님의 백성으로 만들어 내는 사명, 그게 바로 뭡니까? 세종월드교회의 사명입니다. 아멘. 예, 그렇게 해서 여기 써 있잖아요. 마르튀스. 무슨 뜻입니까? 다 같이 증인. 예, 증인이란 뜻입니다 마르튀스. 증인입니다. 그러니까 우리는 그리스도의 증인이 되셔야 됩니다. 아멘."], ["4:09", "오늘 여러분 본문은 나아만이 엘리사를 통해서 문둥병 고침을 받았습니다. 그리고 난 다음에 엘리사에게 귀한 선물들을 가지고 왔잖아요. 그거를 아람 왕이 보낸 겁니다. 그래서 그 선물을 주려고 했는데 엘리사가 거부하지 않습니까? '아 이 정도 고치고 무슨 선물이야?' 여러분들 세상에서는 뭡니까, 기적과 같은 일이 우리 세종월드교회는 상식과 같은 일이 된다는 걸 잊어먹지 마십시오. 예수 믿는 매력이 그겁니다. 세상을 보면 '와 이게 뭐지' 하는데 우리는 '뭐' 이런단 말이죠. 그러니까는 세상이 기적과 같은 거 세종월드교회는 상식과 같은 일이라는 걸 잊어먹지 마시고 별거 아닙니다. 그런 게 뭘 그렇게 큰 일입니까? 하나님 앞에 기도하면 응답됩니다. 하나님 앞에 치유 기도하면 병 낫습니다. 이거 우리는요 기본적으로 갖고 있어야 될 신앙의 믿음입니다. 잊어먹지 마시고 누가 좀 아프면 기도해 주시고 하면 좋을 것 같습니다. 그리고 밥 사 준다 하면 '에이 신 거 같고 무슨 밥을 얻어먹어' 하고선 오늘 엘리사처럼 조금 이렇게 매력을 가지고 조금 뭡니까 거부하는, 이거 필요합니다 그죠?"], ["5:34", "그런 것처럼 오늘 엘리사도 그 모습 속에 속합니다. 그런데 그것을 보고 나서 엘리사의 사환 종이죠, 게하시가 그걸 보고 기분이 조금 언짢았습니다. '우리 주인님은 왜 이런 큰 일을 하고도 좋은 선물을 받지 않고 그냥 돌려보내는가? 이건 있을 수가 없다. 내가 가서 받아 와야겠다' 하고선 뭡니까 달려가서 받아 옵니다. 받아 오는데 나아만이 또 그거를 보고 또 줍니다. 주고 또 받아 와서 기분 좋게 도착을 하고 또 기분 좋은데, 그때 누가 아냐면 선생님인 엘리사가 그걸 알고 있습니다. 그래서 게하시한테 가서 '야, 내가 거부한 선물을 네가 왜 받아 오냐? 그러면서 너는 마음속에 그 나쁜 마음과 욕심꾸러기 마음이 있으니까 너는 이제 앞으로 나병 환자가 될 거다.' 이래 갖고 뭡니까 나병 환자로서 병든 자가 되죠. 그죠? 그걸로 이제 오늘 얘기가 끝나는 겁니다."], ["6:36", "여기서 우리가 조금 더 궁금해하거나 조금 더 관심을 가져야 될 게 뭐냐? 그럴 때 우리는 이렇게 생각할 수 있습니다. 게하시가 주인이 시키는 대로 주인의 마음을 몰랐다는 거죠. 그죠? 그거 하나가 문제가 있을 수 있고요. 또 게하시가 거짓말을 했다는 거 아닙니까? 나아만에게 거짓말을 했죠. 주인이 보내지 않았는데 주인이 보냈다고 거짓말한 거 아닙니까? 그래서 거짓말하지 말자, 거짓말하면 이렇게 병든다 이런 게 교훈 아닙니다. 여기서의 교훈은 뭐냐면 하나님의 은혜가 뭐 같다는 거죠? 보상으로 바뀌었다는 거예요. 하나님의 은혜가 보상으로 바뀌었다는 거예요. 여러분, 하나님의 은혜가 뭡니까? 하나님께서 우리에게 주시는 구원은 하나님의 은혜입니다. 그리고 그 은혜는 우리가 우리 스스로 얻을 수 없어서 자력 구원이 안 돼서 하나님께서 죄인 된 우리에게 은혜를 베풀어 놓으신 겁니다."], ["7:38", "그래서 누구나 다 그 안에는 하나님의 은혜가 온 만방에 뻗어 있는 거 사실입니다. 거기에는 인종 상관없습니다. 나이 상관없습니다. 거기에는 어떤 성차별도 상관없고, 거기에는 높고 낮음도 상관이 없습니다. 누구나 다 하나님의 은혜 안에 세워질 수 있다는 게 죄인 된 우리가 구원받아 의인이 되는 자격 조건입니다. 그거는 사실은 우리 교회에서 전도적인 차원에서 얘기할 때는 그렇게 얘기합니다. 뭐냐면 '나는 예수 믿고 구원받았습니다'라고 얘기합니다. 그렇지만 여러분 이거 조금만 바꿔서 얘기하면요, '구원받았기 때문에 예수를 믿는 겁니다.' 아멘. 여러분 이해되십니까? 잘못 오해하면 뭐가 되냐면 예수를 믿는다라고 하는 내 쪽에서의 강한 의지와 결단이 구원을 만들어 냈다고 착각할 수 있어서 제가 조금 바꾼 겁니다. 그래서 우리 뭡니까 '예수 믿고 구원받았습니다'라고 이제부터 쓰지 말고요, '구원받았기 때문에 예수를 믿는 겁니다'라고 쓰시기 바랍니다. 아멘."], ["8:48", "여러분 죄인의 상태는 뭡니까? 죄인의 상태는 죽은 자입니다. 성경에서는 죄인은 죽은 자입니다. 죄의 삯은 사망이라고 이미 로마서에서 얘기하고 있지 않습니까? 그렇다면 사망한 자는 이미 죽은 겁니다. 죽은 자가 무슨 말을 할 수 있어서 살아날 수 있습니까? 아멘. 예를 들어 봅시다. 죽은 시체에게 뭐라고 합니까? '너 살려 달라고 한 마디만 하면 내가 너 살려 줄게.' 살려 달라고 했으면 이미 산 거예요, 죽은 거예요? 산 겁니다. 내가 예수 믿기로 고백했다면 산 거예요, 죽은 거예요? 살았죠. 왜냐면 예수 믿기로 고백했다는 자체부터가 이미 살아 있기 때문에 내가 고백한 겁니다. 살아 있지 않다면 내가 어떻게 고백이라는 단어를 쓸 수 있을까요? 죽은 자는 말이 없습니다. 죽은 자는 말을 못 하는 거 아닙니까? 그러니까 내가 예수 믿어서 구원받았다고 하는 것은 전도적인 차원에서는 맞지만 성경적인 차원으로 볼 때는 '구원받았기 때문에 당신이 예수를 믿는 겁니다' 요러는 게 훨씬 더 안정감이 있습니다."], ["9:56", "왜 그러냐면 그 구원의 가장 근본적인 원인은 뭡니까? 예수님의 십자가입니다. 하나님께서 당신의 아들 예수 그리스도를 이 땅에 보내 주셔서 죄인 된 자들에게 하나님의 은혜와 긍휼이 임하셔서 저들이 하나님의 자녀로 인정된 겁니다. 그거는 우리 쪽에서는 아무것도 할 수 없다고 말해야 정답입니다. 나는 예수를 믿는 것에 할 게 아무것도 없습니다. 오늘도 교회 왔잖아요. 그것도 하나님의 인도하심 때문에 온 거 아닐까요? 오다가 별별 사고가 다 날 수도 있습니다. 오다가 어떤 위험이 올 수도 있고 오다가 갑자기 전화를 받아서 집안에 무슨 일이 생겨도 못 올 수도 있지 않습니까? 그런데 이런 모든 것들이 다 뭡니까 교회를 오게 하신 하나님의 은혜와 계획하심이 있다고 얘기하는 겁니다. 그래서 여러분들 우리가 예수 믿기 전에는 대부분이 어디에 속했냐면 대부분이 진화론적인 사고에 속했습니다. 진화론적인 사고를 한마디로 말하면요 뭐가 없냐면 계획성이 없다고 생각하면 맞습니다. '어 얼떨결에 이렇게 됐어, 어떻게 하다 보니까 이렇게 왔어' 그건 진화론적인 겁니다."], ["11:15", "그런데 여러분들 뭡니까 창조론은 뭡니까? 하나님께서 우리를 만들어 내시는 태초의 계획이 있었다는 겁니다. 하나님의 의도가 있었고, 하나님의 작정이 있었고, 하나님의 계획이 있어서 그 계획에 따라서 우리가 하나님의 자녀가 됐고 하나님이 만드신 바 됐고, 하나님의 계획 속에 죄인 된 우리가 의로운 사람이 될 수 있는 결과를 만들어 낸 겁니다. 누가요? 하나님께서. 거기에 가장 많이 들어가는 조건이 뭐냐면 예수님의 십자가입니다. 그래서 우리는 예수님의 십자가로 인해서 구원받은 백성이라고 다 얘기하는 거 아닙니까? '너희가 그 은혜를 인하여 믿음으로 말미암아 구원을 받았나니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라, 행위에서 난 것이 아니니 이는 누구든지 자랑치 못하게 하려 함이라.' 행위가 뭡니까? 내가 고백함으로 받은 게 아니라 하나님이 구원하셔서 고백했다는 거예요. 하나님이 구원하셔서 하나님이 나를 살려냈단 말이죠. 뭘로? 예수님의 십자가로 살려내셔서 내가 뭡니까, 죽은 자가 살아나서 하나님 앞에 영광을 올려 드리는 반응을 만들어 냈다는 겁니다. 누구 때문에? 하나님의 은혜 때문에."], ["12:48", "여러분, 그것이 뭡니까 오늘 하나님의 은혜가 우리 안에 찾아와진 내용입니다. 거기에 게하시는 어떤 입장을 갖고 있죠? 게하시는 '우리 선생님이 나아만을 문둥병에서 낫게 했으니까 뭐 해야 된다는 겁니까? 그것만큼의 대가를 지불해야 돼'라고 얘기하는 겁니다. 그래서 교회마다 자꾸 얘기하죠. 이게 어떻게 보면은 가슴을 뜨겁게 하는 건 좋은 단어지만 어떻게 보면 조금 더 불편한 단어가 될 수 있습니다. '하나님이 너를 구원했으니까 너는 앞으로 하나님을 위해서 뭐를 할래?' 이렇게 질문하는 겁니다. '너는 하나님이 너를 구원했으니 죄인 된 너를 구원하고 살려서 생명을 얻게 만들어 내셨으니 앞으로 너는 하나님을 위해서 뭘 할 거냐?' 이렇게 얘기하는 자체가 우리 뜨거운 마음에서 '하나님 앞에 영광 올려 드리고 예배드리고 주님이 기뻐하시는 사람으로 살겠습니다'라고 하는 것은 우리 쪽에서 하나님이 우리를 구원하신 반응입니다. 그렇지만 그거는 어떻게 보면 이런 거나 똑같습니다. '내가 지금까지 너를 먹여 살리고 또 재워주고 학교도 보냈으니 이제부터 나 죽을 때까지 네가 나 책임져.' 그게 부모의 고백이 되면 자녀들 남지 않고 다 도망갈걸요 아마. 그렇지 않습니까?"], ["14:08", "그게 뭐가 됩니까? 자발적인 내용이 돼야죠. 그렇게 하지 않아도 상관없지만 뭐 합니까 자발적인 게 된다면 훨씬 더 효도가 될 수 있는 아주 좋은 길 아닙니까? 우리 주님 앞에도 동일합니다. 우리가 하나님의 자녀가 됐다면 그 자녀로서 우리는 앞으로 뭡니까, 자녀의 가장 기본이 뭔지 아십니까? 성장하는 겁니다. 자녀의 가장 기본이 뭔지 아십니까? 건강한 겁니다. 그리고 그다음으로 조금만 더 욕심낸다면 부모의 바람은 '그래도 네가 잘 먹고 잘 사는 게 중요하지 않을까'에 대한 우리 쪽에서 뭡니까 '아 엄마 아빠 내가 열심히 할게요'라고 하는 고백 아닙니까? 그게 우리 신앙이 된다면 사실은 별 문제는 없습니다. 그런데 '하나님이 너를 구원했으니 너 앞으로 어떻게 할 거냐? 네 목숨 바쳐라.' 이거는요 기독교가 아니라 어떻게 보면 우상입니다. 여러분 우상이라는 게 무슨 뜻인지 아십니까? 우상은 내가 원하는 거를 줄 수 있는 게 우상입니다. 그래서 꼭 우상은 우리 쪽에 뭐를 기대하죠? '네가 나한테 뭘 줄 수가 있는데' 그걸 기대합니다."], ["15:26", "그래서 뭐 산 제물로 바치기도 하고 또 처녀를 바치기도 하고 이게 우상들의 모습 아닙니까? 막 부르짖기도 하고 왜 그렇습니까? '네가 원하는 거 내가 주려면 너도 내가 필요한 거 내놔야 돼' 이거란 말이에요. 기독교는 그런 거 없지요. 그래서 우리가 사사기 볼 때 입다 얘기하지 않았습니까? 입다 보고 뭐라 합니까? 입다가 그렇죠 '제일 먼저 내가 승리하고 집으로 들어갈 때 제일 먼저 나오는 거를 하나님 앞에 바치겠다' 그러죠. 그거 우상입니다. 하나님은 우리가 뭘 바치는 걸 기뻐하는 게 아니고 우리 존재 자체가 하나님 앞에 가장 거룩하게 쓰임 받기를 원하십니다. 아멘. 그래서 여러분들 예수 믿고 우리가 해야 될 일이 뭔 줄 아십니까? 예수 닮는 거예요. 아멘. 우리가 예수 그리스도로 변화돼서 죄인이 의인이 됐다면 이제부터 의인으로서의 삶은 예수 닮는 거예요 예수 닮는 거. '너희 안에 이 마음을 품어라 이는 곧 그리스도 예수의 마음이니' 그러면서 가장 먼저 강조하는 게 뭐죠? 겸손을 강조하죠."], ["16:34", "그리고 자기를 낮추시고 죽기까지 십자가에 복종하셨으니 그죠, 그 예수님의 사명이었단 말이에요. 십자가에 복종한 이유가 뭐죠? 하나님이 창조하신 피조물들이 죄를 져서 죄인의 몸으로 있는 거 그거를 뭐 한 거죠? 저들을 살려내기 위해서 내 아들 예수를 보내신 거란 말이에요. 그거로 인해서 우리가 예수 때문에 구원받은 거고 예수 십자가 때문에 구원받은 거고 예수님의 보혈의 피 때문에 구원받은 거예요. 아멘. 거기에 우리가 '믿겠습니다' 하는 것은 구원받은 백성으로서의 반응입니다. 그러니까 이 반응이 구원의 조건이 아니라 십자가가 구원의 조건이죠. 인정하십니까? 아멘. 예수님의 십자가가 구원의 조건입니다. 그래서 거기에 뭐가 없어야 됩니까? 보상이 없어야 됩니다 보상이."], ["17:30", "예수님께서 이 땅에 오셨을 때 유대인들 또 제자들이 가장 많이 갖고 있었던 게 뭡니까? 예수님이 여기 오셔서 우리를 구원하신다는 조건이 아니고요, 로마의 압제에서 해방시켜 주고 예수님이 왕으로 등극하고 그리고 제자들은 거기서 우의정 좌의정을 차지하고 그러면서 예수님을 영원한 왕으로 모시는 거. 그게 제자들의 꿈꾸었던 모습 아닙니까? 그래 갖고 그걸로 인해서 많은 어려움들이 겪어졌잖아요. 거기에 뭐가 있었죠? 침례 요한도 한몫을 했습니다. 침례 요한이 감옥에 있었죠. 그리고 나서 뭡니까 제자들에게 뭐라 합니까? '얘들아, 너 가서 지금 돌아다니면서 하나님 나라를 전하는 그가 메시아인지 확인해 봐라. 그가 그리스도인지 확인해 봐라' 이렇게 얘기한 겁니다. 그랬더니 제자들이 가 가지고 물어보죠. 뭐라고 물어봅니까? '당신이 예수입니까? 당신이 그리스도입니까? 당신이 이 땅에 오신 메시아입니까?'라고 물어봅니다."], ["18:35", "그럴 때 침례 요한의 제자들에게 무슨 얘기를 하는지 아십니까? 그런 얘기 했죠. '맹인이 눈을 뜨게 하고 못 걷는 자가 걷게 되고 나병 환자가 치료를 받고' 그렇게 얘기를 해요. 침례 요한이 무슨 생각 했을까요? '아니 지금 이 엄청난 중대한 일, 나라를 뒤집어 놓고 왕으로 만들어질 메시아가 지금 무슨 맹인을 고치고 무슨 못 걷는 자를 걷게 하고 나병 환자를 고치냐? 왜 그런 쓸데없는 걸 하고 있는 거냐?'라는 게 요한의 마음이었을 것 같아요 침례 요한의 마음. '지금 나를 건져내야 되는 거 아닙니까?' 자기를 지금 감옥에서 빼내야 되는 이 중대한 일에 세상에 무슨 나병 환자를 고치고 무슨 맹인을 눈 뜨게 하고 못 걷는 자를 고치고 이런 보잘것없는 것들에게 무슨 예수가 관심을 갖냐 그게 침례 요한의 아픔이었을 것 같아요."], ["19:45", "그러니까 예수님은 그 당시만 해도 이 땅에 오셨다면 누굴 만나야 되죠? 유대인들을 만나고 유대인들의 가장 높은 자리에 있는 자들을 만나고 그들과 같이 이야기하고 나누면서 '이제부터 걱정 없다, 내가 로마를 전부 다 물리쳐 줄게. 그렇게 하고 이스라엘 이 나라를 회복하고 내가 왕으로 등극할 테니까 전부 다 나를 섬겨라' 이래야 되거든요. 근데 그게 그렇게 안 됐단 말이에요. 그렇게 안 되니까 너도 나도가 다 뭡니까 예수를 십자가에 못 박는 일에 앞장섰죠. '오면 뭐 해? 쓸데없는 거만 하는데 이게 웬 거지들이 돌아다니고 이게 무슨 눈먼 자들, 못 걷는 자들, 병든 자들 그런 일만 하는 거예요. 이게 뭐냐 이게? 이런 거 해 갖고 무슨 어느 세월에 로마를 정복하고 어느 세월에 유대 나라를 멋있게 세우고 예수님이 왕으로 등극하냐?' 이게 저들에게는 불만이었단 말이에요."], ["20:48", "왜 그랬을까요? 예수님이 이 땅에 오시는 가장 근본적이 뭡니까? 죄인을 구원하시려는 거거든요. 죄인을 구원하시려고 가장 근본적으로 오신 겁니다. 그래서 예수님이 죄인의 집에 유했을 때 뭐라 합니까? 병든 자의 집에 들어갔을 때 거기에 수많은 사람들이 '저가 죄인의 집에 들어간다' 그때 뭐라고 얘기합니까? '병든 자야 의원이 쓸 데 있는 거 아니냐? 병들지 않으면 의원이 왜 필요하냐? 근데 쟤들이 병들었기 때문에 나 같은 사람 필요하다.' 예수님 오신 목적이 뭐라고요? 그렇죠, 죄인을 구원하시고 병든 자를 살려내시고 그리고 소외된 자를 거두시고 함께 나누시고 그 일만 하셨단 말이에요. 그러니 많은 사람들이 얼마나 분노했을까요? '아니 저가 와 가지고 왜 저런 거를 해? 왜 저런 불편한 일을 하고 있어? 지금 뭐 하는 거야 지금?' 이러면서 했는데 그들 옆에 모여진 사람들이 너무 많은 거죠."], ["21:46", "왜 많을까요? 못 사는 사람들이 너무 많은 거 아닙니까? 그래서 오병이어 기적이죠. 몇 명이 모였다고요? 2만 명이 모였다고요 2만 명이. 숫자가 지금으로 봐도 많은 숫자인데 우리 교인이 2만 명 됐으면 좋겠다. 지금도 이렇게 많은데 그 당시에 2만 명이라도 얼마나 많은 숫자입니까? 그들이 갑자기 민란이 일어나기도 하고 무슨 일이 일어날까 봐 사람들이 조마조마했죠 높은 지위에 있는 사람들이. 그래서 결국은 뭐 했죠? 결국은 예수 잡아 죽이자, 예수 잡아 십자가에 못 매달자. 그래서 예수가 십자가에 매달려 죽었습니다. 예수가 죽어야 됩니다. 죽어야 죄인이 살아나는 게 십자가 아닙니까? 그리고 예수가 부활해야 죄인이 같이 예수와 함께 부활되는 겁니다. 그런데 누구를 살리려고 온 거죠? 자기 백성을 살리려고 온 거죠. 근데 누가 죽였죠? 자기 백성이 예수를 죽인 겁니다. 여러분 이 사실을 알고 있으십니까? 자기 백성을 살리려고 예수님이 오셨는데 자기 백성이 자기를 살릴 예수를 자기가 죽인 거 아닙니까?"], ["22:58", "그리고 뭐가 된 거죠? 십자가의 이루어짐이 됐죠. 어차피 예수가 죽어야 되는 겁니다. 그래야 죄인들이 살아나는 게 원칙이니까요. 이 아이러니가 뭡니까? 그렇죠, 십자가입니다. 이 아이러니한 게 십자가입니다. 이게 말이 되냐? 로마 병정들에게 죽고 막 그랬어야 되는데 결국은 뭡니까 빌라도가 뭐라 하죠? 저를 살려야 된다고 얘기하죠. '저를 살릴까 죽일까?' 유대인들이 뭐라 합니까? '저는 죽어야 된다, 십자가에 못 박혀 죽으시오.' 누가 얘기한 겁니까? 유대인들이 얘기한 겁니다. 유대인들을 살리려고 왔던 예수를 유대인들이 죽이라고 해서 십자가에 죽고, 예수를 통해서 저들이 구원받습니다. 하나님의 자녀가 된 겁니다. 이 사건이 기독교 외에 더 있을까요? 그게 은혜입니다. 아멘. 여러분, 이 은혜는 우리가 측량할 수 없는 거고 이 은혜는 우리가 다 갚을 수 없는 거고 이 은혜는 우리의 머리의 계산으로 이해할 수 없는 범위입니다. 아멘."], ["24:09", "그래서 오직 하나님만 당신의 구원의 계획을 아시고 하나님만 죽은 자들을 살려내시는 하나님의 놀라운 사랑, 갓 이즈 러브(God is love), 하나님은 사랑입니다. 그게 우리가 다 이해할 수 없지만 그분 사랑이거든요. 여러분 잘 보세요. 예전에 공공의 적 영화 편 본 적 있죠? 1 때 아버지 돈을 빌려 갖고 주식에 투자했는데 그게 엄청나게 올랐죠. 그래 가지고 아들이 하는 말이 '아버지 조금만 기다리십시오. 이거 오르고 난 다음에 아버지 돈 드리겠습니다.' 그랬더니 아버지가 뭐라 그래요? '내가 그 돈 기다리다가 내가 진짜로 밥 굶어 죽는 아이들 내가 먹여 살려고 그 돈 내가 기부하려고 한다' 그러잖아요. 그랬더니 아들이 뭐라 합니까? '모르는 놈들 살리려고 아들을 죽입니까?' 이래 가지고 밤중에 몰래 찾아와 갖고 아버지 어머니 칼로 다 쑤셔 죽이잖아요. 그리고 딱 죽고 났는데 이 아들이 칼을 제대로 못 쓰니까 잘못돼 갖고 손톱이 요쪽에 하나 딱 끊어졌다 이거죠 떨어졌다 이거죠. 그거를 그 엄마가 그 20몇 방의 칼을 맞고도 그 끙끙거리면서 그거를 입에다 넣어 가지고 삼키고 죽어요."], ["25:27", "왜 그럴까요? '내 새끼가 내 배 찔러 죽여도 내 새끼가 나를 죽였다는 걸 감춰야 된다' 이거예요. 이게 진짜 아이러니한 겁니다. 부모는, 자식은 부모가 되지 않으면 이해 못 하는 거거든요. 왜? '아니 내가 우리 엄마를 우리 아빠를 막 찔러 죽였는데 세상에 그 아빠가 나를 엄마가 나를 감추기 위해서 그 손톱을 입에다 넣고 그리고 삼키고 있다는 거죠.' 그리고 죽은 거죠. 예수님이 그런 거 아닙니까? 하나님의 사랑이 우리가 측량할 수 없는 이해할 수 없는 범위 그 밖에 있는 겁니다. 그래서 우리는 늘 예수 사랑, 예수 사랑 얘기하지만 우리의 인생의 삶의 경험을 평생을 갖다가 쏟아내도 하나님의 사랑을 다 기록할 수 없습니다. '하늘을 두루마리 삼고 바다를 먹물 삼아도 한없는 하나님의 사랑 다 기록할 수 없네' 그거 알지 않습니까? 왜 기록할 수 없을까요? 우리 자체가 이해가 안 되는 구원, 우리 자체가 은혜로만 받아들일 수밖에 없는 구원, 더 이상은 우리가 생각도 못하고 더 이상은 이해의 범위를 넘어갈 수 없는 그 구원. 거기에 하나님이 우리를 향한 일방적인 사랑을 가지고 계십니다. 아멘."], ["26:46", "오늘 엘리사가 나아만을 살린 것도 아무 의미는 없습니다. 나아만하고 아무 조건도 없고 아무 이유도 없고 그냥 뭐 얘한테 잘 보일 필요도 없는 거 아닙니까? 그런데 엘리사는 아무 상관도 없는 자를 살려내잖아요. 예수님 동일한 거 아닙니까? 그 동일한 예수의 사랑에 뭐가 필요하다고요? 보답과 또 조건과 그런 것들은 아무 필요 없습니다. 뭐만 있어야 됩니까? 하나님의 사랑 안에서 오늘 주님과 함께 동행하는 우리의 삶의 태도, 이게 게하시가 이해할 수 없는 우리의 범위입니다. '하나님 제가 신앙생활 열심히 했습니다. 그런데 하나님 지금까지 하나님 뭘 그렇게 많이 주셨습니까?' 할 수 있습니다. 1년이 다 됐습니다. 열심히 신앙생활하고 기도 생활하고 또 예배드리고 주님 기뻐하는 거 열심히 했는데 '하나님 제가 얻은 게 뭡니까? 저한테 다 따라오는 보상이 어떤 겁니까?' 할 때 하나님은 꼭 우리에게 뭘 하죠? '내가 너를 사랑하고 내가 너를 구원하지 않느냐'라는 거. 그거 외에 하나님은 더 이상 우리에게 이것저것 자잘한 거를 만들 필요가 없습니다."], ["28:03", "자녀들이 부모한테 항상 하는 것 중에 제일 쓰라린 게 그거 아닙니까? 이거죠. '엄마, 나 이게 필요한데 좀 사 주면 안 될까?' '야, 엄마가 돈이 없다고 그 비싼 걸 사 주냐?' 그럴 때 자식이 하는 말 중에 하나가 뭡니까? '엄마가 지금까지 나한테 해 준 게 뭐가 있어? 뭘 해 줬어? 어떤 걸 해 준 거야? 해 준 게 뭐야?' 이 말 한마디 들을 때마다 부모는 속이 터집니다. '내가 너한테 해 준 게 얼마나 많아.' 그거를 다 나열하기에는 너무 치사한 겁니다. '야, 볼펜도 사 줬잖아, 크레파스도 사 줬잖아, 몽당연필도 사 주고 지우개도 사 주고 학교도 보내고 책가방도 사 주고 그리고 네가 좋아하는 계란말이도 해 주고' 이거 하나하나 다 얘기하기에는 너무 부모 치사하잖아요. 그런 거 다 얘기해 주기는. 근데 자식은 하나도 기억하지 못하잖아요. 태어날 때부터 똥 기저귀 찬 거부터 해 갖고 여기까지 키워 놨더니 하는 말이 뭡니까? '엄마가 나한테 해 준 게 뭐가 있어?' 그게 우리의 현실적인 성도들의 하나님을 향한 모습과 동일할 수도 있습니다."], ["29:16", "'내가 매일같이 살게 한 것도 주의 은혜 아닙니까?' 아멘. 그렇지 않습니까? '나는 눈 감은 적이 없다는 거 아닙니까? 나는 매일같이 눈을 뜨고 파수꾼의 경성함처럼 쳐다본다는 거 아닙니까? 어디를 가든 어느 쪽에 있든 항상 쳐다보고 살려내려고 하는 하나님의 의지.' '내가 산을 향하여 눈을 들리라 나의 도움이 어디서 올꼬 천지를 지으신 하나님께로부터 옵니다'라고 하는 고백이 오늘 우리의 신앙입니다. 그 신앙 속에 여러분들 오늘 마음을 굳히셔야 됩니다. 아멘. 여러분, 예수님은 정말 요셉과 비교할 수 없지만 요셉에서 저는 예수님에 대한 이해가 많이 됩니다. 17살 때 형들의 시기와 질투로 애굽으로 팔려 갔죠. 그리고 난 다음에 30살이 돼서 하나님의 의도대로 애굽의 국무총리가 됐습니다. 그리고 난 다음에 7년의 풍년을 맞이하고 2년의 흉년을 맞는 39살. 그때 어떤 일이 벌어지죠? 22년 차에 그때 형들과 아버지가 오지 않습니까? 굶어 죽을 것 같아서 양식 달라고 애굽으로 오죠."], ["30:33", "그때 요셉이 누구 만납니까? 형제들 만나지요. 만나서 형제들이 보면서 '우리 죽었구나. 왜? 요셉이 원수를 갚을 거야. 저놈이 17살 때 우리가 팔아놓은 걸 지금도 기억할 거야. 우리는 이미 죽었다.' 이렇게 하고 있었는데 뭡니까? '형들이여 두려워하지 마소서. 이런 일이 있을 줄 알고 하나님께서 나를 이미 미리 애굽으로 보내셨나이다.' 그래서 형들을 살리고 아버지를 살리는 일을 하나님이 계획하셨습니다. 얼마나 멋집니까? 이게 그리스도인의 모습입니다. 하나님의 은혜를 경험한 자들은 과거에 있는 나를 향한 어떤 원수 된 거, 죄악 된 거, 잘못된 것들을 계속 곱씹고 원수 갚을 날만 기다리고 '내가 원수는 외나무다리에서 만날 거야'라는 그 생각을 가지고 지금도 이를 팍팍 갈고 칼을 갈고 있다면 그리스도인 아닙니다. 하나님께서 그런 상황 속에서도 그를 건져내셔서 보기 좋게 내 원수보다 나를 더 높은 곳에 올려놓으시는 거 아닙니까? 그리고 나중에 그 원수가 내 발 앞에 와서 무릎을 꿇게 하실 때 어떤 일이 벌어지죠? '하나님께서 너를 살려내시려고 나를 먼저 보내셨다'고 하는 요셉의 고백이 오늘 예수 그리스도의 고백이며 또 우리들의 믿음의 자녀들의 고백이 될 거라고 저는 확신합니다. 아멘."], ["32:04", "여러분, 그리스도 안에서의 승리는 뭡니까? 가서 두들겨 패는 게 승리가 아니라 얻어맞아도 하나님이 우리 편이다, 억울해도 하나님이 나와 함께 하신다, 답답하고 원망스러운 얘기가 있을지라도 그래도 하나님 나를 기억하소서 했던 것이 오늘 우리의 신앙자들의 자세입니다. 다윗을 보십시오. 그는 골리앗을 물리치고 난 다음부터 사울에게 엄청나게 도망 다니는 신세가 되죠. 그리고 난 다음에 어느 순간에 하나님의 은혜로우심과 자비하심으로 이스라엘 또 유다의 두 나라를 합쳐서 사울 다음으로 2대 왕이 됩니다. 그리고 난 다음에 그다음부터 더 멋있는 인생을 살아갈 줄 알았더니 다윗을 보면서 그 마음이 생겼죠. 뭐냐면 '사람은 죄를 안 짓는 게 아니라 죄를 지을 능력이 없어서 못 짓는구나'라는 것을 다윗이 깨닫게 했죠. 다윗이 왕이 되고 나서부터 제일 먼저 건드렸던 게 뭡니까? 밧세바를 건드렸고 우리아의 아내 밧세바를 범하고 아이를 배게 하고 그리고 우리아를 전방에서 죽이게 되고 그런 끔찍한 일을 경험하잖아요."], ["33:27", "그러고 난 다음에 그 아들들이 또 죽게 되고 또 서로 자기 부하가 자기의 사랑하는 아들을 죽이게 되고 이런 엄청난 일들이 벌어집니다. 왕이 되고 난 다음에 평안할 줄 알았거든요. 잘 살 줄 알았거든요. 잘될 줄 알았거든요. 근데 잘되는 게 아니라 더 어두움으로 들어가는 다윗의 인생이었습니다. 말년까지 다윗은 기쁨이 별로 없습니다. 그럼에도 불구하고 다윗은 그 말년에 시편 23편을 씁니다. 그리고 23편에 '여호와가 나의 목자가 되시니 내가 부족함이 없으리로다.' 저는 그때 엄청난 감동을 받았습니다. 왜 그럴까요? 당연히 다윗은 부족함이 없겠지. 왜? 이스라엘의 왕으로 있는데 뭐가 부족하겠어? 그럴 줄 알았더니 다윗은 '내가 이스라엘의 왕이 되어서 부족함이 없도다'라고 얘기한 게 아니라 '여호와가 나의 목자가 되시니 내가 부족함이 없도다.' 하나님은 그 항복을 받아내시더라는 거예요. 다윗의 그 전 생애를 통해서 하나님이 영광을 받아내시는 그 일거리는 바로 뭡니까? '하나님이여, 내가 당신 때문에 부족함이 없었습니다.'"], ["34:44", "'내 환경이 왕이고 내 나라가 건장하고 부하들이 많고 수많은 사람들이 내 옆에 있어서 내가 아무렇지도 않고 내 인생의 행복 말고는 찾을 길이 없는 줄 알았더니, 왕이 되고 난 다음부터 저는 파란만장한 인생을 살았는데 어느 순간 죽을지도 모르는 위기 속에서도, 아들 때문에도 위기였죠 아들이 왕권 찬탈을 하고 그런 위기 속에서도 여호와가 나의 목자가 되셨습니다'라는 마지막 인생 속에서 하나님이 다윗을 통해서 그 항복을 받아내시더라는 거 아닙니까? 여러분 하나님 앞에만큼은 고집을 세우지 마십시오. 하나님은 어떻게든 꺾으셔서 당신 앞에 영광을 받아내십니다. 오늘 그 일이 이루기까지 하나님은 우리를 붙드시고 하나님 우리를 사랑하시며 하나님 우리를 끝까지 책임지십니다. 아멘. 그리고 우리를 가장 멋진 모습으로 만들어 내시기로 결심한 거, 작정하신 것을 이루십니다. 아멘."], ["35:52", "내가 훌륭하려고 노력하는 것도 중요합니다. 그런데 이미 하나님은 내가 훌륭해지기를 원하십니다. 그래서 하나하나를 간섭하시고 인도하십니다. 구원이 뭡니까? 구원은 하나님이 죄인 된 나를 살려내시는 것도 구원이지만 하나님이 내 인생에 개입하셔서 나를 간섭하신다고 하는 게 구원입니다. 그다음부터 내 생명은 누구 겁니까? 하나님 겁니다. 내 인생은 누구 겁니까? 하나님 겁니다. 내 모든 삶의 영역은 다 하나님의 지배와 통치 아래에서 만들어질 겁니다. 그게 크리스천이고 성도입니다. 아멘. 오늘 그거를 우리 마음속에 느끼시고 주님과 함께 걸어가는 거룩한 백성으로서의 삶을 살 때, 우리는 보상을 말하는 기독교가 아니라 은혜를 경험하고 '하나님 감사합니다'라고 외치는 기독교로 우리의 인생의 결론을 만들어 낼 겁니다. 아멘."], ["36:53", "다윗에게만 받아내겠습니까 그 항복을? 아니요. 우리에게도 그 항복을 받아내실 겁니다. 마지막이 뭡니까? '여호와는 나의 목자가 되시니 내가 부족함이 없었습니다.' 그 항복을 꼭 받아내실 겁니다. 거기에 하나님은 우리의 왕이 되시며 하나님은 우리를 만드신 창조자가 되시며 하나님은 우리와 함께 하시는 근원이 되십니다. 아멘. 그리고 또 한 가지만 더 붙이면 이제 성탄절이겠지만 임마누엘 되신 하나님 그분이 나와 함께 하심으로 오늘의 이 위태한 현재의 우리의 삶을 당당하게 이기게 만드시고, 그리고 이 어렵고 고난 중한 이 삶을 고통 중에서 우리를 끌어내셔서 우리를 거룩함에 동참하게 하시고, '내가 너를 붙들고 있으니 안심하라, 내니 두려워하지 말라' 말씀하시는 하나님 앞에 우리는 평화롭게 우리 인생의 결론으로 아멘 하고 할렐루야를 외칠 수 있습니다. 그렇게 되시길 여러분 다시 한번 손꼽아 기도하시고요, 올 연말 얼마 안 남았지만 12월 말까지 가기 전까지 오늘 다시 한번 1년을 재조명해 보시고 '주님 내가 많은 것들에 감사를 올립니다, 많은 것들에 감사합니다'라고 하는 그 결심과 감사와 의지가 주님의 영광이 되는 것에 참여가 되기를 주의 이름으로 축복합니다."]];
const toSec=t=>t.split(':').reduce((a,b)=>a*60+ +b,0);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const S=T.map(([t])=>toSec(t));
const W=T.map(([,x])=>x.split(/\s+/).filter(Boolean));
// 단어별 대략적 시작 시간: 문단 시간 사이를 글자 수 비율로 나눔
const WT=W.map((ws,i)=>{const a=S[i],b=i+1<S.length?S[i+1]:END;const tot=ws.reduce((n,w)=>n+w.length+1,0);let c=0;return ws.map(w=>{const t=a+(b-a)*c/tot;c+=w.length+1;return t;});});
const list=document.getElementById('list'), scroller=document.getElementById('scroll');
list.innerHTML=T.map(([t],i)=>`<div class="seg" data-i="${i}"><div class="av">임</div><div><div class="who">임헌규 목사<button data-s="${S[i]}">${t}</button></div><div class="tx"></div></div></div>`).join('');
const segs=[...list.children];
function renderTx(i,k){const tx=segs[i].querySelector('.tx');tx.innerHTML=W[i].map((w,j)=>{let h=esc(w);if(k&&w.includes(k))h=h.split(esc(k)).join('<mark>'+esc(k)+'</mark>');return `<span class="w" data-i="${i}" data-j="${j}">${h}</span>`;}).join(' ');}
T.forEach((_,i)=>renderTx(i,''));
const q=document.getElementById('q'),cnt=document.getElementById('cnt');
q.addEventListener('input',()=>{const k=q.value.trim();let n=0;segs.forEach((el,i)=>{renderTx(i,k);const ok=!k||T[i][1].includes(k);el.classList.toggle('hide',!ok);if(k&&ok)n++;});cnt.textContent=k?`'${k}' ${n}개 구간`:'';});

/* ---- 유튜브 플레이어 ---- */
let player=null, ready=false, pending=null;
const START=(()=>{const m=location.hash.match(/t=(\d+)/);return m?+m[1]:S[0];})();
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d;}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let lastSave=0;
function saveProg(t,force){if(!force&&Date.now()-lastSave<5000)return;lastSave=Date.now();const P=lsGet('sermon-progress',{});const o=P[VID]||{};const dur=(player&&player.getDuration&&player.getDuration())||END;P[VID]={t:Math.floor(t),at:Date.now(),done:o.done||t/dur>=0.9};lsSet('sermon-progress',P);}
const bm=document.getElementById('bm');
const drawBm=()=>{const on=lsGet('sermon-saved',[]).includes(VID);bm.classList.toggle('on',on);bm.textContent=on?'★ 저장됨':'☆ 저장';};
bm.onclick=()=>{let s=lsGet('sermon-saved',[]);s=s.includes(VID)?s.filter(v=>v!==VID):[VID,...s];lsSet('sermon-saved',s);drawBm();};
drawBm();
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('yt',{videoId:VID,playerVars:{playsinline:1,rel:0,start:START},events:{onReady:()=>{ready=true;if(pending!=null){seek(pending);pending=null;}}}});};
function seek(t){if(!ready){pending=t;return;}player.seekTo(Math.max(0,t-0.5),true);player.playVideo();}

/* ---- 재생 위치에 맞춰 스크립트 따라가기 ---- */
let follow=true, lastI=-1, lastW=null, userScrollAt=0;
/* ---- 설정: 글자 크기 ---- */
(()=>{const sizes=[[0.88,'가',13],[1,'가',15],[1.15,'가',17],[1.3,'가',19],[1.5,'가',21]];
  let cur=1; try{const v=parseFloat(localStorage.getItem('sermon-font'));if(v)cur=v;}catch(e){}
  const box=document.getElementById('fsz');
  const apply=v=>{cur=v;document.documentElement.style.setProperty('--fz',v);try{localStorage.setItem('sermon-font',v);}catch(e){}box.innerHTML=sizes.map(([z,t,px])=>`<button data-z="${z}" class="${z===cur?'on':''}" style="font-size:${px}px" aria-label="글자 크기 ${Math.round(z*100)}%">${t}</button>`).join('');};
  box.onclick=e=>{const b=e.target.closest('button');if(b)apply(+b.dataset.z);};
  document.getElementById('gear').onclick=()=>document.getElementById('setp').classList.toggle('on');
  apply(cur);})();
const fbtn=document.getElementById('follow');
fbtn.onclick=()=>{follow=!follow;fbtn.classList.toggle('on',follow);fbtn.textContent=follow?'따라가기 ON':'따라가기 OFF';if(follow)lastI=-1;};
scroller.addEventListener('touchmove',()=>userScrollAt=Date.now(),{passive:true});
scroller.addEventListener('wheel',()=>userScrollAt=Date.now(),{passive:true});
function locate(t){let i=0;for(let k=0;k<S.length;k++)if(S[k]<=t)i=k;let j=0;WT[i].forEach((wt,k)=>{if(wt<=t)j=k;});return [i,j];}
setInterval(()=>{
  if(!ready||!player.getPlayerState)return; const st=player.getPlayerState(); if(st!==1&&st!==3)return;
  const t=player.getCurrentTime(); saveProg(t); if(t<S[0]-1)return;
  const [i,j]=locate(t);
  if(i!==lastI){segs.forEach(s=>s.classList.remove('now'));segs[i].classList.add('now');lastI=i;
    if(follow&&Date.now()-userScrollAt>4000&&document.getElementById('txt').classList.contains('on')){const r=segs[i].offsetTop-8;scroller.scrollTo({top:r,behavior:'smooth'});}}
  const w=segs[i].querySelector(`.w[data-j="${j}"]`); if(w!==lastW){if(lastW)lastW.classList.remove('say');if(w)w.classList.add('say');lastW=w;}
},250);

window.addEventListener('pagehide',()=>{try{if(ready)saveProg(player.getCurrentTime(),true);}catch(e){}});
document.addEventListener('visibilitychange',()=>{try{if(document.hidden&&ready)saveProg(player.getCurrentTime(),true);}catch(e){}});


/* ---- 듣기 모드: 영상은 작게, 자막은 크게 ---- */
const fmtT=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`;};
const ppBtn=document.getElementById('pp'), tmEl=document.getElementById('tm'), tdEl=document.getElementById('td'), skEl=document.getElementById('sk');
let dragging=false;
function setMini(on){document.body.classList.toggle('mini',on);lsSet('sermon-mini',on);document.getElementById('lm').textContent=on?'🎬 영상 크게':'🎧 듣기 모드';}
document.getElementById('lm').onclick=()=>setMini(!document.body.classList.contains('mini'));
document.getElementById('ex').onclick=()=>setMini(false);
ppBtn.onclick=()=>{if(!ready){pending=START;return;}const st=player.getPlayerState();if(st===1||st===3)player.pauseVideo();else player.playVideo();};
const jump=d=>{if(!ready)return;player.seekTo(Math.max(0,player.getCurrentTime()+d),true);};
let SKIP=10; try{const v=parseInt(localStorage.getItem('sermon-skip'));if(v)SKIP=v;}catch(e){}
const bkB=document.getElementById('bk'), fwB=document.getElementById('fw'), skp=document.getElementById('skp');
function setSkip(v){SKIP=v;try{localStorage.setItem('sermon-skip',v);}catch(e){}bkB.textContent='-'+v;fwB.textContent='+'+v;bkB.setAttribute('aria-label',v+'초 뒤로');fwB.setAttribute('aria-label',v+'초 앞으로');
  skp.innerHTML=[5,10,15,30].map(s=>`<button data-s="${s}" class="${s===SKIP?'on':''}" style="font-size:13px;min-width:46px">${s}초</button>`).join('');}
skp.onclick=e=>{const b=e.target.closest('button');if(b)setSkip(+b.dataset.s);};
bkB.onclick=()=>jump(-SKIP); fwB.onclick=()=>jump(SKIP);
setSkip(SKIP);
skEl.addEventListener('input',()=>{dragging=true;document.getElementById('line').style.setProperty('--p',(skEl.value/10)+'%');const dur=(ready&&player.getDuration())||END;tmEl.textContent=fmtT(skEl.value/1000*dur);});
skEl.addEventListener('change',()=>{dragging=false;if(!ready)return;const dur=player.getDuration()||END;userScrollAt=0;player.seekTo(skEl.value/1000*dur,true);});
setInterval(()=>{if(!ready||!player.getPlayerState)return;const st=player.getPlayerState();ppBtn.textContent=(st===1||st===3)?'❚❚':'▶';const dur=player.getDuration()||END, t=player.getCurrentTime();tdEl.textContent=fmtT(dur);if(!dragging){tmEl.textContent=fmtT(t);skEl.value=Math.round(t/dur*1000);document.getElementById('line').style.setProperty('--p',(skEl.value/10)+'%');}},500);
tdEl.textContent=fmtT(END);
if(lsGet('sermon-mini',false)) setMini(true);
document.getElementById('mtitle').textContent=document.querySelector('.head h1').textContent;

/* ---- 단어·시간 누르면 그 위치부터 재생 ---- */
list.addEventListener('click',e=>{
  const w=e.target.closest('.w'); if(w){userScrollAt=0;seek(WT[+w.dataset.i][+w.dataset.j]);return;}
  const b=e.target.closest('.who button'); if(b){userScrollAt=0;seek(+b.dataset.s);}
});

/* ---- 탭 / 구간 바로가기 ---- */
const tabs=document.querySelectorAll('.tabs button');
function show(t){tabs.forEach(b=>b.classList.toggle('on',b.dataset.t===t));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===t));scroller.scrollTop=0;}
tabs.forEach(b=>b.onclick=()=>show(b.dataset.t));
document.querySelectorAll('.chap a').forEach(a=>a.onclick=e=>{e.preventDefault();show('txt');lastI=-1;userScrollAt=0;seek(+a.dataset.s);});
</script>
</body>
</html>
