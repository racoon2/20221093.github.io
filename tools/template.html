<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · 말씀 클래스</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b1d21;--sub:#6b7280;--line:#e6e8ec;--accent:#12a37a;--accent-soft:#e7f6f1;--hl:#fff3b0}
@media (prefers-color-scheme: dark){:root{--bg:#121417;--card:#1c1f24;--ink:#eceef1;--sub:#9aa1ab;--line:#2b2f36;--accent:#3cc99c;--accent-soft:#183a30;--hl:#5a4d10}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;max-width:720px;margin:0 auto}
.top{flex:none;background:#000}
.vid{position:relative;width:100%;aspect-ratio:16/9}
.vid{max-height:38vh;width:min(100%,calc(38vh*16/9));margin:0 auto}
.pbar{flex:none;position:relative;display:flex;align-items:center;justify-content:space-between;background:var(--card);border-top:0;padding:10px 14px calc(6px + env(safe-area-inset-bottom))}
.pbar .seek{position:absolute;left:0;right:0;top:-7px;height:14px;margin:0;width:100%;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
.pbar .seek::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--line) var(--p,0%))}
.pbar .seek::-moz-range-track{height:3px;background:var(--line)}
.pbar .seek::-moz-range-progress{height:3px;background:var(--accent)}
.pbar .seek::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);margin-top:-5px;border:0}
.pbar .seek::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);border:0}
.pbar .t{flex:1;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.pbar .t.r{text-align:right}
.pbar .btns{display:flex;align-items:center;gap:16px}
.pbar .sk{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--sub);font:inherit;font-size:11px;cursor:pointer}
.pbar .pp{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:15px;cursor:pointer}
.mctl{display:none}
.lm{border:1px solid var(--line);background:none;color:var(--sub);border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer;margin-left:6px}
body.mini{display:flex!important;flex-direction:column;max-width:720px;height:100vh}
body.mini .top{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
body.mini .vid{flex:none;width:200px!important;background:#000;max-height:none;margin:0;border-radius:8px;overflow:hidden}
body.mini .mctl{display:flex;flex:1;min-width:0;flex-direction:column;gap:6px}
body.mini .head{display:none}
body.mini .tabs,body.mini .scroll{border-left:0;margin:0}
body.mini .scroll{flex:1}
.mctl .mt{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mctl .mr{display:flex;align-items:center;gap:8px}
.mctl .pp{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:14px;cursor:pointer}
.mctl .tm{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;flex:1}
.mctl .ex{flex:none;border:1px solid var(--line);background:none;color:var(--sub);border-radius:999px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
@media (min-width:900px){
  .pbar{grid-column:1/3;grid-row:4}
  body{max-width:1280px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(400px,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;height:100vh;column-gap:0}
  .top{grid-column:1;grid-row:1/3;background:#000;display:flex;align-items:center;justify-content:center}
  .vid{max-height:none;width:100%}
  .head{grid-column:1;grid-row:3;align-self:start;border-bottom:0;padding:14px 18px}
  .head h1{font-size:20px}
  .tabs{grid-column:2;grid-row:1;border-left:1px solid var(--line)}
  .scroll{grid-column:2;grid-row:2/4;border-left:1px solid var(--line);background:var(--bg)}
}
.vid #yt,.vid iframe{position:absolute;inset:0;width:100%;height:100%}
.head{flex:none;background:var(--card);padding:10px 14px;border-bottom:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;align-items:center}
.bm{border:1px solid var(--line);background:none;color:var(--sub);border-radius:999px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.bm.on{color:#fff;background:var(--accent);border-color:var(--accent)}
.back{display:inline-block;font-size:13px;color:var(--accent);text-decoration:none;margin-bottom:4px;font-weight:500}
.head h1{font-size:16px;margin:0 0 2px;line-height:1.35}
.head .meta{font-size:12.5px;color:var(--sub)}
.tabs{flex:none;display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:11px 0;font:inherit;font-size:14.5px;color:var(--sub);border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);font-weight:700;border-color:var(--accent)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
section{display:none;padding:10px 14px 40px}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.card p{margin:0;font-size:calc(15px * var(--fz,1));line-height:1.75}
.kw{display:flex;flex-wrap:wrap;gap:6px}.kw span{font-size:13px;background:var(--accent-soft);color:var(--accent);padding:5px 10px;border-radius:999px}
ol.pts{margin:0;padding:0;list-style:none;counter-reset:p}
ol.pts li{counter-increment:p;position:relative;padding:0 0 14px 34px;font-size:15px;line-height:1.7}
ol.pts li::before{content:counter(p);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
ol.pts li b{display:block} ol.pts li small{color:var(--sub);font-size:13.5px}
.chap a{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14.5px}
.chap a:first-child{border-top:0}
.chap time{color:var(--accent);min-width:44px;font-weight:500;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;align-items:center;padding:0 0 8px}
.tools input{flex:1;font:inherit;font-size:15px;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.follow{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:8px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.follow.on{color:var(--accent);border-color:var(--accent)}
.count{font-size:12.5px;color:var(--sub);min-height:0}
.tip{font-size:12.5px;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.seg{display:flex;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);border-radius:10px}
.seg.now{background:var(--accent-soft)}
.av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.who{font-size:13px;color:var(--sub);margin-bottom:3px}
.who button{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;margin-left:6px;padding:0;cursor:pointer;font-variant-numeric:tabular-nums}
.tx{font-size:calc(15.5px * var(--fz,1));line-height:1.85;word-break:keep-all}
ol.pts li{font-size:calc(15px * var(--fz,1))!important}
.gear{flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:8px 11px;font:inherit;font-size:12.5px;cursor:pointer}
.tools input{min-width:0;width:0}
.setp .row{flex-wrap:wrap}
.setp{display:none;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.setp.on{display:block}
.setp .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.setp .lb{font-size:13.5px;font-weight:500}
.fsz{display:flex;gap:4px}
.fsz button{border:1px solid var(--line);background:none;color:var(--sub);border-radius:8px;min-width:38px;padding:6px 0;cursor:pointer;font-family:inherit}
.fsz button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.setp .pv{margin-top:10px;font-size:calc(15.5px * var(--fz,1));line-height:1.8;color:var(--sub)}
.w{cursor:pointer;border-radius:3px}
.w.say{background:var(--accent);color:#fff}
mark{background:var(--hl);color:inherit;border-radius:3px}
.hide{display:none}
.note{font-size:12.5px;color:var(--sub);line-height:1.6;padding:14px 4px 0}
body.mini{display:flex!important}
</style>
</head>
<body>
<div class="top"><div class="vid"><div id="yt"></div></div><div class="mctl"><div class="mt"><a href="../sermon.html" style="color:var(--accent);text-decoration:none;margin-right:6px" aria-label="말씀 클래스로">←</a><span id="mtitle"></span></div><div class="mr"><button class="ex" id="ex">영상 크게</button></div></div></div>
<div class="head">
  <div class="hrow"><a class="back" href="../sermon.html">← 말씀 클래스</a><span><button class="bm" id="bm">☆ 저장</button><button class="lm" id="lm">🎧 듣기 모드</button></span></div>
  <h1>__TITLE__</h1>
  <div class="meta">__METALINE__</div>
</div>
<nav class="tabs"><button class="on" data-t="txt">스크립트</button><button data-t="sum">요약</button></nav>
<div class="scroll" id="scroll">
<section id="txt" class="on">
  <div class="tip">💡 단어를 누르면 영상이 그 부분부터 재생돼요</div>
  <div class="tools"><input id="q" type="search" placeholder="스크립트 검색"><button class="follow on" id="follow">따라가기 ON</button><button class="gear" id="gear" aria-label="설정">⚙</button></div>
  <div class="setp" id="setp"><div class="row"><span class="lb">글자 크기</span><div class="fsz" id="fsz"></div></div><div class="pv">하나님은 예배하는 자를 찾으십니다. 아멘.</div><div class="row" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><span class="lb">건너뛰기 시간</span><div class="fsz" id="skp"></div></div></div>
  <div class="count" id="cnt"></div>
  <div id="list"></div>
  <p class="note">유튜브 자동 자막__FROMNOTE__을 바탕으로 정리했습니다. 잘못 인식된 성경 인명·지명 등은 바로잡았습니다. 단어별 재생 위치는 문단 시간을 기준으로 계산한 값이라 몇 초 정도 차이가 날 수 있어요.</p>
</section>
__SUMMARY__
</div>
<div class="pbar">
  <input class="seek" type="range" id="sk" min="0" max="1000" value="0" aria-label="재생 위치">
  <span class="t" id="tm">0:00</span>
  <div class="btns">
    <button class="sk" id="bk" aria-label="10초 뒤로">-10</button>
    <button class="pp" id="pp" aria-label="재생/일시정지">▶</button>
    <button class="sk" id="fw" aria-label="10초 앞으로">+10</button>
  </div>
  <span class="t r" id="td">0:00</span>
</div>
<script>
const VID=__VID__, END=__END__;
const T=__T__;
const toSec=t=>t.split(':').reduce((a,b)=>a*60+ +b,0);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const S=T.map(([t])=>toSec(t));
const W=T.map(([,x])=>x.split(/\s+/).filter(Boolean));
// 단어별 대략적 시작 시간: 문단 시간 사이를 글자 수 비율로 나눔
const WT=W.map((ws,i)=>{const a=S[i],b=i+1<S.length?S[i+1]:END;const tot=ws.reduce((n,w)=>n+w.length+1,0);let c=0;return ws.map(w=>{const t=a+(b-a)*c/tot;c+=w.length+1;return t;});});
const list=document.getElementById('list'), scroller=document.getElementById('scroll');
list.innerHTML=T.map(([t],i)=>`<div class="seg" data-i="${i}"><div class="av">임</div><div><div class="who">임헌규 목사<button data-s="${S[i]}">${t}</button></div><div class="tx"></div></div></div>`).join('');
const segs=[...list.children];
function renderTx(i,k){const tx=segs[i].querySelector('.tx');tx.innerHTML=W[i].map((w,j)=>{let h=esc(w);if(k&&w.includes(k))h=h.split(esc(k)).join('<mark>'+esc(k)+'</mark>');return `<span class="w" data-i="${i}" data-j="${j}">${h}</span>`;}).join(' ');}
T.forEach((_,i)=>renderTx(i,''));
const q=document.getElementById('q'),cnt=document.getElementById('cnt');
q.addEventListener('input',()=>{const k=q.value.trim();let n=0;segs.forEach((el,i)=>{renderTx(i,k);const ok=!k||T[i][1].includes(k);el.classList.toggle('hide',!ok);if(k&&ok)n++;});cnt.textContent=k?`'${k}' ${n}개 구간`:'';});

/* ---- 유튜브 플레이어 ---- */
let player=null, ready=false, pending=null;
const START=(()=>{const m=location.hash.match(/t=(\d+)/);return m?+m[1]:S[0];})();
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d;}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let lastSave=0;
function saveProg(t,force){if(!force&&Date.now()-lastSave<5000)return;lastSave=Date.now();const P=lsGet('sermon-progress',{});const o=P[VID]||{};const dur=(player&&player.getDuration&&player.getDuration())||END;P[VID]={t:Math.floor(t),at:Date.now(),done:o.done||t/dur>=0.9};lsSet('sermon-progress',P);}
const bm=document.getElementById('bm');
const drawBm=()=>{const on=lsGet('sermon-saved',[]).includes(VID);bm.classList.toggle('on',on);bm.textContent=on?'★ 저장됨':'☆ 저장';};
bm.onclick=()=>{let s=lsGet('sermon-saved',[]);s=s.includes(VID)?s.filter(v=>v!==VID):[VID,...s];lsSet('sermon-saved',s);drawBm();};
drawBm();
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{player=new YT.Player('yt',{videoId:VID,playerVars:{playsinline:1,rel:0,start:START},events:{onReady:()=>{ready=true;if(pending!=null){seek(pending);pending=null;}}}});};
function seek(t){if(!ready){pending=t;return;}player.seekTo(Math.max(0,t-0.5),true);player.playVideo();}

/* ---- 재생 위치에 맞춰 스크립트 따라가기 ---- */
let follow=true, lastI=-1, lastW=null, userScrollAt=0;
/* ---- 설정: 글자 크기 ---- */
(()=>{const sizes=[[0.88,'가',13],[1,'가',15],[1.15,'가',17],[1.3,'가',19],[1.5,'가',21]];
  let cur=1; try{const v=parseFloat(localStorage.getItem('sermon-font'));if(v)cur=v;}catch(e){}
  const box=document.getElementById('fsz');
  const apply=v=>{cur=v;document.documentElement.style.setProperty('--fz',v);try{localStorage.setItem('sermon-font',v);}catch(e){}box.innerHTML=sizes.map(([z,t,px])=>`<button data-z="${z}" class="${z===cur?'on':''}" style="font-size:${px}px" aria-label="글자 크기 ${Math.round(z*100)}%">${t}</button>`).join('');};
  box.onclick=e=>{const b=e.target.closest('button');if(b)apply(+b.dataset.z);};
  document.getElementById('gear').onclick=()=>document.getElementById('setp').classList.toggle('on');
  apply(cur);})();
const fbtn=document.getElementById('follow');
fbtn.onclick=()=>{follow=!follow;fbtn.classList.toggle('on',follow);fbtn.textContent=follow?'따라가기 ON':'따라가기 OFF';if(follow)lastI=-1;};
scroller.addEventListener('touchmove',()=>userScrollAt=Date.now(),{passive:true});
scroller.addEventListener('wheel',()=>userScrollAt=Date.now(),{passive:true});
function locate(t){let i=0;for(let k=0;k<S.length;k++)if(S[k]<=t)i=k;let j=0;WT[i].forEach((wt,k)=>{if(wt<=t)j=k;});return [i,j];}
setInterval(()=>{
  if(!ready||!player.getPlayerState)return; const st=player.getPlayerState(); if(st!==1&&st!==3)return;
  const t=player.getCurrentTime(); saveProg(t); if(t<S[0]-1)return;
  const [i,j]=locate(t);
  if(i!==lastI){segs.forEach(s=>s.classList.remove('now'));segs[i].classList.add('now');lastI=i;
    if(follow&&Date.now()-userScrollAt>4000&&document.getElementById('txt').classList.contains('on')){const r=segs[i].offsetTop-8;scroller.scrollTo({top:r,behavior:'smooth'});}}
  const w=segs[i].querySelector(`.w[data-j="${j}"]`); if(w!==lastW){if(lastW)lastW.classList.remove('say');if(w)w.classList.add('say');lastW=w;}
},250);

window.addEventListener('pagehide',()=>{try{if(ready)saveProg(player.getCurrentTime(),true);}catch(e){}});
document.addEventListener('visibilitychange',()=>{try{if(document.hidden&&ready)saveProg(player.getCurrentTime(),true);}catch(e){}});


/* ---- 듣기 모드: 영상은 작게, 자막은 크게 ---- */
const fmtT=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`;};
const ppBtn=document.getElementById('pp'), tmEl=document.getElementById('tm'), tdEl=document.getElementById('td'), skEl=document.getElementById('sk');
let dragging=false;
function setMini(on){document.body.classList.toggle('mini',on);lsSet('sermon-mini',on);document.getElementById('lm').textContent=on?'🎬 영상 크게':'🎧 듣기 모드';}
document.getElementById('lm').onclick=()=>setMini(!document.body.classList.contains('mini'));
document.getElementById('ex').onclick=()=>setMini(false);
ppBtn.onclick=()=>{if(!ready){pending=START;return;}const st=player.getPlayerState();if(st===1||st===3)player.pauseVideo();else player.playVideo();};
const jump=d=>{if(!ready)return;player.seekTo(Math.max(0,player.getCurrentTime()+d),true);};
let SKIP=10; try{const v=parseInt(localStorage.getItem('sermon-skip'));if(v)SKIP=v;}catch(e){}
const bkB=document.getElementById('bk'), fwB=document.getElementById('fw'), skp=document.getElementById('skp');
function setSkip(v){SKIP=v;try{localStorage.setItem('sermon-skip',v);}catch(e){}bkB.textContent='-'+v;fwB.textContent='+'+v;bkB.setAttribute('aria-label',v+'초 뒤로');fwB.setAttribute('aria-label',v+'초 앞으로');
  skp.innerHTML=[5,10,15,30].map(s=>`<button data-s="${s}" class="${s===SKIP?'on':''}" style="font-size:13px;min-width:46px">${s}초</button>`).join('');}
skp.onclick=e=>{const b=e.target.closest('button');if(b)setSkip(+b.dataset.s);};
bkB.onclick=()=>jump(-SKIP); fwB.onclick=()=>jump(SKIP);
setSkip(SKIP);
skEl.addEventListener('input',()=>{dragging=true;skEl.style.setProperty('--p',(skEl.value/10)+'%');const dur=(ready&&player.getDuration())||END;tmEl.textContent=fmtT(skEl.value/1000*dur);});
skEl.addEventListener('change',()=>{dragging=false;if(!ready)return;const dur=player.getDuration()||END;userScrollAt=0;player.seekTo(skEl.value/1000*dur,true);});
setInterval(()=>{if(!ready||!player.getPlayerState)return;const st=player.getPlayerState();ppBtn.textContent=(st===1||st===3)?'❚❚':'▶';const dur=player.getDuration()||END, t=player.getCurrentTime();tdEl.textContent=fmtT(dur);if(!dragging){tmEl.textContent=fmtT(t);skEl.value=Math.round(t/dur*1000);skEl.style.setProperty('--p',(skEl.value/10)+'%');}},500);
tdEl.textContent=fmtT(END);
if(lsGet('sermon-mini',false)) setMini(true);
document.getElementById('mtitle').textContent=document.querySelector('.head h1').textContent;

/* ---- 단어·시간 누르면 그 위치부터 재생 ---- */
list.addEventListener('click',e=>{
  const w=e.target.closest('.w'); if(w){userScrollAt=0;seek(WT[+w.dataset.i][+w.dataset.j]);return;}
  const b=e.target.closest('.who button'); if(b){userScrollAt=0;seek(+b.dataset.s);}
});

/* ---- 탭 / 구간 바로가기 ---- */
const tabs=document.querySelectorAll('.tabs button');
